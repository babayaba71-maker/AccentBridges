<script>
/* ============================================================
   VALERIE 3 — HOLOGRAM WALLPAPER v0.1
   Estados: passive → materializing (3s) → active → dematerializing (2.5s) → passive
   Orb respirando + partículas orbitales + silueta de partículas + wordmark
   ============================================================ */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* ---- Puntos objetivo: silueta de Valerie — cabello largo lacio con
   raya al medio cayendo sobre los hombros, óvalo de cara, cuello alto
   recto (turtleneck). Referencia: foto enviada por JJ 10-sep-2026. ---- */
function buildSilhouette() {
  const off = document.createElement("canvas");
  off.width = 300; off.height = 470;
  const c = off.getContext("2d");
  c.fillStyle = "#fff";
  // volumen principal cabeza + cabello (más alto/ovalado que un círculo simple)
  c.beginPath(); c.ellipse(150, 125, 76, 96, 0, 0, Math.PI * 2); c.fill();
  // mechones largos cayendo sobre los hombros (izquierda / derecha)
  c.beginPath(); c.ellipse(64, 292, 32, 142, 0.12, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(236, 292, 32, 142, -0.12, 0, Math.PI * 2); c.fill();
  // cuello
  c.fillRect(128, 196, 44, 32);
  // hombros / cuello de tortuga — líneas rectas, poco ensanche (no trapezoide abierto)
  c.beginPath();
  c.moveTo(150, 216);
  c.bezierCurveTo(100, 223, 62, 252, 55, 322);
  c.lineTo(55, 470); c.lineTo(245, 470); c.lineTo(245, 322);
  c.bezierCurveTo(238, 252, 200, 223, 150, 216);
  c.fill();
  const data = c.getImageData(0, 0, 300, 470).data;
  const pts = [];
  for (let y = 0; y < 470; y += 7) {
    for (let x = 0; x < 300; x += 7) {
      if (data[(y * 300 + x) * 4 + 3] > 128) pts.push([x, y]);
    }
  }
  return pts;
}
const SIL = buildSilhouette();

/* ---- Partículas ---- */
const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
const N = isMobile ? 130 : 200;
const P = [];
function rnd(a, b) { return a + Math.random() * (b - a); }

for (let i = 0; i < N; i++) {
  const ang = Math.random() * Math.PI * 2;
  const rad = rnd(60, Math.max(W, H) * .55);
  P.push({
    hx: 0, hy: 0,                 // home (se recalcula al usar)
    x: 0, y: 0,
    ox: Math.cos(ang) * rad, oy: Math.sin(ang) * rad, // órbita pasiva
    oang: rnd(0.02, 0.09) * (Math.random() < .5 ? 1 : -1),
    oph: rnd(0, Math.PI * 2),
    orad: rad,
    size: rnd(.7, 2.4),
    hue: Math.random() < .12 ? 48 : rnd(165, 195),  // 12% doradas, resto turquesa/cyan
    tw: rnd(0.5, 1.6),
    tgt: SIL[i % SIL.length]
  });
}

/* ---- Máquina de estados ---- */
const S = { PASSIVE: 0, MAT: 1, ACTIVE: 2, DEMAT: 3 };
let state = S.PASSIVE, stateT = 0, matHold = 0;
const stateEl = document.getElementById("state-label");
function setState(s) {
  state = s; stateT = 0;
  if (s === S.MAT) matSound();
  if (s === S.DEMAT) dematSound();
  stateEl.textContent = s === S.PASSIVE ? "● PRESENCIA PASIVA"
    : s === S.MAT ? "◉ MATERIALIZANDO…"
    : s === S.ACTIVE ? "★ VALERIE PRESENTE"
    : "◌ DESVANECIENDO…";
}

/* ---- Loop ---- */
let last = performance.now(), tGlobal = 0;
function orb() { return { x: W / 2, y: H / 2 }; }
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

function frame(now) {
  const dt = Math.min((now - last) / 1000, .05); last = now;
  tGlobal += dt; stateT += dt;
  const o = orb();

  // fondo: espacio profundo + nebulosa sutil
  ctx.fillStyle = "#020617";
  ctx.fillRect(0, 0, W, H);
  const neb = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, Math.max(W, H) * .75);
  neb.addColorStop(0, "rgba(12, 74, 110, 0.35)");
  neb.addColorStop(.45, "rgba(8, 47, 73, 0.14)");
  neb.addColorStop(1, "rgba(2, 6, 23, 0)");
  ctx.fillStyle = neb;
  ctx.fillRect(0, 0, W, H);

  // estrellas fijas tenues
  ctx.fillStyle = "rgba(148, 163, 184, 0.25)";
  for (let i = 0; i < 60; i++) {
    const sx = (i * 977) % W, sy = (i * 613) % H;
    ctx.fillRect(sx, sy, 1, 1);
  }

  const breath = 1 + Math.sin(tGlobal * 1.05) * 0.06;
  const orbR = Math.min(W, H) * 0.085 * breath;

  // orbe respirando (más intenso al materializar)
  const matBoost = state === S.MAT ? 1 + easeIO(Math.min(stateT / 3, 1)) * 0.5 : 1;
  const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, orbR * 2.2 * matBoost);
  g.addColorStop(0, "rgba(204, 251, 241, 0.95)");
  g.addColorStop(.25, "rgba(45, 212, 191, 0.55)");
  g.addColorStop(.6, "rgba(14, 116, 144, 0.22)");
  g.addColorStop(1, "rgba(2, 6, 23, 0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(o.x, o.y, orbR * 2.2 * matBoost, 0, Math.PI * 2); ctx.fill();

  // ---- partículas ----
  const silScale = Math.min(W / 340, H / 530) * 0.95;
  const silOffX = o.x - 150 * silScale;
  const silOffY = o.y - 235 * silScale;

  for (const p of P) {
    let tx, ty;
    if (state === S.PASSIVE) {
      // órbita libre alrededor del orbe
      p.oph += p.oang * dt;
      const rr = p.orad * (0.92 + Math.sin(tGlobal * 0.4 + p.oph) * 0.08);
      tx = o.x + Math.cos(p.oph) * rr;
      ty = o.y + Math.sin(p.oph) * rr * 0.92;
    } else if (state === S.MAT) {
      const k = easeIO(Math.min(stateT / 3, 1));
      const gx = silOffX + p.tgt[0] * silScale + Math.sin(tGlobal * 3 + p.oph) * (1 - k) * 30;
      const gy = silOffY + p.tgt[1] * silScale + Math.cos(tGlobal * 3 + p.oph) * (1 - k) * 30;
      tx = p.x + (gx - p.x) * (k * 0.9 + 0.04);
      ty = p.y + (gy - p.y) * (k * 0.9 + 0.04);
    } else if (state === S.ACTIVE) {
      // shimmer alrededor de su punto de silueta
      const gx = silOffX + p.tgt[0] * silScale;
      const gy = silOffY + p.tgt[1] * silScale;
      tx = gx + Math.sin(tGlobal * 1.4 + p.oph) * 2.2;
      ty = gy + Math.cos(tGlobal * 1.1 + p.oph) * 2.2;
    } else { // DEMAT
      const k = easeIO(Math.min(stateT / 2.5, 1));
      p.oph += p.oang * dt * 4;
      const rr = p.orad * k;
      tx = o.x + Math.cos(p.oph) * rr;
      ty = o.y + Math.sin(p.oph) * rr * 0.92;
    }
    p.x += (tx - p.x) * (state === S.PASSIVE ? 0.05 : 0.18);
    p.y += (ty - p.y) * (state === S.PASSIVE ? 0.05 : 0.18);

    const tw = 0.55 + Math.sin(tGlobal * p.tw * 2.5 + p.oph) * 0.45;
    const alpha = (state === S.ACTIVE ? 0.85 : 0.6) * tw;
    ctx.fillStyle = p.hue === 48 ? `rgba(255, 215, 0, ${alpha})` : `rgba(103, 232, 249, ${alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (state === S.ACTIVE ? 1.15 : 1), 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- wordmark durante ACTIVE ----
  if (state === S.ACTIVE || (state === S.MAT && stateT > 2.2)) {
    const k = state === S.MAT ? Math.min((stateT - 2.2) / 0.8, 1) : 1;
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = "800 " + Math.max(18, Math.min(W * 0.06, 34)) + "px ui-monospace, monospace";
    ctx.textAlign = "center";
    ctx.shadowColor = "rgba(45,212,191,.9)"; ctx.shadowBlur = 22;
    ctx.fillStyle = "#ccfbf1";
    ctx.fillText("V A L E R I E", o.x, silOffY + 470 * silScale + 34);
    ctx.shadowBlur = 0;
    ctx.font = "600 10px ui-monospace, monospace";
    ctx.fillStyle = "#5eead4";
    ctx.fillText("T U   G U Í A   D E   V O Z   •   2 4 / 7", o.x, silOffY + 470 * silScale + 52);
    ctx.restore();
  }

  // flash al completar materialización
  if (state === S.MAT && stateT >= 3) setState(S.ACTIVE);
  if (state === S.DEMAT && stateT >= 2.5) setState(S.PASSIVE);

  requestAnimationFrame(frame);
}

// posiciones iniciales
const o0 = orb();
for (const p of P) { p.x = o0.x + p.ox * 0.3; p.y = o0.y + p.oy * 0.3; }
requestAnimationFrame(frame);

/* ============================================================
   AUDIO ENGINE — sintetizado en vivo (Web Audio, 0 archivos)
   Hum de nave que respira + sweep de materializacion + power-down
   Regla del navegador: el audio despierta con el primer toque
   ============================================================ */
let AC = null, master = null, amb = null, soundOn = true;

function initAudio() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.4; master.connect(AC.destination);
    startAmbient();
  } catch (e) { AC = null; }
  updAudHUD();
}

function updAudHUD() {
  const el = document.getElementById("aud");
  if (!el) return;
  el.textContent = (AC && soundOn) ? "ON" : "OFF";
  el.parentElement.className = (AC && soundOn) ? "on" : "";
}

function startAmbient() {
  if (!AC || amb) return;
  const t = AC.currentTime;
  const g = AC.createGain(); g.gain.value = 0;
  const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 240;
  lp.connect(g); g.connect(master);
  const o1 = AC.createOscillator(); o1.type = "sine"; o1.frequency.value = 55; o1.connect(lp); o1.start(t);
  const o2 = AC.createOscillator(); o2.type = "triangle"; o2.frequency.value = 110.7;
  const g2 = AC.createGain(); g2.gain.value = 0.35; o2.connect(g2); g2.connect(lp); o2.start(t);
  const lfo = AC.createOscillator(); lfo.frequency.value = 1.05; // sincronizado con el breath del orbe
  const lfoG = AC.createGain(); lfoG.gain.value = 0.04;
  lfo.connect(lfoG); lfoG.connect(g.gain); lfo.start(t);
  g.gain.linearRampToValueAtTime(0.09, t + 2.5);
  amb = { g, lfo, o1, o2 };
}

function stopAmbient() {
  if (!AC || !amb) return;
  const t = AC.currentTime;
  amb.g.gain.linearRampToValueAtTime(0.0001, t + 0.6);
  const a = amb; amb = null;
  setTimeout(() => { try { a.o1.stop(); a.o2.stop(); a.lfo.stop(); } catch (e) {} }, 700);
}

function matSound() {
  if (!AC || !soundOn) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = "sawtooth";
  o.frequency.setValueAtTime(140, t);
  o.frequency.exponentialRampToValueAtTime(880, t + 2.7);
  const f = AC.createBiquadFilter(); f.type = "lowpass";
  f.frequency.setValueAtTime(300, t);
  f.frequency.exponentialRampToValueAtTime(2400, t + 2.7);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.12, t + 0.4);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 3.0);
  o.connect(f); f.connect(g); g.connect(master);
  o.start(t); o.stop(t + 3.1);
  for (let i = 0; i < 10; i++) {
    const bl = AC.createOscillator(); bl.type = "sine";
    const fr = 1200 + Math.random() * 2400;
    const st = t + 0.3 + Math.random() * 2.4;
    bl.frequency.setValueAtTime(fr, st);
    bl.frequency.exponentialRampToValueAtTime(fr * 1.6, st + 0.18);
    const bg = AC.createGain();
    bg.gain.setValueAtTime(0.0001, st);
    bg.gain.exponentialRampToValueAtTime(0.05, st + 0.02);
    bg.gain.exponentialRampToValueAtTime(0.0001, st + 0.35);
    bl.connect(bg); bg.connect(master);
    bl.start(st); bl.stop(st + 0.4);
  }
  [523.25, 659.25, 783.99].forEach((fr, i) => {
    const c = AC.createOscillator(); c.type = "sine"; c.frequency.value = fr;
    const cg = AC.createGain();
    const st = t + 2.7 + i * 0.06;
    cg.gain.setValueAtTime(0.0001, st);
    cg.gain.exponentialRampToValueAtTime(0.09 / (i + 1), st + 0.05);
    cg.gain.exponentialRampToValueAtTime(0.0001, st + 1.4);
    c.connect(cg); cg.connect(master);
    c.start(st); c.stop(st + 1.5);
  });
}

function dematSound() {
  if (!AC || !soundOn) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = "sawtooth";
  o.frequency.setValueAtTime(700, t);
  o.frequency.exponentialRampToValueAtTime(90, t + 2.2);
  const f = AC.createBiquadFilter(); f.type = "lowpass";
  f.frequency.setValueAtTime(2200, t);
  f.frequency.exponentialRampToValueAtTime(200, t + 2.2);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.1, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 2.3);
  o.connect(f); f.connect(g); g.connect(master);
  o.start(t); o.stop(t + 2.4);
  const p = AC.createOscillator(); p.type = "sine";
  p.frequency.setValueAtTime(220, t + 1.8);
  p.frequency.exponentialRampToValueAtTime(55, t + 2.3);
  const pg = AC.createGain();
  pg.gain.setValueAtTime(0.0001, t + 1.8);
  pg.gain.exponentialRampToValueAtTime(0.08, t + 1.9);
  pg.gain.exponentialRampToValueAtTime(0.0001, t + 2.5);
  p.connect(pg); pg.connect(master);
  p.start(t + 1.8); p.stop(t + 2.6);
}

function blip() {
  if (!AC || !soundOn) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(660, t);
  o.frequency.exponentialRampToValueAtTime(990, t + 0.06);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.07, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.15);
}

/* ---- Controles: doble tap ---- */
const controls = document.getElementById("controls");
let lastTap = 0;
document.addEventListener("touchend", e => {
  initAudio();
  const t = performance.now();
  if (t - lastTap < 350) {
    controls.classList.toggle("show");
    blip();
    setTimeout(() => document.getElementById("hint").style.display = "none", 100);
  }
  lastTap = t;
});
document.addEventListener("dblclick", () => { initAudio(); controls.classList.toggle("show"); blip(); });

document.getElementById("btn-mat").addEventListener("click", () => {
  if (state === S.PASSIVE) setState(S.MAT);
  else if (state === S.ACTIVE) setState(S.DEMAT);
  controls.classList.remove("show");
});
document.getElementById("btn-demo").addEventListener("click", () => {
  controls.classList.remove("show"); blip();
  if (state !== S.PASSIVE) { setState(S.DEMAT); matHold = 1; }
  setState(S.MAT);
});

/* ---- GPS ---- */
document.getElementById("btn-gps").addEventListener("click", () => {
  blip();
  const locEl = document.getElementById("loc");
  locEl.textContent = "BUSCANDO…";
  if (!navigator.geolocation) { locEl.textContent = "NO DISPONIBLE"; return; }
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude: la, longitude: lo } = pos.coords;
    locEl.textContent = la.toFixed(3) + ", " + lo.toFixed(3);
    locEl.parentElement.classList.add("on");
    try {
      const r = await fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat=" + la + "&lon=" + lo + "&zoom=10", { headers: { "Accept": "application/json" } });
      const j = await r.json();
      const city = j.address?.city || j.address?.town || j.address?.village || j.address?.state || "—";
      locEl.textContent = (city + "").toUpperCase();
    } catch (e) { /* se queda con coords */ }
  }, () => { locEl.textContent = "DENEGADO"; }, { timeout: 8000 });
});

/* ---- Batería ---- */
if (navigator.getBattery) {
  navigator.getBattery().then(b => {
    const upd = () => document.getElementById("batt").textContent = Math.round(b.level * 100) + "%";
    upd(); b.addEventListener("levelchange", upd);
  });
}

/* ---- Reloj ---- */
const DIAS = ["DOMINGO", "LUNES", "MARTES", "MIÉRCOLES", "JUEVES", "VIERNES", "SÁBADO"];
const MES = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"];
function tick() {
  const d = new Date();
  const h = String(d.getHours()).padStart(2, "0");
  const m = String(d.getMinutes()).padStart(2, "0");
  document.getElementById("clock").innerHTML = h + ":" + m + " <small>" + (d.getHours() >= 12 ? "PM" : "AM") + "</small>";
  document.getElementById("date").textContent = DIAS[d.getDay()] + " • " + d.getDate() + " " + MES[d.getMonth()];
}
tick(); setInterval(tick, 10000);

/* ---- Toggle de sonido ---- */
document.getElementById("btn-snd").addEventListener("click", () => {
  initAudio();
  soundOn = !soundOn;
  if (soundOn) { startAmbient(); blip(); } else { stopAmbient(); }
  updAudHUD();
});

/* ---- Auto-materialización de bienvenida (4s después de abrir) ---- */
setTimeout(() => { if (state === S.PASSIVE) setState(S.MAT); }, 4000);
setTimeout(() => { if (state === S.ACTIVE) setState(S.DEMAT); }, 16000);
</script>

/* ---- EL ROUTER v0: determinístico, legible, 0 LLM ---- */
function maestraDose(pers,lvl){
  const ORDEN={A0:0,A1:1,A2:2,B1:3};
  // puerta de entrada por canal dominante
  const PUERTA={
   oido:{t:"El oído fino",tab:"realvowels",msg:"Tu puerta es el OÍDO: entra por el quiz de oído — la voz de la Maestra te dice la palabra y tú eliges. Parejas mínimas: el detalle fino se entrena oyendo."},
   ojo:{t:"El ojo lector",tab:"vowels",msg:"Tu puerta es el OJO: entra leyendo las ANCLAS escritas — lo que ves se te pega. Después escucha la palabra con el botón."},
   boca:{t:"La boca calienta",tab:"warmup",msg:"Tu puerta es la BOCA: entra calentando como cantante — respiración, zumbido, motor. Después el reto te espera."}
  };
  // el objetivo: la dimensión más débil
  let weak="ear",wv=99;
  for(const d of ["ear","eye","mouth"]){const v=ORDEN[lvl[d]]!==undefined?ORDEN[lvl[d]]:0;if(v<wv){wv=v;weak=d}}
  const OBJETIVO={
   ear:{t:"Refuerza tu OÍDO",tab:"realvowels"},
   eye:{t:"Refuerza tu OJO lector",tab:"vdigraphs"},
   mouth:{t:"Refuerza tu BOCA",tab:"warmup"}
  };
  const puerta=PUERTA[pers.canal]||PUERTA.ojo;
  const objetivo=OBJETIVO[weak];
  const acciones=[];
  if(pers.modo_hugo){
    acciones.push({label:"🤫 Modo Hugo: primero MIRA (AR Labeler)",url:AR,gold:true});
    acciones.push({label:puerta.t+" → "+(puerta.tab==="warmup"?"calentamiento":"Trainer"),url:TRAINER+"?tab="+puerta.tab});
  }else{
    acciones.push({label:puerta.t+" → Trainer ("+puerta.tab+")",url:TRAINER+"?tab="+puerta.tab,gold:true});
  }
  if(objetivo.tab!==puerta.tab)acciones.push({label:"🎯 "+objetivo.t+" ("+objetivo.tab+")",url:TRAINER+"?tab="+objetivo.tab});
  acciones.push({label:"🎙️ Practica conmigo en voz (/call)",url:CALL});
  const vObj=videoOfTab(objetivo.tab);
  if(vObj)acciones.push(vObj);
  // América: el gimnasio de pares mínimos con micrófono — posicionamiento A2-medio a B1-alto (JJ 17-sep)
  const best=Math.max(...["ear","eye","mouth"].map(d=>ORDEN[lvl[d]]!==undefined?ORDEN[lvl[d]]:0));
  if(best>=2)acciones.push({label:"🇺🇸 Ya meritas AMERICA — pares con microfono (A2m a B1a)",url:AMERICA});
  // Palace: laboratorio B1a a B2b (grade target JJ) — trabalenguas con score, gimnasio lengua+cerebro que funciona desde A-bajo (evidencia sobrino 70-100%)
  if(best>=3)acciones.push({label:"👑 PALACE te espera — el laboratorio (B1a a B2b)",url:PALACE});
  if(weak==="mouth")acciones.push({label:"👅 Trabalenguas con score — lengua Y cerebro",url:PALACE});
  return {titulo:objetivo.t,msg:puerta.msg,acciones:acciones};
}

  document.getElementById("pwrap").innerHTML=`

    ${step1}${step2}${doseHtml}${trapHtml}
    <div class="p-sec">Las puertas</div>

      <a class="p-btn" href="${TRAINER}">🎓 TRAINER</a>

      <a class="p-btn" href="${TG}">✈️ TELEGRAM</a>
      <a class="p-btn" href="${YT}">YOUTUBE</a>
      <a class="p-btn" href="${TT}">🎵 TIKTOK</a>
      <a class="p-btn" href="${AMERICA}">🇺🇸 AMERICA — pares y voz</a>
      <a class="p-btn" href="${PALACE}">👑 PALACE — trabalenguas y lab</a>

    ${expHtml}
    <div class="foot">CERO LLM PARA DECIDIR · REGLAS LEGIBLES EN EL ARCHIVO<br>LA MAESTRA EVOLUCIONA CONTIGO — MYL ACCENTBRIDGES 🔥</div>`;
