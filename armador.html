<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Armador de Sonidos — AccentBridges</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,#0d1b2a,#1b263b 60%,#2a9d8f 140%);min-height:100vh;color:#fff;display:flex;flex-direction:column;align-items:center;padding:14px;max-width:560px;margin:0 auto;user-select:none}
h1{font-size:1.35rem;text-align:center;margin:6px 0 2px}
.sub{font-size:.78rem;opacity:.75;text-align:center;margin-bottom:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.tab{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:14px;padding:6px 10px;font-size:.75rem;cursor:pointer}
.tab.on{background:#f4a261;color:#1b263b;font-weight:700;border-color:#f4a261}
.meta{font-size:.8rem;opacity:.85;margin-bottom:10px}
.stage{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.bigbtn{background:#f4a261;color:#1b263b;font-size:1.5rem;font-weight:800;border:none;border-radius:50%;width:96px;height:96px;cursor:pointer;box-shadow:0 6px 22px rgba(244,162,97,.45);font-size:2.6rem}
.pill{background:rgba(42,157,143,.5);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:20px;padding:10px 18px;font-size:1rem;font-weight:600;cursor:pointer}
.pill:active{transform:scale(.97)}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{width:52px;height:60px;border:2px dashed rgba(255,255,255,.4);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;color:#f4a261}
.slot.fill{border-style:solid;background:rgba(244,162,97,.2);color:#fff}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.card{background:#fff;color:#1b263b;border:none;border-radius:14px;padding:14px 4px;font-size:1.6rem;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);transition:.15s}
.card:active{transform:scale(.95)}
.card.bad{animation:sh .4s;background:#e76f51;color:#fff}
.card.gone{opacity:.15;pointer-events:none}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.conf{position:fixed;inset:0;background:rgba(13,27,42,.88);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.confbox{background:#fff;color:#1b263b;border-radius:20px;padding:22px;max-width:340px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.confbox .g{font-size:2.6rem;font-weight:900;color:#e76f51;display:block;margin-bottom:6px}
.confbox p{font-size:1rem;line-height:1.45;margin-bottom:14px}
.emoji{font-size:5rem;line-height:1}
.foto{max-height:110px;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.who{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:14px;padding:4px 12px;font-size:.75rem;cursor:pointer;margin-bottom:8px}
.lesson{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:12px;font-size:.92rem;line-height:1.4;max-width:340px}
.word{font-size:2.6rem;font-weight:900;letter-spacing:2px;color:#f4a261}
.ipa{font-size:.9rem;opacity:.7}
.stars{font-size:1.4rem;letter-spacing:3px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#e76f51;color:#fff;padding:10px 18px;border-radius:20px;font-size:.85rem;z-index:5;white-space:nowrap}
.foot{margin-top:12px;font-size:.72rem;opacity:.65;text-align:center}
.foot a{color:#90e0ef}
small.hint{opacity:.7;font-size:.78rem}
</style>
</head>
<body>
<h1>🧩 ARMADOR DE SONIDOS</h1>
<div class="sub">Primero el oído. Después, las letras confiesan.</div>
<button class="who" id="who">👤</button>
<div class="tabs" id="tabs"></div>
<div class="meta" id="meta"></div>
<div class="stage" id="stage"></div>
<div class="foot">Compuerta día 40+ · A0-medio/alto · Banco de Alfabetización tanda 1<br>
<a href="foundation-trainer.html">← Regresar al Trainer</a> · Practica en vivo: /call con Valerie en Telegram</div>

<script>
// ===== TTS (patrón Cirugía: palabra completa, jamás símbolo suelto) =====
function voz(t,lang,r){const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=r||.9;const vs=speechSynthesis.getVoices();const v=vs.find(v=>new RegExp(lang.replace("-","[-_]"),"i").test(v.lang));if(v)u.voice=v;return u}
function sayEn(t,r){try{speechSynthesis.cancel();speechSynthesis.speak(voz(t,"en-US",r||.8))}catch(e){}}
function sayEs(t,r){try{speechSynthesis.cancel();speechSynthesis.speak(voz(t,"es-MX",r||.95))}catch(e){}}
document.addEventListener("click",()=>{try{speechSynthesis.getVoices()}catch(e){}},{once:true});

// ===== NOMBRES GRINGOS ESCRITOS COMO PALABRA (regla de oro: jamás símbolo suelto al TTS) =====
const NOMBRE={a:"ay",b:"bee",c:"see",d:"dee",e:"ee",f:"ef",g:"gee",h:"aitch",i:"eye",j:"jay",k:"kay",l:"el",m:"em",n:"en",o:"oh",p:"pee",q:"cue",r:"are",s:"ess",t:"tee",u:"you",v:"vee",w:"double you",x:"ex",y:"why",z:"zee"};
const NOMBRE_DUO={sh:"ess aitch",ch:"see aitch",th:"tee aitch",ph:"pee aitch",ng:"en jee",oo:"double oh",ck:"see kay"};
function nombreDe(g){const w=g.toLowerCase();if(NOMBRE_DUO[w])return NOMBRE_DUO[w];return w.split("").map(l=>NOMBRE[l]||l).join(" ")}
function sayChain(items){try{speechSynthesis.cancel();let i=0;const next=()=>{if(i>=items.length)return;const it=items[i++];const u=voz(it.t,it.lang,it.rate);u.onend=next;try{speechSynthesis.speak(u)}catch(e){}};next()}catch(e){}}

// ===== EMOJIS DEL BANCO =====
const EMO={cat:"🐱",bag:"👜",map:"🗺️",hat:"🎩",pan:"🍳",van:"🚐",fan:"🌬️",jam:"🍯",pen:"🖊️",bed:"🛏️",red:"🔴",ten:"🔟",net:"🥅",get:"✋",leg:"🦵",sit:"🪑",big:"🐘",win:"🏆",pin:"📍",zip:"🤐",fit:"🏃",kid:"🧒",box:"📦",hot:"🔥",dog:"🐶",job:"💼",lot:"🧺",pot:"🍲",not:"🚫",bus:"🚌",cup:"☕",run:"🏃",sun:"☀️",fun:"🎉",cut:"✂️",mug:"🍺",ham:"🍖",bat:"🦇",man:"👨",nap:"😴",fish:"🐟",ship:"🚢",shop:"🏪",dish:"🍽️",wish:"🌠",cash:"💵",wash:"🧼",chat:"💬",chip:"🍟",lunch:"🍱",much:"🤗",this:"👉",that:"👈",then:"⏰",thing:"🧩",math:"➗",sing:"🎤",king:"👑",long:"📏",song:"🎶",book:"📖",look:"👀",cook:"👨‍🍳",foot:"🦶",good:"👍",wood:"🪵",took:"⏱️",hood:"🧥",food:"🍽️",moon:"🌙",soon:"⌛",tool:"🔧",room:"🚪",spoon:"🥄",cool:"😎",name:"📛",home:"🏠",hope:"🙏",time:"⌛",five:"5️⃣",note:"📝",late:"🌃",make:"🔧",take:"🎬",cube:"🧊",life:"❤️",wide:"↔️",safe:"🛡️",phone:"📱",plate:"🍽️",cake:"🎂",bike:"🚲",ride:"🐎",game:"🎮",tune:"🎼",rope:"🪢",cute:"🥰",mine:"⛏️",rose:"🌹",wave:"🌊"};

// ===== ESTADO =====
const BANDAS=[{k:"cerrada",n:"CVC"},{k:"digrafo",n:"Dúos 🔒"},{k:"oo_corta",n:"OO dos casas"},{k:"oo_larga",n:"OO larga"},{k:"magic_e",n:"Magia E ✨"}];
const SEÑ_LETRAS="bdfghjlmnprsvwz".split("");
const SEÑ_DIG=["sh","ch","th","ng","oo"];
let banco=[], fila=[], i=0, prog=JSON.parse(localStorage.getItem("armadorV1")||"{}");
const BQ_ARM="https://valerie.base44.app/functions/logArmadorResult";
function actualizarWho(){$("who").textContent="👤 "+(localStorage.getItem("armadorName")||"¿tu nombre?")}
$("who").onclick=()=>{const n=prompt("¿Cómo te llamas? (para tu expediente de aprendizaje)");if(n){localStorage.setItem("armadorName",n);actualizarWho()}};
actualizarWho();

// ===== RENDER BÁSICO =====
const $=id=>document.getElementById(id);
$("tabs").innerHTML=BANDAS.map((b,ix)=>`<button class="tab${ix===0?" on":""}" data-b="${b.k}">${b.n}</button>`).join("");
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");cargarBanda(t.dataset.b)});

function cargarBanda(bk){
  fila=banco.filter(p=>p.tipo_silaba===bk||(bk==="oo_corta"&&p.tipo_silaba==="oo_corta"));
  if(bk==="oo_corta")fila=fila.filter(p=>p.tipo_silaba==="oo_corta");
  i=0;meta();escuchar();
}
function meta(){
  const done=fila.filter(p=>prog[p.id]&&prog[p.id]>0).length;
  $("meta").textContent=`Palabra ${i+1} de ${fila.length} · ⭐ ${done}/${fila.length} dominadas`;
}

// ===== PASO 1: EL SONIDO PRIMERO =====
function escuchar(){
  const p=fila[i];if(!p)return fin();
  $("stage").innerHTML=`
    <div>🔊</div>
    <button class="bigbtn" id="play">🔊</button>
    <button class="pill" id="slow">🐢 lenta</button>
    <small class="hint">Escucha bien. 🐢 si la quieres lenta. Las letras todavía no llegan.</small>
    <button class="pill" id="ya">Ya la oí — ¡armarla! →</button>`;
  $("play").onclick=()=>sayEn(p.palabra,.75);
  $("slow").onclick=()=>sayEn(p.palabra,.45);
  $("ya").onclick=()=>armar(p);
  setTimeout(()=>sayEn(p.palabra,.75),350);
}

// ===== PASO 2: ARMAR (tarjetas + señuelos) =====
function armar(p){
  const g=p.grafemas;
  const targets=g.map(x=>x);
  const tieneDig=g.some(x=>x.tipo==="digrafo");
  let señ=[];
  const poolDig=SEÑ_DIG.filter(d=>!g.some(x=>x.g===d));
  const poolLet=SEÑ_LETRAS.filter(l=>!g.some(x=>x.g===l));
  if(tieneDig){señ=señ.concat(poolDig.sort(()=>Math.random()-.5).slice(0,2))}
  while(señ.length<6-g.length){const l=poolLet[Math.floor(Math.random()*poolLet.length)];if(!señ.includes(l))señ.push(l)}
  const cartas=targets.map((x,n)=>({g:x.g,conf:x.confesion,tipo:x.tipo,ok:true})).concat(señ.map(s=>({g:s,ok:false})));
  cartas.sort(()=>Math.random()-.5);
  let n=0, fallos=0;
  $("stage").innerHTML=`
    <button class="pill" id="replay">🔊 otra vez</button>
    <button class="pill" id="slow">🐢 lenta</button>
    <div class="slots" id="slots">${g.map(()=>`<div class="slot"></div>`).join("")}</div>
    <div class="cards">${cartas.map((c,n2)=>`<button class="card" data-n="${n2}">${c.g==="e"&&c.tipo==="muda"?"E 👑":c.g.toUpperCase()}</button>`).join("")}</div>`;
  $("replay").onclick=()=>sayEn(p.palabra,.75);
  $("slow").onclick=()=>sayEn(p.palabra,.45);
  document.querySelectorAll(".card").forEach(b=>b.onclick=()=>{
    const c=cartas[+b.dataset.n];
    // SIEMPRE se oye el NOMBRE gringo de lo que aplastaste (entrenamiento de oído, también al fallar)
    if(!c.ok){fallos++;b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),450);
      toast("Oíste «"+nombreDe(c.g)+"»… ese no es el siguiente sonido 🔊");
      sayChain([{t:nombreDe(c.g),lang:"en-US",rate:.85},{t:p.palabra,lang:"en-US",rate:.75}]);return}
    if(c.g!==g[n].g){fallos++;b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),450);
      toast("Oíste «"+nombreDe(c.g)+"»… aún no le toca a esa");
      sayChain([{t:nombreDe(c.g),lang:"en-US",rate:.85}]);return}
    sayChain([{t:nombreDe(c.g),lang:"en-US",rate:.85},{t:c.conf,lang:"es-MX",rate:1.02}]);
    b.classList.add("gone");
    document.querySelectorAll(".slot")[n].classList.add("fill");
    document.querySelectorAll(".slot")[n].textContent=c.g.toUpperCase();
    confesar(c,n===g.length-1?p:null,()=>{n++;if(n>=g.length)celebrar(p,fallos)});
  });
}

// ===== LA CONFESIÓN =====
function confesar(c,ultimo,cb){
  const d=document.createElement("div");d.className="conf";
  d.innerHTML=`<div class="confbox"><span class="g">${c.g==="e"&&c.tipo==="muda"?"E 👑":c.g.toUpperCase()}</span>
    <p>${c.conf}</p>
    <button class="pill" id="va">¡Va! 🔥</button></div>`;
  document.body.appendChild(d);
  const cerrar=()=>{d.remove();cb()};
  d.querySelector("#va").onclick=cerrar;
  sayEs(c.confesion,1.02);
}

// ===== PASO 3: CELEBRACIÓN + LECCIÓN FINAL =====
function celebrar(p,fallos){
  const clean=fallos===0, stars=clean?3:(fallos<=1?2:1);
  const prev=prog[p.id]||0; if(stars>prev)prog[p.id]=stars;
  localStorage.setItem("armadorV1",JSON.stringify(prog));
  const emo=EMO[p.palabra]||"🔤";
  fetch(BQ_ARM,{method:"POST",headers:{"Content-Type":"application/json","api_key":"ABVC-PILOTO-2026"},
    body:JSON.stringify({name:localStorage.getItem("armadorName")||"Estudiante 0",palabra:p.palabra,banda:p.tipo_silaba,estrellas:stars,fallos})}).catch(()=>{});
  $("stage").innerHTML=`
    <img class="foto" src="assets/armador/${p.palabra}.jpg" onerror="this.outerHTML='<div class=emoji>${emo}</div>'" alt="${p.palabra}">
    <div class="word">${p.palabra.toUpperCase()}</div>
    <div class="ipa">${p.ipa} · ${p.traduccion_es}</div>
    <div class="stars">${"⭐".repeat(stars)}</div>
    <div class="lesson">📜 ${p.leccion_final}</div>
    <button class="pill" id="rep">🔊 escúchala completa</button>
    <button class="pill" id="next">Siguiente →</button>`;
  $("rep").onclick=()=>sayEn(p.palabra,.75);
  $("next").onclick=()=>{i++;meta();i<fila.length?escuchar():fin()};
  meta(); sayEn(p.palabra,.75);
}
function fin(){
  $("stage").innerHTML=`<div class="emoji">🏆</div><h2>¡Banda dominada!</h2>
  <small class="hint">Toca otra pestaña arriba para seguir armador sonidos.</small>`;
}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}

// ===== CARGA DEL BANCO =====
fetch(`banks/alfabetizacion-1.json?v=${Date.now()}`)
 .then(r=>r.json())
 .then(d=>{banco=d.palabras;cargarBanda("cerrada")})
 .catch(()=>{$("stage").innerHTML="<p>No pude cargar el banco. Revisa tu conexión.</p>"});
</script>
</body>
</html>
