if(k=="same"){const dp=cur.p.length?cur.p:sh(I.flatMap((a,i)=>I.slice(i+1).map(b=>[a,b]))).slice(0,3);
tr=sh([...sh(dp).slice(0,3).map(p=>({a:p[0],b:p[1],s:0})),...sh(I).slice(0,3).map(w=>({a:w,b:w,s:1}))]).map(t=>Math.random()<.5?{a:t.b,b:t.a,s:t.s}:t)}
else if(k=="rep")tr=I.slice(0,8);
else if(k=="lee")tr=sh(I).slice(0,6);
else tr=sh(I).sort((a,b)=>a.length-b.length).slice(0,6);
show()}
function show(){const T=tr[ti],h=steps[st],k=h[0];if(k=="rep"){repTries=0;repCounted=false}
let b=`<div class="top"><button class="lk" onclick="home()" aria-label="Volver al inicio">←</button><span class="m">${st+1}. ${h[1]} · ${ti+1} de ${tr.length}</span></div><div class="bar"><i style="width:${(st+ti/tr.length)/steps.length*100}%"></i></div><p>${h[2]}</p>`;
if(k=="same"){heard={a:0,b:0};b+=`<div class="row"><button class="sp" data-say="${esc(T.a)}" data-w="a">🔊<br>A</button><button class="sp" data-say="${esc(T.b)}" data-w="b">🔊<br>B</button></div><p class="m" id="hg">Escucha 🔊 A y 🔊 B antes de responder.</p><div class="row"><button class="ans" data-a="1" disabled>Iguales</button><button class="ans" data-a="0" disabled>Distintos</button></div>`;}
else if(k=="rep")b+=`<button class="sp big" data-say="${esc(T)}">🔊 Escuchar</button>`+spd(T)+(SR?`<button class="go" id="mic" onclick="mic()">🎤 Decirlo yo</button>`:"")+`<button class="go alt" onclick="repSkip()">${SR?"Saltar (no verificado)":"Ya lo repetí"}</button>`;
else if(k=="lee"){const o=[T,...sh(I2()).filter(w=>w!=T).slice(0,3)];b+=`<button class="sp big" data-say="${esc(T)}">🔊 Escuchar</button>`+sh(o).map(w=>`<button class="opt" data-a="${esc(w)}">${esc(w)}</button>`).join("")}
else{dicTries=0;CHB=[];CHL=[];
if(T.includes(" ")){dicMode="es";b+=`<button class="sp big" data-say="${esc(T)}">🔊 Escuchar</button><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Escribe lo que oyes" onkeydown="if(event.key=='Enter')ans()"><button class="go" onclick="ans()">Comprobar</button>`}
else{dicMode="ar";b+=`<div id="dz"><button class="sp big" data-say="${esc(T)}">🔊 Escuchar</button><div class="row" style="margin:10px 0">${chips(T).map(c=>`<button class="lk ch" style="flex:1;font-size:20px;padding:12px 0" data-c="${c}" onclick="tapCh(this)">${c}</button>`).join("")}</div><div id="cw" style="font-size:26px;letter-spacing:6px;text-align:center;min-height:36px;font-weight:700"></div><div class="row" style="margin:10px 0"><button class="lk" style="flex:1" onclick="bkCh()">⌫</button><button class="go" style="flex:2" onclick="chkCh()">Comprobar</button></div></div>`}}
$.innerHTML=b+`<div id="fb"></div>`;done=false;
if(k=="lee"||k=="dic")setTimeout(()=>say(T),300);if(k=="dic"){const ip=document.getElementById("inp");if(ip)ip.focus()}}
const I2=()=>cur.l.length>=4?cur.l:[...cur.l,...sh(POOL).slice(0,4)];
function ans(a){if(done)return;const T=tr[ti],k=steps[st][0];let ok,msg="";
if(k=="same"){ok=(a==1)==!!T.s;msg=cur.d>=40?`A = ${T.a} · B = ${T.b}`:(T.s?"Eran iguales.":"Eran distintos.")}
else if(k=="lee"){ok=a==T;msg=`Era: ${T}`}
else{dicAns(T);return}
done=true;sc.tot++;if(ok)sc.ok++;
document.getElementById("fb").innerHTML=`<p class="${ok?"ok":"no"}">${ok?"✓ Correcto":"✗ Casi"} <span class="m">${esc(msg)}</span></p><button class="go" onclick="nx()">Seguir</button>`;
document.querySelectorAll(".ans,.opt").forEach(x=>x.disabled=true)}
function chips(T){const w=cl(T),base=[...w],dec="aeioubdghlmnprst".split("").filter(c=>!w.includes(c));while(base.length<w.length+2)base.push(dec[Math.floor(Math.random()*dec.length)]);return sh(base)}
function tapCh(el){if(el.disabled)return;el.disabled=true;CHB.push(el.dataset.c);CHL.push(el);document.getElementById("cw").textContent=CHB.join("")}
function bkCh(){const el=CHL.pop();if(el){CHB.pop();el.disabled=false}document.getElementById("cw").textContent=CHB.join("")}
function dicDone(T,ok,m){done=true;sc.tot++;if(ok)sc.ok++;dicLog.push({w:T,ok:ok,m:m,n:dicTries+1});document.getElementById("fb").innerHTML=`<p class="${ok?"ok":"no"}">${ok?(m=="ar"?"✅ ¡Armada!":"✅ Correcto"):"✗ Era: "+esc(T)}</p><button class="go" onclick="nx()">Seguir</button>`;document.querySelectorAll(".ans,.opt,.ch,#dz button").forEach(x=>x.disabled=true)}
function chkCh(){if(done)return;const T=tr[ti];if(CHB.join("")==cl(T)){dicDone(T,true,"ar");return}dicTries++;const fb=document.getElementById("fb");
if(dicTries>=2){dicMode="es";document.getElementById("dz").innerHTML=`<button class="sp big" data-say="${esc(T)}">🔊 Escuchar</button><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Escribe lo que oyes" onkeydown="if(event.key=='Enter')ans()"><button class="go" onclick="ans()">Comprobar</button>`;fb.innerHTML=`<p class="no">✗ Casi</p><p class="m">Ahora escríbela. Pista: empieza con «${esc(cl(T)[0])}». Escucha otra vez.</p>`;document.getElementById("inp").focus();return}
fb.innerHTML=`<p class="no">✗ Casi</p><p class="m">Escucha otra vez y vuelve a armar. Usa ⌫ para borrar.</p>`}
function dicAns(T){if(done)return;const inp=document.getElementById("inp");if(cl(inp.value)==cl(T)){dicDone(T,true,"es");return}dicTries++;
if(dicTries>=4){dicDone(T,false,"es");return}const hint=dicTries>=3?cl(T).slice(0,2):cl(T).slice(0,1);document.getElementById("fb").innerHTML=`<p class="no">✗ Casi</p><p class="m">Pista: empieza con «${esc(hint)}…». Escucha otra vez.</p>`;inp.value="";inp.focus()}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function mic(){const T=tr[ti],btn=document.getElementById("mic"),fb=document.getElementById("fb");
repTries++;const r=new SR();r.lang="en-US";r.maxAlternatives=3;btn.textContent="🔴 Escuchando…";btn.disabled=true;
const fin=t=>{btn.disabled=false;btn.textContent="🎤 Intentar de nuevo";fb.innerHTML=t};
r.onresult=e=>{const al=[...e.results[0]].map(x=>cl(x.transcript)),ok=al.includes(cl(T));if(ok&&!repCounted){repCounted=true;sc.tot++;sc.ok++;repLog.push({w:T,ok:1,t:repTries})}
fb.innerHTML=`<p class="${ok?"ok":"no"}">${ok?(repTries>=5?"🏆 ¡WILD! Le ganaste a la palabra en "+repTries+" intentos. La persistencia venció.":"✓ Se entendió bien"):"✗ "+(cur.d>=40?"Entendí: "+esc(al[0]):"No se entendió.")}</p>`+(ok?`<button class="go" onclick="nx()">Seguir</button>`:hint(T));btn.disabled=false;btn.textContent=ok?"🎤 Otra vez":"🎤 Intentar de nuevo"};
r.onerror=e=>fin(`<p class="no">${e.error=="not-allowed"?"Permite el micrófono en el navegador.":"No se oyó nada. Intenta de nuevo."}</p>`);
r.onnomatch=()=>fin(`<p class="no">No se entendió. Intenta de nuevo.</p>`);
r.onend=()=>{if(btn.disabled)fin("")};
try{r.start()}catch(x){fin("")}}
function spd(T){return `<div class="row" style="margin:8px 0">${[["🐢 Lento",2],["🚶 Medio",1],["🏃 Normal",0]].map(x=>`<button class="lk" style="flex:1;${SP==x[1]?"background:var(--ac);color:#fff;border-color:var(--ac)":""}" data-s="${esc(T)}" onclick="SP=${x[1]};say(this.dataset.s)">${x[0]}</button>`).join("")}</div>`}
function hint(T){let h="";if(repTries>=5){h=`<p class="m">La palabra es <b>${esc(T)}</b>${EMO[T]?" "+EMO[T]:""}${ANCLA[T]?` · ancla culichi: <b>${esc(ANCLA[T])}</b>`:""}.</p>`+(PAIR[T]?`<p class="m">Contraste: <b>${esc(PAIR[T][0])}</b>${EMO[PAIR[T][0]]||""} ≠ <b>${esc(PAIR[T][1])}</b>${EMO[PAIR[T][1]]||""} — el ojo ya ve lo que el oído aún no.</p>`:"")+`<p class="m">Ponla en 🐢 Lento y dila despacito.</p>`}else if(repTries>=3){h=`<p class="m">La palabra es <b>${esc(T)}</b>${EMO[T]?" "+EMO[T]:""}. Escúchala y dila exactamente igual.</p>`}else{h=`<p class="m">Escucha, respira y prueba otra vez.</p>`}return h}
function repSkip(){if(!repCounted){repCounted=true;sc.tot++;if(!SR){sc.ok++;repLog.push({w:tr[ti],ok:1,self:1})}else{repLog.push({w:tr[ti],ok:0,t:repTries})}}nx()}
function nx(){ti++;if(ti<tr.length)return show();st++;if(st<steps.length)return step();end()}
const BQ_EP="https://valerie.base44.app/functions/logMorfofonoSession",BQ_KEY="ABVC-PILOTO-2026";
function bq(p,pass,T){const sid="oi-"+cur.d+"-"+Date.now();
const rec={topic:"Oído Inglés — Día "+cur.d+": "+cur.t+" ("+cur.lv+")",location:"Culiacán",accuracy:p,passed:pass,spokenText:"oido-ingles · bloques: "+steps.map(s=>s[1]).join("→")+" · "+sc.ok+"/"+sc.tot+(repLog.length?" · rep:"+repLog.map(r=>r.w+(r.ok?"✓":"✗")+(r.t?"("+r.t+")":"")).join(","):"")+(dicLog.length?" · dic:"+dicLog.map(d=>d.w+(d.ok?"✓":"✗")+"["+d.m+d.n+"]").join(","):"")+" · int:"+AT[cur.d]+" · th:"+T+" · t:"+Math.round((Date.now()-T0)/1000)+"s · sid:"+sid,challengeSentence:(cur.l||[]).slice(0,4).join(", "),userId:NAME||"Estudiante sin nombre",sessionId:sid,date:new Date().toISOString().slice(0,10)};
try{fetch(BQ_EP,{method:"POST",headers:{"Content-Type":"application/json","api_key":BQ_KEY},body:JSON.stringify(rec)}).then(r=>r.json()).then(j=>{const s=document.getElementById("bq");if(s)s.innerHTML=(j&&j.ok)?"<b>Expediente:</b> ✅ enviado. La Maestra ya lo puede leer.":"<b>Expediente:</b> ⚠️ el servidor no aceptó — repite la lección más tarde."}).catch(()=>{const s=document.getElementById("bq");if(s)s.innerHTML="<b>Expediente:</b> ⚠️ sin conexión — se reintenta al repetir la lección."})}catch(e){}}
function end(){const p=sc.tot?Math.round(sc.ok/sc.tot*100):100,T=th(cur.d),pass=p>=T;AT[cur.d]=(AT[cur.d]||0)+1;if(pass)PD[cur.d]=1;S[cur.d]=Math.max(S[cur.d]||0,p);save();bq(p,pass,T);const n=D.L.find(l=>l.d==cur.d+1);
$.innerHTML=`<h1>¡Lección completa!</h1><div class="stars">${p>=90?"⭐⭐⭐":p>=60?"⭐⭐":"⭐"}</div><p style="text-align:center">Acertaste ${sc.ok} de ${sc.tot} (${p}%) · ${pass?"✅ aprobada, umbral "+T+"%":"te faltó para el umbral de "+T+"%"}</p>${repLog.length?`<p class="m" style="text-align:center">🎤 Repite: ${repLog.map(r=>r.w+(r.ok?"✓":"✗")).join(" · ")}</p>`:""}<p class="m" id="bq" style="text-align:center"><b>Expediente:</b> enviando…</p>`+((n&&pass)?`<button class="go" onclick="start(${n.d})">Siguiente: día ${n.d}</button>`:((n&&!pass)?`<p class="m" style="text-align:center">Para abrir el día ${cur.d+1}: pásala con ${th(cur.d)}%. El umbral baja con cada intento — la constancia también cuenta.</p>`:""))+`<button class="go alt" onclick="start(${cur.d})">Repetir lección</button><button class="go alt" onclick="lv='${cur.lv}';home()">Volver a la lista</button>`}
home();
</script></body></html>
