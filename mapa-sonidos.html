<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>El Mapa de tus Sonidos · AccentBridges</title>
<style>
:root{--bg:#121a21;--cd:#1a2430;--tx:#e8f0f8;--mut:#8fa3b8;--gold:#ffc14d;--blue:#7bb1ff;--gd:#50c878;--rj:#e98989;--line:#2c3a4a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;min-height:100vh}
header{background:#f7f4eb;color:#24303a;padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline}
header b{color:#d35400;font-size:1.02rem}
header span{font-size:.75rem;color:#7a6a55}
main{max-width:480px;margin:0 auto;padding:12px}
.intro,.card,.result{background:var(--cd);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-top:12px}
h1{font-size:1.25rem;line-height:1.3}
.mut{color:var(--mut);font-size:.85rem;line-height:1.5}
.btn{display:block;width:100%;background:var(--cd);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:14px;font-size:1rem;cursor:pointer;margin-top:10px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#241f0d;font-weight:700}
.btn.good{background:var(--gd);border-color:var(--gd);color:#06220f;font-weight:700}
.play{width:100%;background:rgba(123,177,255,.12);border:1px solid var(--blue);color:var(--blue);border-radius:12px;padding:16px;font-size:1.05rem;cursor:pointer;margin-top:12px}
.opts{display:flex;gap:10px;margin-top:14px}
.opt{flex:1;background:var(--bg);border:2px solid var(--line);color:var(--tx);border-radius:14px;padding:18px 8px;font-size:1.25rem;cursor:pointer;font-family:Georgia,serif}
.opt.ok{border-color:var(--gd);background:rgba(80,200,120,.14);color:var(--gd)}
.opt.no{border-color:var(--rj);background:rgba(233,137,137,.12);color:var(--rj)}
.tag{display:inline-block;font-size:.7rem;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:3px 10px;margin-top:8px}
.prog{height:6px;background:var(--line);border-radius:99px;margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.fb{min-height:44px;margin-top:12px;font-size:.85rem;line-height:1.5}
.fb.ok{color:var(--gd)} .fb.no{color:var(--rj)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.row b{font-family:Georgia,serif;font-size:1.02rem}
.badge{font-size:.8rem;font-weight:700;border-radius:99px;padding:4px 12px}
.badge.ok{background:rgba(80,200,120,.16);color:var(--gd)}
.badge.no{background:rgba(233,137,137,.14);color:var(--rj)}
.sug{background:rgba(255,193,77,.08);border-left:3px solid var(--gold);padding:10px 12px;border-radius:8px;font-size:.84rem;margin-top:10px;line-height:1.5}
.hidden{display:none}
</style></head><body>
<header><b> EL MAPA DE TUS SONIDOS</b><span> AccentBridges</span></header>
<main>
<div class="intro" id="intro">
<h1>Tu mapa de sonidos 🗺️</h1>
<p class="mut" style="margin-top:8px">Una prueba cortita, sin prisa: en cada casita oirás una palabra y eliges cuál fue. Al final verás tu mapa — qué sonidos ya son tuyos y cuáles están esperando su clase. No hay calificación: hay un mapa.</p>
<button class="btn gold" onclick="start()">Empezar ▶</button>
</div>
<div class="card hidden" id="quiz">
<div class="tag" id="tag"></div>
<div class="prog"><i id="bar" style="width:0%"></i></div>
<button class="play" onclick="hearAgain()">🔊 Escuchar de nuevo</button>
<div class="opts"><button class="opt" id="o0" onclick="pick(0)"></button><button class="opt" id="o1" onclick="pick(1)"></button></div>
<div class="fb" id="fb"></div>
<button class="btn gold hidden" id="next" onclick="next()">Siguiente ▶</button>
</div>
<div class="result hidden" id="result"></div>
</main>
<script>
/* ===== EL MAPA DE TUS SONIDOS — Prueba diagnostica de lecciones saltadas (directriz JJ 26-oct:
"assessment de las lecciones she's skipping... porque ahi estan sus debilidades").
Cada item = un contraste de un dia del estudio. Audio pre-horneado (oido-audio), cero TTS vivo.
Al final: el MAPA con recomendacion de que dia practicar. Telemetria: logMorfofonoSession. ===== */
const CDN="https://babayaba71-maker.github.io/AccentBridges/assets/oido-audio/";
const AUD="assets/oido-audio/";
const API="https://valerie.base44.app/functions/logMorfofonoSession";
const KEY="ABVC-PILOTO-2026";
const Q=[
 {d:3, tag:"Vocal larga o corta", a:"sheep", b:"ship", n:"La larga se estira dos tiempos; la corta cae en uno."},
 {d:4, tag:"Final con motor o con aire", a:"cab", b:"cap", n:"La b final zumba; la p final termina en aire."},
 {d:5, tag:"Labios que soplan o que cantan", a:"fan", b:"van", n:"La f sopla aire; la v enciende la garganta."},
 {d:21, tag:"Golpe de che o silbido ancho", a:"chip", b:"ship", n:"La che golpea; la ese ancha solo sopla."},
 {d:6, tag:"Boca entreabierta o abierta", a:"bed", b:"bad", n:"La e se queda entreabierta; la a abre de par en par."},
 {d:7, tag:"Redonda larga o rendida", a:"fool", b:"full", n:"La primera se estira; la segunda cae corta y suave."},
 {d:8, tag:"Lengua que resbala o que toca", a:"they", b:"day", n:"La lengua asomada resbala suave; la d toca una vez."},
 {d:9, tag:"Grande o rendida", a:"cot", b:"cut", n:"La o abre grandota; la u se queda chiquita."},
 {d:10, tag:"Golpe de labios o mordisco", a:"berry", b:"very", n:"La b golpea los labios; la v muerde suavecito."},
 {d:11, tag:"Ese angosta o ese ancha", a:"sip", b:"ship", n:"La s sale en linecita; la sh sale en abanico."},
 {d:12, tag:"Silbido o zumbido", a:"sue", b:"zoo", n:"La s solo sopla; la z trae motor desde el inicio."},
 {d:13, tag:"Vocal que se desliza o fija", a:"late", b:"bed", n:"La primera abre y se cierra dentro de la sílaba."},
 {d:15, tag:"Lengua asomada o serpiente", a:"think", b:"sink", n:"La th saca la punta; la s silba de serpiente."},
 {d:16, tag:"Labios redondos o mordisco", a:"whale", b:"veil", n:"La w redondea puro labio; la v muerde."},
 {d:17, tag:"Lengua al frente o atrás", a:"light", b:"right", n:"La l toca al frente; la r se jala atrás sin tocar."},
 {d:18, tag:"Con soplido o directo", a:"hate", b:"ate", n:"La h empieza con un soplo de aire."},
 {d:19, tag:"Pasado con motor o con aire", a:"loved", b:"walked", n:"La terminación puede zumbas — o terminar en aire."},
 {d:20, tag:"T golpeada o crispada", a:"water", b:"top", n:"Entre vocales la t golpea suavecita; al inicio sopla."},
 {d:0, tag:"Verbo o sustantivo: live / life", a:"live", b:"life", n:"live = verbo (vivir): I live here. life = sustantivo (vida): My life is good. La v canta; la f sopla."}
];
const $=id=>document.getElementById(id);
const st={i:0,cur:0,res:{},done:false};
const haptic=ms=>{if("vibrate" in navigator)navigator.vibrate(ms)};
const au=new Audio();
function stu(){return (localStorage.getItem("morfofono_student")||localStorage.getItem("abvc_student")||"Estudiante").trim()}
function play(k){
  const urls=[AUD+k+".mp3?v=M1",CDN+k+".mp3?v=M1"];let i=0;
  const next=()=>{if(i<urls.length){au.onended=null;au.onerror=next;au.src=urls[i++];au.play().catch(()=>{})}else{au.onended=null}};
  next();
}
function start(){haptic(20);$("intro").classList.add("hidden");$("quiz").classList.remove("hidden");show()}
function show(){
  const q=Q[st.i];
  st.cur=Math.random()<.5?0:1;
  $("tag").textContent="Sonido "+(st.i+1)+" de "+Q.length+" · "+q.tag;
  $("bar").style.width=(st.i*100/Q.length)+"%";
  $("o0").textContent=q.a;$("o1").textContent=q.b;
  $("o0").className="opt";$("o1").className="opt";
  $("fb").className="fb";$("fb").textContent="";
  $("next").classList.add("hidden");
  setTimeout(()=>play(st.cur===0?q.a:q.b),350);
}
function hearAgain(){haptic(15);const q=Q[st.i];play(st.cur===0?q.a:q.b)}
function pick(n){
  const q=Q[st.i];
  if($("fb").classList.contains("ok")||$("fb").classList.contains("no"))return;
  const ok=n===st.cur;
  st.res[q.d===0?"live-life":"D"+q.d]=ok?1:0;
  const btn=$( n===0?"o0":"o1"),other=$( n===0?"o1":"o0");
  btn.classList.add(ok?"ok":"no");other.classList.add(ok?"no":"ok");
  const fb=$("fb");fb.className="fb "+(ok?"ok":"no");
  fb.textContent=(ok?"✓ ¡Sí! ":"✗ Casi — ")+"Escucha la diferencia: "+q.n;
  $("next").classList.remove("hidden");
  haptic(ok?20:[20,30,20]);
}
function next(){
  st.i++;
  if(st.i>=Q.length){finish()}else{show()}
}
function finish(){
  $("quiz").classList.add("hidden");
  const R=$("result");R.classList.remove("hidden");
  const got=Object.values(st.res).filter(x=>x).length;
  const pct=Math.round(got*100/Q.length);
  const rows=Q.map(q=>{
    const k=q.d===0?"live-life":"D"+q.d, ok=st.res[k];
    return `<div class="row"><span><b>${q.a} / ${q.b}</b><br><span class="mut" style="font-size:.75rem">${q.tag}</span></span><span class="badge ${ok?"ok":"no"}">${ok?"TUYO":"Practícalo"}</span></div>`;
  }).join("");
  const huecos=Q.filter(q=>!st.res[q.d===0?"live-life":"D"+q.d]);
  const sug=huecos.length
    ? `<div class="sug"><b>Tu clase de hoy te espera:</b> el estudio abre cada contraste en su día — empieza por <b>Día ${huecos[0].d>0?huecos[0].d:3}</b> y sube paso a pasito.<br><br>👉 https://babayaba71-maker.github.io/AccentBridges/estudio-v3.html</div>`
    : `<div class="sug">¡Tu mapa está completito en verde! Sigue subiendo: el estudio te espera con más sonidos.</div>`;
  const liveCard=`<div class="sug" style="border-left-color:var(--blue);background:rgba(123,177,255,.08)"><b>La pareja del día:</b> <b>live</b> = verbo (vivir) → "I <b>live</b> here" · <b>life</b> = sustantivo (vida) → "My <b>life</b> is good". La V canta con motor; la F sopla aire puro.</div>`;
  R.innerHTML=`<h1>Tu mapa 🗺️</h1>
  <p class="mut" style="margin-top:6px">Sonidos tuyos: <b style="color:var(--gd)">${got} de ${Q.length}</b> (${pct}%)</p>
  ${rows}${liveCard}${sug}
  <p class="mut" style="margin-top:14px">Todo queda en tu expediente. La maestra ve tu mapa y te espera en tu próxima clase. ❤️</p>`;
  haptic([30,50,30]);
  fetch(API,{method:"POST",headers:{"Content-Type":"application/json",api_key:KEY},body:JSON.stringify({
    topic:"Mapa de Sonidos — Diagnóstico de lecciones saltadas",
    userId:stu(),passed:pct>=50,
    accuracy:pct,
    challengeSentence:"live / life + "+huecos.map(q=>q.a+"-"+q.b).slice(0,3).join(", "),
    spokenText:JSON.stringify(st.res),
    location:"Mapa de Sonidos",sessionId:"mapa-"+Date.now()})})
  .catch(()=>{});
}
</script></body></html>
