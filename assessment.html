<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba del Oído — Myl AccentBridges</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Newsreader:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#F9F5F0;--surface:#FFFFFF;--surface-2:#F2EBE5;--ink:#2B2622;--muted:#8A7F76;--accent:#F38B2D;--accent-fg:#fff;--border:#E5DCD2;--shadow:0 1px 3px rgba(43,38,34,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1.2rem}
.app{width:100%;max-width:430px}
.chip{display:inline-block;background:var(--surface-2);border-radius:99px;padding:.3rem .9rem;font-size:.78rem;color:var(--muted);margin-bottom:.8rem}
h1{font-size:1.5rem;margin-bottom:.6rem;text-align:center}
.big{font-family:Newsreader,serif;font-size:1.15rem;line-height:1.55;text-align:center;margin-bottom:1.2rem}
.card{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:1rem;padding:1.4rem 1.2rem;margin-bottom:1rem}
button{font-family:inherit;cursor:pointer;border:1px solid var(--border);background:var(--surface);border-radius:.8rem;padding:.9rem 1.2rem;font-size:1rem;box-shadow:var(--shadow)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);width:100%;padding:1rem;font-size:1.05rem;font-weight:700}
input{width:100%;font-size:1.05rem;padding:.9rem;border:1px solid var(--border);border-radius:.8rem;background:var(--bg);font-family:inherit}
.duo{display:flex;gap:.8rem;margin-top:1.2rem}
.duo button{flex:1;font-size:1.2rem;font-weight:700;padding:1.2rem}
.duo .b-igual{background:#EDF3EE;border-color:#CFE3D3}
.duo .b-dif{background:#F7ECE9;border-color:#EBCFC8}
.prog{text-align:center;font-size:.8rem;color:var(--muted);margin:.6rem 0}
.barra{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:1.2rem}
.barra i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.estado{text-align:center;font-size:.85rem;color:var(--muted);margin-top:.8rem;min-height:1.2rem}
.estado .sonando{color:var(--accent);font-weight:700}
.replay{display:block;margin:1rem auto 0;background:var(--surface-2);font-size:.9rem;color:var(--muted)}
.nivel{font-family:Newsreader,serif;font-size:3rem;text-align:center;color:var(--accent);margin:.4rem 0}
.missed{background:var(--surface-2);border-radius:.6rem;padding:.8rem;font-size:.9rem;margin:1rem 0;line-height:1.7}
.warn{background:#FBF3E4;border:1px solid #EAD3A8;border-radius:.6rem;padding:.8rem;font-size:.85rem;margin:1rem 0}
a.cta{display:block;text-align:center;background:var(--accent);color:var(--accent-fg);border-radius:.8rem;padding:1rem;font-weight:700;text-decoration:none}
.foot{color:var(--muted);font-size:.72rem;text-align:center;margin-top:1.6rem}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="foot">Myl AccentBridges · aquí no se lee: se escucha 🎧</div>
<script>
const $=s=>document.querySelector(s);
const app=document.getElementById("app");

// ================= BOCA OFICIAL v2 — patrón sellado del ecosistema =================
// Audio PRE-HORNEADO y QA'd (boca→oído, 19/19) en assets — determinista, $0 por sesión.
// Un SOLO elemento <audio> persistente (doctrina Manos Libres v2: Android rechaza play()
// de elementos nuevos) + fallback bocaValerie + fallback navegador con guarda de timeout.
const BOCA_URL="https://valerie.base44.app/functions/bocaValerie";
let AUDIO=null;const CACHE={};
const wfile=w=>("cant"===w?"cant":w)+".mp3";
function getAudio(){if(!AUDIO){AUDIO=new Audio();AUDIO.preload="auto";document.body.appendChild(AUDIO);}return AUDIO;}
async function bocaFetch(w){
  if(CACHE[w])return CACHE[w];
  // 1) asset pre-horneado
  const url="assets/assessment-audio/"+wfile(w);
  try{const r=await fetch(url);if(r.ok){const b=await r.blob();return CACHE[w]=URL.createObjectURL(b);}}catch(e){}
  // 2) bocaValerie en vivo
  try{
    const r=await fetch(BOCA_URL,{method:"POST",headers:{"Content-Type":"application/json","x-abvc-key":"ABVC-PILOTO-2026"},body:JSON.stringify({text:w})});
    if(r.ok){const b=await r.blob();if(b.size>2000)return CACHE[w]=URL.createObjectURL(b);}
  }catch(e){}
  return null;
}
const espera=ms=>new Promise(r=>setTimeout(r,ms));
function playUrl(url){return new Promise((res,rej)=>{const a=getAudio();a.src=url;a.onended=res;a.onerror=rej;a.play().catch(rej);});}
// Fallback navegador: JAMÁS cuelga — si onend nunca llega (bug documentado de Chrome
// Android que atoraba la prueba), la guarda de tiempo lo resuelve.
function ttsFallback(txt){
  return new Promise(res=>{
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(txt);u.lang="en-US";u.rate=.8;
      const done=()=>{u.onend=null;clearTimeout(g);res();};
      u.onend=done;u.onerror=done;
      speechSynthesis.speak(u);
      const g=setTimeout(done,txt.length*300+2200);
    }catch(e){res();}
  });
}
/* REGLA DE ORO v2.4: UNA ronda = UNA voz. Se resuelven AMBAS fuentes antes de
   sonar la primera nota; si una falla, TODA la ronda sale con la voz del sistema.
   (Bug de v2.3 firmado por Josefina: 0/4 en pares iguales — palabra A con una
   voz y palabra B con otra porque el MP3 falló a media ronda.) */
async function rondaConsistente(r){
  setEstado('<span class="sonando">⬇️ Descargando la voz…</span>');
  const [ua,ub]=await Promise.all([bocaFetch(r.a),bocaFetch(r.b)]);
  setEstado('<span class="sonando">🔊 Sonando…</span>');
  if(ua&&ub){
    try{await playUrl(ua);await espera(900);await playUrl(ub);return;}catch(e){}
  }
  await ttsFallback(r.a);await espera(900);await ttsFallback(r.b);
}

/* La escalera: 12 rondas IGUAL/DIFERENTE — de lo obvio a lo que solo un oído entrenado caza.
   CERO letras durante la prueba: solo oídos. */
/* Escalera v2.3 — PALABRAS DE LA VIDA REAL (pedido de JJ: "esas preguntas son muy
   avanzadas... I hate those words... what about 'Live or Leave'?" — nada de vocabulario
   de libro de texto; palabras que la gente VIVE: no, day, eat, live, leave, sit, seat,
   three, tree, cat, cut, can. El par man/men quedó DESCARTADO: el QA boca→oído detectó
   que Sarah pronunció man como men — par roto prohibido). */
const RONDAS=[
 {a:"no",b:"no",s:true},{a:"dog",b:"duck",s:false},{a:"day",b:"day",s:true},
 {a:"day",b:"they",s:false},{a:"eat",b:"eat",s:true},{a:"ship",b:"sheep",s:false},
 {a:"live",b:"leave",s:false},{a:"sit",b:"seat",s:false},{a:"very",b:"very",s:true},
 {a:"three",b:"tree",s:false},{a:"cat",b:"cut",s:false},{a:"can",b:"can't",s:false}
];
const NIVELES=[[11,"B1+","Tu oído ya cruza el puente con vuelo propio"],[9,"A2","Oído puente adelante: se te escapan los pares finos"],[7,"A1","El puente está en construcción: la base ya suena"],[5,"A0-alto","Nivel fundador: el oído empieza a despertar"],[3,"A0-medio","Empieza por sonidos: el oído es un músculo bebé"],[0,"A0-bajo","Bienvenida a la orilla: aquí empiezan todos"]];
let nombre="",idx=0,aciertos=0,falladas=[],sonando=false;

function setEstado(html){const e=$("#estado");if(e)e.innerHTML=html;}
function pIntro(){
 app.innerHTML=`<span class="chip">🎧 PRUEBA DEL OÍDO</span>
 <h1>3 minutos. Solo tu oído.</h1>
 <p class="big">Vas a escuchar <b>dos palabras</b>. Tu única misión: decirme si suenan <b>iguales</b> o <b>diferentes</b>.</p>
 <div class="card"><p class="big" style="margin:0">Aquí no hay letras que te ayuden.<br>No hay examen, no hay calificación.<br>Solo un oído estrenándose. 🎧</p></div>
 <label style="font-size:.9rem;color:var(--muted);display:block;margin-bottom:.4rem">¿Cómo te llamas?</label>
 <input id="nb" placeholder="Tu nombre" autocomplete="given-name">
 <button class="primary" style="margin-top:1rem" onclick="empezar()">Empezar 🎧</button>`;
}
function empezar(){
 nombre=(document.getElementById("nb").value||"").trim()||"Anónima/o";
 idx=0;aciertos=0;falladas=[];
 getAudio(); // el elemento de audio nace con el gesto del botón
 (async()=>{for(const r of RONDAS){await bocaFetch(r.a);await bocaFetch(r.b);}})(); // prewarm silencioso de las 19 palabras
 pRonda();
}
function pRonda(){
 const r=RONDAS[idx];
 const pct=Math.round(idx/RONDAS.length*100);
 app.innerHTML=`<span class="chip">🎧 Ronda ${idx+1} de ${RONDAS.length}</span>
 <div class="barra"><i style="width:${pct}%"></i></div>
 <div class="card">
   <p class="big" style="margin-bottom:0">Oye las dos palabras.<br>¿<b>Iguales</b> o <b>diferentes</b>?</p>
   <button class="replay" id="btnReplay" onclick="suena()">🔊 Escuchar otra vez</button>
   <div class="estado" id="estado"></div>
   <div class="duo">
     <button class="b-igual" onclick="responde(true)">🔁 Iguales</button>
     <button class="b-dif" onclick="responde(false)">✂️ Diferentes</button>
   </div>
 </div>`;
 bocaFetch(r.a);bocaFetch(r.b); // prefetch: cuando toques 🔊 ya está listo
 setTimeout(suena,600);
}
let tocadoSuena=false;
async function suena(){
 if(sonando)return;
 sonando=true;tocadoSuena=true;
 const r=RONDAS[idx];
 const btn=$("#btnReplay");if(btn)btn.textContent="🔊 Sonando…";
 try{
   await rondaConsistente(r);
   setEstado("Listo 🎧 — puedes responder");
   if(btn)btn.textContent="🔊 Escuchar otra vez";
 }catch(e){
   setEstado("Toca 🔊 para escuchar");
   if(btn)btn.textContent="▶ Toca para escuchar";
 }
 sonando=false;
}
function responde(dijo){
 const r=RONDAS[idx];
 if(sonando){getAudio().pause();sonando=false;}
 if(dijo===r.s){aciertos++;}else{falladas.push(r.a+" / "+r.b);}
 idx++;
 if(idx<RONDAS.length){pRonda();}else{pFinal();}
}
function nivelDe(n){
 for(const[min,lv,desc]of NIVELES){if(n>=min)return[lv,desc];}
 return["A0-bajo","Bienvenida a la orilla"];
}
function pFinal(){
 const[lv,desc]=nivelDe(aciertos);
 const code=`PRUEBA DEL OÍDO v2.4 · ${aciertos}/${RONDAS.length} · ${nombre} · Nivel del oído: ${lv}`+(falladas.length?` · Falladas: ${falladas.join(", ")}`:" · Limpia");
 app.innerHTML=`<span class="chip">🎧 RESULTADO</span>
 <div class="card">
  <p style="text-align:center;font-size:.85rem;color:var(--muted)">Tu oído quedó medido en</p>
  <div class="nivel">${lv}</div>
  <p class="big" style="margin-top:.4rem">${desc}</p>
  <p class="prog">${aciertos} de ${RONDAS.length} acertadas</p>
  ${falladas.length?`<div class="missed"><b>Tus pares (esto es entre tú y tu maestra):</b><br>${falladas.join("<br>")}</div>`:`<div class="missed">🎯 Cero errores: un oído fino.</div>`}
  <div id="repStat" style="display:none" class="warn"></div>
  <a class="cta" href="consulta-doctora.html">Ahora saluda a la Doctora →</a>
  <button class="replay" style="margin-top:1rem" onclick="reportar()">🔄 Reintentar el registro</button>
 </div>`;
 reportar();
}
function reportar(){
 const[lv]=nivelDe(aciertos);
 const code=`PRUEBA DEL OÍDO v2.4 · ${aciertos}/${RONDAS.length} · Nivel del oído: ${lv}`+(falladas.length?` · Falladas: ${falladas.join(", ")}`:" · Limpia");
 const stat=document.getElementById("repStat");
 fetch("https://valerie.base44.app/functions/logAssessmentResult",{
  method:"POST",headers:{"Content-Type":"application/json","api_key":"ABVC-PILOTO-2026"},
  body:JSON.stringify({studentName:nombre,assessmentType:"level",ear:lv,code:code})
 }).then(r=>r.json()).then(j=>{
   if(stat){stat.style.display=j.ok?"none":"block";stat.textContent=j.ok?"":"⚠️ Tu expediente no llegó al sistema. Usa el botón 🔄 o mándale este mensaje a tu coach: "+code;}
   if(!j.ok)console.warn("reporte falló",j);
 }).catch(()=>{
   if(stat){stat.style.display="block";stat.textContent="⚠️ Sin conexión con el expediente. Usa 🔄 o mándale este mensaje a tu coach: "+code;}
 });
}
pIntro();
</script>
</body>
</html>
