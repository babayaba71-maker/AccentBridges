<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level Assessment — El Expediente · Myl AccentBridges</title>
<style>
:root{--purple:#6366f1;--purple-dark:#4f46e5;--bg:#f9fafb;--card:#fff;--text:#1f2937;--soft:#6b7280;--pink:#fff1f2;--pink-border:#fecdd3;--ok:#10b981;--bad:#ef4444}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;background:var(--purple);color:#fff;padding:14px 18px}
.h-wrap{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.h-flag{font-size:28px}
h1{font-size:19px;font-weight:800}
.h-sub{font-size:12px;opacity:.9;margin-top:1px}
main{max-width:560px;width:100%;padding:16px 14px 30px}
.card{background:var(--card);border-radius:16px;padding:22px 18px;box-shadow:0 2px 10px rgba(0,0,0,.07);text-align:center}
.dim-chip{display:inline-block;background:var(--pink);border:1.5px solid var(--pink-border);color:#be123c;font-weight:800;font-size:13px;border-radius:999px;padding:6px 14px;margin-bottom:12px}
.q-text{font-size:16px;font-weight:700;margin-bottom:14px}
.q-audio{font-size:30px;font-weight:900;color:var(--purple);margin:6px 0 4px;letter-spacing:.5px}
.q-anchor{font-size:13px;color:var(--soft);margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:13px;font-size:16px;font-weight:700;color:var(--text);cursor:pointer;transition:.15s}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--ok);background:#ecfdf5}
.opt.bad{border-color:var(--bad);background:#fef2f2}
.explain{background:var(--pink);border:1.5px solid var(--pink-border);border-radius:12px;padding:11px 13px;font-size:13.5px;color:#9f1239;margin-top:13px;text-align:left;font-weight:600;line-height:1.45}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;margin-top:12px}
.btn-primary{background:var(--purple);color:#fff}
.btn-ghost{background:#fff;border:2px solid #e5e7eb;color:var(--text);font-weight:700}
.replay{background:var(--purple);color:#fff;border:none;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:800;cursor:pointer;margin:6px auto 14px}
.rec-zone{background:var(--pink);border:2px dashed var(--pink-border);border-radius:14px;padding:14px;margin-top:6px}
.rec-btn{width:100%;background:var(--purple);color:#fff;border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:800;cursor:pointer}
.rec-btn.stop{background:var(--bad)}
.score-num{font-size:42px;font-weight:900;line-height:1.1}
.score-stars{font-size:15px;letter-spacing:1px;margin-top:2px}
.score-msg{font-size:13px;font-weight:700;margin-top:2px}
.dots{display:flex;justify-content:center;gap:6px;margin:14px 0}
.dot{width:9px;height:9px;border-radius:50%;background:#e5e7eb}
.dot.on{background:var(--purple)}
.tree{font-size:40px;line-height:1}
.lvl-chip{display:inline-block;font-weight:900;font-size:15px;border-radius:999px;padding:5px 14px;margin-top:4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.dimbox{background:#fafafa;border:1.5px solid #e5e7eb;border-radius:14px;padding:12px 6px}
.dimbox h3{font-size:13px;margin-bottom:4px}
.dose{background:#eef2ff;border:1.5px solid #c7d2fe;border-radius:12px;padding:11px 13px;font-size:13px;text-align:left;line-height:1.5;color:#3730a3;font-weight:600;margin-top:10px}
.share{width:100%;border:1.5px solid #e5e7eb;border-radius:10px;padding:10px;font-size:12px;margin-top:12px;background:#fafafa;color:var(--soft)}
footer{text-align:center;font-size:11px;color:var(--soft);padding:12px;opacity:.8}
.selfbtn{background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}
</style>
</head>
<body>
<header><div class="h-wrap"><span class="h-flag">🎓</span><div><h1>Level Assessment — El Expediente</h1><div class="h-sub">Tu perfil por dimensión · Oído 👂 · Ojo 👁 · Boca 👅 · Myl AccentBridges</div></div></div></header>
<main><div class="card" id="app"></div><footer>Parte del ecosistema Myl AccentBridges 🇲🇽➡️🇺🇸 · Alma &amp; Clyde</footer></main>

<script>
/* ============ ENGINE DATA (determinístico, 0 LLM) ============ */
const BANDS=["A0","A1","A2","B1"];
const DIMS=[
 {id:"ear",name:"Oído 👂",intro:"Vas a ESCUCHAR sonidos en inglés y elegir lo que oíste. Usa audífonos si tienes. No traduzcas — siente el sonido."},
 {id:"eye",name:"Ojo 👁",intro:"Preguntas de lo que VES: anclas, escritura y sílabas. El ojo también entrena."},
 {id:"mouth",name:"Boca 👅",intro:"Vas a GRABAR tu voz diciendo frases. Chrome te califica del 1 al 100. Habla fuerte y claro. ⚠️ IMPORTANTE: si abriste este enlace DENTRO de WhatsApp, no te va a escuchar — cópialo y ábrelo en CHROME puro (fuera de WhatsApp) para que el micrófono funcione."}
];
const Q={
 ear:[
  {band:0,ask:"Escucha el sonido. ¿Qué ANCLA es?",audio:"I",opts:["ai","ei","oi"],ans:0,explain:"Era AI — como la queja culichi '¡ay!' 😅. EI es 'ey' de 'rey' y OI es 'oi' de 'oigo'."},
  {band:1,ask:"Escucha la palabra. ¿Cuál es?",audio:"ship",opts:["ship (barco)","sheep (oveja)","shop (tienda)"],ans:0,explain:"SHIP = i corta (sh-ip). SHEEP = ii larga (sh-iip). La diferencia es la LONGITUD de la vocal."},
  {band:2,ask:"Escucha el número. ¿Cuál es?",audio:"thirteen",opts:["13 (thir-TIN)","30 (THIR-ti)","14 (for-TIN)"],ans:0,explain:"13 = acento ADELANTE (thir-TIN). 30 = acento ATRÁS (THIR-ti). El acento lo cambia TODO."},
  {band:3,ask:"Escucha la palabra 'water'. ¿Cómo suena la T?",audio:"water",opts:["Como D suave (flap)","Como T limpia y fuerte","No suena"],ans:0,explain:"WATER = 'ua-der' — la T entre vocales se vuelve FLAP, como la R suave de 'pero'. ¡Ya la tienes desde el español!"}
 ],
 eye:[
  {band:0,ask:"El ancla 'uan' es de cuál palabra?",opts:["one (uno)","won (ganó)","no"],ans:0,explain:"ONE = 'uan' — la O se desliza a u+a en una sola voz. La palabra más traicionera del inglés básico 🎯."},
  {band:1,ask:"¿Cuál se escribe CORRECTAMENTE?",opts:["forty","fourty","fourtee"],ans:0,explain:"FORTY sin u — trampa clásica (four PIERDE la u al hacerse decena). Hasta nativos la tuitean mal 😂."},
  {band:2,ask:"¿Qué palabra suena como el ancla 'dey'?",opts:["they (ellos)","day (día)","de"],ans:0,explain:"THEY = 'dey' — rima con 'rey' 👑. El diptongo /eɪ/ siempre termina deslizándose en 'y'."},
  {band:3,ask:"¿Cuál es la sílaba ACENTUADA de 'banana'?",opts:["ba-NA-na","BA-na-na","ba-na-NA"],ans:0,explain:"ba-NA-na 🔵 — la del medio suena fuerte y clara; las otras dos se reducen a 'buh' y 'nuh' (schwa)."}
 ],
 mouth:[
  {band:0,target:"I am here",anchor:"ai em jir",explain:"Tu PRIMERA oración real — como el niño que dice '¡agua!'. Sujeto + SER + lugar."},
  {band:1,target:"I am eating",anchor:"ai em ii-ting",explain:"La FÓRMULA MÁGICA: sujeto + SER + verbo-ing = lo que pasa AHORA 🪄."},
  {band:2,target:"Betty bought a bit of better butter",anchor:"Beddy bought a bit of bedder budder",explain:"Cinco FLAP T — como la R suave de 'pero'. La lengua toca el techo una vez y ya 👅."},
  {band:3,target:"The thoughtful mother took a bath in the north",anchor:"de thot-ful ma-der tuk a bat in de nor",explain:"Cinco TH — lengua entre los dientes cada vez. El reto máximo del Episodio 1 🔥."}
 ]};
const DOSE={
 ear:{"A0":"Quiz de Oído diario en el grupo + pestaña Melodía del Trainer","A1":"Episodios diarios + minimal pairs (ship/sheep, think/sink)","A2":"Números y acentos en el Trainer + quizzes con audio","B1":"AccentBridges Pro — la orilla avanzada del puente"},
 eye:{"A0":"Vocales + Alfabeto Americano del Trainer (anclas)","A1":"Números y Frases del Trainer","A2":"WordBank + reglas de acento escritas","B1":"Pro — currículum B1+ completo"},
 mouth:{"A0":"Saludos y Pronombres del Trainer + /call con Valerie","A1":"Combos del Trainer (Fórmula Mágica)","A2":"Flap T y linking + /call diario","B1":"Pro Accent Lab + retos de acento alto"}};
const TREE={"A0":"🌱","A1":"🌿","A2":"🌳","B1":"🌳✨"};
const LVLColor={"A0":"#10b981","A1":"#22c55e","A2":"#eab308","B1":"#f97316"};

/* ============ STATE ============ */
const $=id=>document.getElementById(id);
let dimIdx=0,qIdx=0,results={},rec=null,chunks=[],SR=window.SpeechRecognition||window.webkitSpeechRecognition,recog=null,heard=[];
let curOrder=[],curAns=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ============ TTS ============ */
function speak(text){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.9;
  const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.startsWith("en"));
  if(vs.length)u.voice=vs.find(v=>v.lang==="en-US")||vs[0];
  speechSynthesis.speak(u);}catch(e){}
}

/* ============ SCORING ENGINE (del Foundation Trainer v2.4) ============ */
const NUMWORD={1:"one",2:"two",3:"three",4:"four",5:"five",6:"six",7:"seven",8:"eight",9:"nine",10:"ten"};
function normTxt(s){return String(s||"").toLowerCase().replace(/[.,!?;:'"()]/g," ").replace(/\s+/g," ").trim()}
function normTokens(t){return normTxt(t).split(" ").filter(Boolean).flatMap(w=>{const r=NUMWORD[w.toUpperCase()]||NUMWORD[w]||w;return String(r).split(" ")})}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j),c=new Array(n+1);for(let i=1;i<=m;i++){c[0]=i;for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));[p,c]=[c,p]}return p[n]}
function pronScore(alts,target){
  const tgt=normTokens(target);if(!tgt.length)return null;let best=0,heardTxt="";
  for(const alt of alts){const ht=normTokens(alt);if(!ht.length)continue;
    let sum=0;const used=new Array(ht.length).fill(false);
    for(const tw of tgt){let sw=0,bi=-1;ht.forEach((hw,hi)=>{if(used[hi])return;const d=lev(tw,hw);const tol=(Math.max(tw.length,hw.length)>=6)?2:1;const s=(d===0)?1:(d<=tol?(d===1?0.6:0.3):0);if(s>sw){sw=s;bi=hi}});if(bi>=0)used[bi]=true;sum+=sw}
    const sc=Math.round(100*sum/tgt.length);if(sc>best){best=sc;heardTxt=alt}}
  return{score:Math.min(100,best),heard:heardTxt}
}

/* ============ FLOW ============ */
function intro(){
  $("app").innerHTML=`<div class="dim-chip">🧠 Antes de empezar</div>
  <div class="q-text">No tienes UN nivel. Tienes un <b>PERFIL</b>: tu oído, tu ojo y tu boca pueden estar en niveles distintos — y cada uno se entrena en SU escalón.</div>
  <div class="explain">👂 <b>Oído</b> — percibes los sonidos<br>👁 <b>Ojo</b> — reconoces anclas y escritura<br>👅 <b>Boca</b> — produces las frases<br><br>⏱ 12 preguntas o menos · 🎧 usa audífonos · 📱 mejor en Chrome</div>
  <button class="btn btn-primary" onclick="startDim(0)">Empezar mi expediente →</button>`;
}
function startDim(i){
  dimIdx=i;qIdx=0;results[DIMS[i].id]={answered:0,level:null};
  const d=DIMS[i];
  $("app").innerHTML=`<div class="dim-chip">Dimensión ${i+1} de 3 · ${d.name}</div>
  <div class="q-text">${d.intro}</div>
  <button class="btn btn-primary" onclick="nextQ()">Entendido →</button>`;
}
function dotsHtml(){return `<div class="dots">${Array.from({length:4},(_,k)=>`<div class="dot ${k<qIdx?"on":""}"></div>`).join("")}</div>`}
function nextQ(){
  const d=DIMS[dimIdx],r=results[d.id];
  if(qIdx>=Q[d.id].length||r.failed){return endDim()}
  const q=Q[d.id][qIdx];
  if(d.id==="mouth")return renderMouth(q);
  $("app").innerHTML=`<div class="dim-chip">Dimensión ${dimIdx+1} · ${d.name} · Nivel ${BANDS[q.band]}</div>${dotsHtml()}
  <div class="q-text">${q.ask}</div>
  ${q.audio?`<button class="replay" onclick="replayAudio()">🔊 Escuchar de nuevo</button><div class="q-anchor">(toca el botón las veces que necesites)</div>`:""}
  <div class="opts">${(()=>{curOrder=shuffle(q.opts.map((_,i)=>i));curAns=curOrder.indexOf(q.ans);return curOrder.map((oi,pos)=>`<button class="opt" onclick="answer(${pos})">${q.opts[oi]}</button>`).join("")})()}</div>`;
  if(q.audio)speak(q.audio);
}
function replayAudio(){const q=Q[DIMS[dimIdx].id][qIdx];if(q&&q.audio)speak(q.audio)}
function answer(k){
  const d=DIMS[dimIdx],q=Q[d.id][qIdx],ok=(k===curAns);
  document.querySelectorAll(".opt").forEach((el,j)=>{el.onclick=null;const cls=j===curAns?"ok":(j===k?"bad":null);if(cls)el.classList.add(cls)});
  results[d.id].answered++;results[d.id]["b"+q.band]=ok;
  if(!ok)results[d.id].failed=true;
  const box=document.createElement("div");box.className="explain";box.innerHTML=(ok?"✅ ¡Correcto! ":"🎯 Casi — ")+q.explain;
  $("app").appendChild(box);
  qIdx++;
  const btn=document.createElement("button");btn.className="btn btn-primary";btn.textContent="Siguiente →";btn.onclick=()=>nextQ();
  $("app").appendChild(btn);
  window.scrollTo(0,document.body.scrollHeight);
}
function renderMouth(q){
  const d=DIMS[dimIdx];
  if(!SR){
    $("app").innerHTML=`<div class="dim-chip">Dimensión ${dimIdx+1} · ${d.name} · Nivel ${BANDS[q.band]}</div>${dotsHtml()}
    <div class="q-text">Di en voz alta:</div><div class="q-audio">${q.target}</div><div class="q-anchor">DÍLO ASÍ: ${q.anchor}</div>
    <div class="explain">Tu navegador no puede calificar la voz. Sé tu propio juez — con honestidad 🙏</div>
    <button class="selfbtn" onclick="selfEval(true)">😎 Me salió bien</button>
    <button class="selfbtn" onclick="selfEval(false)">🤔 Se me atoró</button>`;
    return;
  }
  $("app").innerHTML=`<div class="dim-chip">Dimensión ${dimIdx+1} · ${d.name} · Nivel ${BANDS[q.band]}</div>${dotsHtml()}
  <div class="q-text">Di en voz alta:</div><div class="q-audio">${q.target}</div><div class="q-anchor">DÍLO ASÍ: ${q.anchor}</div>
  <div class="rec-zone">
    <button class="rec-btn" id="recBtn" onclick="toggleRec()">⏺ Grabar mi voz</button>
    <div id="scoreBox" style="display:none;margin-top:10px"></div>
  </div>
  <div class="explain">${q.explain}</div>`;
}
function toggleRec(){
  const b=$("recBtn");
  if(rec&&rec.state==="recording"){rec.stop();try{recog.stop()}catch(e){};setTimeout(gradeMouth,1300);return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    heard=[];chunks=[];rec=new MediaRecorder(stream);
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{stream.getTracks().forEach(x=>x.stop())};
    rec.start();
    try{recog=new SR();recog.lang="en-US";recog.interimResults=false;recog.maxAlternatives=3;recog.continuous=true;
    recog.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal){const al=e.results[i];for(let j=0;j<al.length;j++)if(al[j].transcript&&heard.length<6)heard.push(al[j].transcript)}}};
    recog.start()}catch(e){}
    b.classList.add("stop");b.textContent="⏹ Parar y calificar";
  }).catch(()=>alert("No pude acceder al micrófono 😢"));
}
function gradeMouth(){
  const q=Q[DIMS[dimIdx].id][qIdx];const box=$("scoreBox");if(!box||box.dataset.done)return;box.dataset.done="1";
  const res=pronScore(heard,q.target);
  if(!res||(!res.score&&!res.heard)){box.innerHTML='<div class="score-msg" style="color:#ef4444">🔇 No te escuché bien — habla fuerte y reintenta. Si estás dentro de WhatsApp, ábreme en CHROME (fuera de WhatsApp) para que el micrófono funcione</div><button class="selfbtn" onclick="retryMouth()">🔁 Reintentar</button><button class="selfbtn" onclick="selfEval(false)">🤔 Se me atoró</button>';box.style.display="block";return}
  const ok=res.score>=70;
  box.innerHTML=`<div class="score-num" style="color:${ok?"#10b981":"#eab308"}">${res.score}<span style="font-size:16px">/100</span></div>
  <div class="score-stars">${"⭐".repeat(Math.max(1,Math.round(res.score/20)))}</div>
  <div class="score-msg">${res.heard?("👂 Te escuché: “"+res.heard+"”"):""}</div>
  <div class="score-msg" style="color:${ok?"#10b981":"#eab308"}">${ok?"✅ ¡Pasaste este nivel!":"🎯 Aún no — se necesita 70 para pasar"}</div>
  <button class="selfbtn" onclick="mouthResult(${ok})">Siguiente →</button>`;
  box.style.display="block";
}
function retryMouth(){renderMouth(Q[DIMS[dimIdx].id][qIdx])}
function mouthResult(ok){
  const d=DIMS[dimIdx],q=Q[d.id][qIdx];
  results[d.id].answered++;results[d.id]["b"+q.band]=ok;
  if(!ok)results[d.id].failed=true;
  qIdx++;nextQ();
}
function selfEval(ok){mouthResult(ok)}
function endDim(){
  const d=DIMS[dimIdx],r=results[d.id];let lvl=0;
  for(let k=0;k<4;k++){if(r["b"+k])lvl=k;else break}
  r.level=BANDS[lvl];
  $("app").innerHTML=`<div class="dim-chip">Dimensión ${dimIdx+1} completada</div>
  <div class="tree">${TREE[r.level]}</div>
  <div class="q-text">${d.name} quedó en</div>
  <div class="lvl-chip" style="background:${LVLColor[r.level]}22;color:${LVLColor[r.level]}">NIVEL ${r.level}</div>
  <div class="explain">Cada dimensión se entrena en su propio escalón — el manzano no se entrena a dar naranjas por exigencia, sino por injerto 🌱.</div>
  <button class="btn btn-primary" onclick="${dimIdx<2?`startDim(${dimIdx+1})`:`renderResults()`}">${dimIdx<2?"Siguiente dimensión →":"Ver mi expediente 📋"}</button>`;
  dimIdx++;
}
function renderResults(){
  const es={ear:"Oído",eye:"Ojo",mouth:"Boca"};
  const dims=["ear","eye","mouth"].map(id=>{
    const r=results[id],l=r.level;
    return `<div class="dimbox"><h3>${es[id]}</h3><div class="tree">${TREE[l]}</div><div class="lvl-chip" style="background:${LVLColor[l]}22;color:${LVLColor[l]}">${l}</div></div>`;
  }).join("");
  const doses=["ear","eye","mouth"].map(id=>`<div class="dose"><b>${es[id]}</b> (${results[id].level}) → ${DOSE[id][results[id].level]}</div>`).join("");
  const code=`EXPEDIENTE ACCENTBRIDGES
Oído: ${results.ear.level} · Ojo: ${results.eye.level} · Boca: ${results.mouth.level}
Dosis recomendada:
${["ear","eye","mouth"].map(id=>"· "+es[id]+" ("+results[id].level+"): "+DOSE[id][results[id].level]).join("\n")}
— Level Assessment · ${new Date().toLocaleDateString("es-MX")}`;
  try{localStorage.setItem("ab_expediente",JSON.stringify({date:new Date().toISOString(),ear:results.ear.level,eye:results.eye.level,mouth:results.mouth.level}))}catch(e){}
  $("app").innerHTML=`<div class="dim-chip">📋 Expediente completo</div>
  <div class="q-text">Tu árbol por dimensión 🌳</div>
  <div class="grid3">${dims}</div>
  <div class="q-text" style="font-size:14px">Tu DOSIS (i+1 por dimensión):</div>${doses}
  <div class="explain">Siéntete orgulloso/a: acabas de usar el pasaporte entre las dos orillas del puente. Con este perfil, tu maestra dosifica cada clase a TU escalón.</div>
  <textarea class="share" rows="7" readonly onclick="this.select()">${code}</textarea>
  <div class="q-anchor">Toca el texto, cópialo y mándaselo a tu maestra por WhatsApp 📲</div>
  <button class="btn btn-ghost" onclick="location.reload()">🔄 Repetir el assessment</button>`;
}
/* demo interno: assessment.html#demo */
if(location.hash==="#demo"){results={ear:{level:"A2"},eye:{level:"A1"},mouth:{level:"A1"}};renderResults()}
else intro();
</script>
</body>
</html>
