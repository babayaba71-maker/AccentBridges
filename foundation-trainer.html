<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5d46e2">
<title>English Foundation Trainer v3.2 — Myl AccentBridges</title>
<!-- v3.2 EJÉRCITO COMPLETO: despliegues 2+3 (Magic E+mudas, dígrafos vocálicos, T posicional, clusters) + FIX quiz branches muertos (canto/sazón/realvowels vivían en renderCard inalcanzables desde v2.9 — ahora en renderQuiz). 20 pestañas. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<style>
:root{
  --primary:#5d46e2;--primary-dark:#4c38c4;--bg:#f3f5fa;--card:#ffffff;--text:#1f2937;
  --text-soft:#6b7280;--accent-bg:#fff0f3;--accent-border:#f3d8e6;--accent-text:#8b5cf6;
  --pill:#ffffff;--pill-active:#5d46e2;--pill-text:#374151;--ok:#10b981;--bad:#ef4444;
  --shadow:0 10px 30px rgba(93,70,226,.12);
}
[data-theme="dark"]{
  --primary:#7c6cff;--primary-dark:#5d46e2;--bg:#0f1222;--card:#181b2e;--text:#e5e7eb;
  --text-soft:#9ca3af;--accent-bg:#241a2b;--accent-border:#3b2a47;--accent-text:#c4b5fd;
  --pill:#232642;--pill-active:#5d46e2;--pill-text:#d1d5db;--ok:#34d399;--bad:#f87171;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;transition:background .3s,color .3s}
header{background:var(--primary);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 4px 14px rgba(93,70,226,.35);position:sticky;top:0;z-index:20}
.h-left{display:flex;align-items:center;gap:10px;min-width:0}
.h-flag{font-size:24px}
.h-titles{min-width:0}
h1{font-size:17px;font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-sub{font-size:11.5px;opacity:.85;font-weight:500}
.h-right{display:flex;gap:8px;align-items:center}
.h-btn{border:none;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;transition:background .2s}
.h-btn:active{background:rgba(255,255,255,.32)}
.progress-wrap{max-width:720px;width:100%;margin:14px auto 4px;padding:0 16px}
.progress-card{background:var(--card);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.p-label{font-size:12px;color:var(--text-soft);font-weight:700;white-space:nowrap}
.p-track{flex:1;height:10px;background:var(--bg);border-radius:999px;overflow:hidden;position:relative}
.p-fill{height:100%;background:linear-gradient(90deg,var(--primary),#f59e0b);border-radius:999px;width:0%;transition:width .5s}
.p-pts{font-size:13px;font-weight:800;color:var(--primary);white-space:nowrap}
main{max-width:720px;width:100%;margin:0 auto;padding:10px 16px 90px;flex:1}
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;max-width:720px;margin:0 auto;width:100%;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;border:1.5px solid transparent;background:var(--pill);color:var(--pill-text);border-radius:999px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tab.active{background:var(--pill-active);color:#fff;box-shadow:0 4px 12px rgba(93,70,226,.4)}
.card{background:var(--card);border-radius:24px;padding:28px 20px 22px;box-shadow:var(--shadow);text-align:center;animation:pop .35s ease}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.97)}100%{opacity:1;transform:none}}
.emoji{font-size:64px;line-height:1;margin-bottom:8px}
.value{font-size:46px;font-weight:900;color:var(--primary);letter-spacing:.5px;word-break:break-word}
.translation{font-size:17px;color:var(--text-soft);font-weight:600;margin-top:4px}
.say-box{background:var(--accent-bg);border:1.5px solid var(--accent-border);border-radius:18px;padding:14px;margin-top:18px}
.say-label{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--text-soft)}
.say-phon{font-size:30px;font-weight:900;color:var(--accent-text);margin:4px 0 6px}
.say-tip{font-size:13px;font-style:italic;color:var(--accent-text);opacity:.95}
.melody-note{font-size:13px;color:var(--text-soft);font-style:italic;margin-top:8px}
.curve{margin:14px auto 4px;display:block}
.dots{display:flex;gap:7px;justify-content:center;margin:18px 0 4px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--text-soft);opacity:.35;cursor:pointer;border:none;padding:0;transition:all .2s}
.dot.on{background:var(--primary);opacity:1;transform:scale(1.25)}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:16px;font-size:16.5px;font-weight:800;cursor:pointer;transition:transform .1s,box-shadow .2s;margin-top:14px}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(93,70,226,.4)}
.btn-secondary{background:var(--accent-bg);color:var(--primary);border:1.5px solid var(--accent-border)!important}
.btn-ghost{background:transparent;color:var(--text-soft);border:1.5px solid var(--text-soft)!important;opacity:.85}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.speed-row{display:flex;gap:8px;justify-content:center;margin-top:12px;align-items:center}
.speed-chip{border:1.5px solid var(--text-soft);background:transparent;color:var(--text-soft);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .2s}
.speed-chip.on{border-color:var(--primary);background:var(--primary);color:#fff}
.rec-zone{margin-top:16px;background:var(--accent-bg);border:1.5px dashed var(--accent-border);border-radius:18px;padding:14px}
.rec-title{font-size:13px;font-weight:800;color:var(--accent-text);display:flex;align-items:center;gap:6px;justify-content:center}
.rec-row{display:flex;gap:10px;margin-top:10px}
.rec-btn{flex:1;border:none;border-radius:12px;padding:12px;font-weight:800;font-size:14px;cursor:pointer;background:var(--primary);color:#fff}
.rec-btn.stop{background:var(--bad)}
.rec-btn.play{background:var(--accent-text);color:#fff}
audio.rec-play{width:100%;margin-top:10px}
.quiz-zone{margin-top:18px;background:var(--card);border:2px solid var(--primary);border-radius:24px;padding:20px;text-align:center;box-shadow:var(--shadow);animation:pop .3s ease}
.q-title{font-size:16px;font-weight:900;color:var(--primary);margin-bottom:4px}
.q-sub{font-size:12.5px;color:var(--text-soft);margin-bottom:14px}
.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q-opts.one-col{grid-template-columns:1fr}
.q-opt{border:2px solid var(--accent-border);background:var(--accent-bg);border-radius:14px;padding:14px 8px;font-size:14.5px;font-weight:800;color:var(--text);cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:4px;align-items:center}
.q-opt .q-emoji{font-size:24px}
.q-opt.correct{border-color:var(--ok);background:rgba(16,185,129,.12)}
.q-opt.dim{opacity:.45}
.q-opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.10)}
.q-feedback{margin-top:12px;font-size:13.5px;font-weight:700;min-height:20px}
.q-replay{margin-top:10px;font-size:13px;font-weight:700;color:var(--primary);background:none;border:none;text-decoration:underline;cursor:pointer}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);color:var(--text);border-radius:999px;padding:12px 22px;font-size:14px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50;transition:transform .4s cubic-bezier(.2,.9,.3,1.2);display:flex;gap:8px;align-items:center;border:1.5px solid var(--accent-border)}
.toast.show{transform:translateX(-50%) translateY(0)}
.waveform{display:flex;gap:3px;height:26px;align-items:center;justify-content:center;margin-top:12px}
.waveform-bar{width:4px;border-radius:2px;background:var(--primary);opacity:.25;animation:wave 1s ease-in-out infinite}
.waveform-bar--active{opacity:1}
@keyframes wave{0%,100%{height:6px}50%{height:24px}}
.modal-overlay{position:fixed;inset:0;background:rgba(15,18,34,.7);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;backdrop-filter:blur(3px)}
.certificate{background:var(--card);border-radius:24px;padding:12px;max-width:380px;width:100%;animation:pop .4s ease}
.certificate-border{border:3px double var(--primary);border-radius:18px;padding:26px 20px;text-align:center}
.certificate-title{font-size:52px}
.certificate h2{margin:8px 0 6px;color:var(--primary);font-size:20px}
.certificate-subtitle{font-size:14px;color:var(--text);font-weight:700}
.certificate-body{font-size:13px;color:var(--text-soft);margin:8px 0 16px}
footer{margin-top:auto;text-align:center;padding:16px;font-size:11.5px;color:var(--text-soft);opacity:.8}
.melody-chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-bg);border:1.5px solid var(--accent-border);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;color:var(--accent-text);margin-top:10px}
.score-zone{margin-top:10px;background:var(--accent-bg,#f5f3ff);border:1.5px solid var(--accent-border,#ddd6fe);border-radius:14px;padding:12px 14px;text-align:center}
.score-num{font-size:42px;font-weight:900;line-height:1.1}
.score-msg{font-size:13px;font-weight:700;margin-top:2px}
.score-heard{font-size:12px;color:var(--text-soft,#777);margin-top:6px;font-style:italic}
.score-best{font-size:12px;font-weight:800;margin-top:6px}
.score-stars{font-size:15px;margin-top:2px;letter-spacing:1px}
@media(max-width:420px){.value{font-size:38px}.emoji{font-size:54px}}

/* ===== CALENTAMIENTO DE CANTANTE v2.7 ===== */
.wu-desc{font-size:14.5px;color:var(--text-soft);line-height:1.55;margin-top:6px}
.wu-circle-wrap{display:flex;justify-content:center;margin:20px 0 10px}
.wu-circle{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#a78bfa,var(--primary));box-shadow:0 10px 30px rgba(93,70,226,.35);transform:scale(1)}
.wu-phase{font-size:15px;font-weight:800;color:var(--primary);min-height:22px;margin:4px 0 8px}
.wu-row{display:flex;gap:10px;margin-top:12px}
.wu-row .btn{margin-top:0}
.wu-notes{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.wu-note{border:1.5px solid var(--accent-border);background:var(--accent-bg);color:var(--primary);border-radius:999px;padding:12px 15px;font-weight:800;font-size:15px;cursor:pointer}
.wu-note:active{transform:scale(.94)}
.wu-dbs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.wu-db{border:1.5px solid var(--accent-border);background:var(--accent-bg);border-radius:14px;padding:12px 6px;font-weight:800;font-size:13.5px;cursor:pointer;color:var(--text)}
.wu-db:active{transform:scale(.95)}
.wu-mini{font-size:12.5px;color:var(--text-soft);font-style:italic;margin-top:10px}
</style>
</head>
<body>
<header>
  <div class="h-left">
    <span class="h-flag">🇺🇸</span>
    <div class="h-titles">
      <h1 id="hTitle">English Foundation Trainer</h1>
      <div class="h-sub" id="hSub">Para hispanohablantes · Nivel A1</div>
    </div>
  </div>
  <div class="h-right">
    <button class="h-btn" id="langBtn" onclick="toggleLang()">🇪🇸 ES</button>
    <button class="h-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>
</header>

<div class="progress-wrap">
  <div class="progress-card">
    <span class="p-label" id="pLabel">🏆 Puntos</span>
    <div class="p-track"><div class="p-fill" id="pFill"></div></div>
    <span class="p-pts" id="pPts">0</span>
  </div>
</div>

<nav class="tabs" id="tabs"></nav>

<main>
  <div class="card" id="mainCard"></div>
  <div class="dots" id="dots"></div>
  <div id="listenZone"></div>
  <div class="rec-zone" id="recZone">
    <div class="rec-title" id="recTitle">🎤 <span id="recTitleTxt">Graba tu voz</span></div>
    <div class="rec-row">
      <button class="rec-btn" id="recBtn" onclick="toggleRecord()">⏺ <span id="recBtnTxt">Grabar</span></button>
      <button class="rec-btn play" id="recPlayBtn" onclick="playRecording()" style="display:none">▶️ <span id="recPlayTxt">Escuchar</span></button>
    </div>
    <audio class="rec-play" id="recAudio" controls style="display:none"></audio>
    <div class="score-zone" id="scoreZone" style="display:none"></div>
  </div>
  <div class="quiz-zone" id="quizZone" style="display:none"></div>
  <div class="row" style="margin-top:14px">
    <button class="btn btn-ghost" id="prevBtn" onclick="nav(-1)">← <span id="prevTxt">Anterior</span></button>
    <button class="btn btn-primary" id="nextBtn" onclick="nav(1)"><span id="nextTxt">Siguiente</span> →</button>
  </div>
  <button class="btn btn-secondary" id="quizToggle" onclick="toggleQuiz()">🧠 <span id="quizToggleTxt">Modo Quiz</span></button>
  <footer>Parte del ecosistema Myl AccentBridges 🇲🇽➡️🇺🇸 · Alma &amp; Clyde</footer>
</main>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="certModal" style="display:none" onclick="closeCert(event)">
  <div class="certificate">
    <div class="certificate-border">
      <div class="certificate-title">🎓</div>
      <h2 id="certTitle">Certificado de Logro</h2>
      <p class="certificate-subtitle" id="certSub">¡Felicitaciones! ¡Has ganado 100 puntos!</p>
      <p class="certificate-body" id="certBody">¡Completaste el Entrenador de Inglés Básico!</p>
      <button class="btn btn-primary" onclick="hideCert()" id="certBtn">Seguir Aprendiendo 🚀</button>
    </div>
  </div>
</div>

<script>
/* ================= DATA ================= */
const VOWELS=[
 {value:"A",phonetic:"Ey",phoneticEs:'Como "ey" en "rey" 👑',emoji:"🍎"},
 {value:"E",phonetic:"Ii",phoneticEs:'Como "ii" en español',emoji:"🐘"},
 {value:"I",phonetic:"Ai",phoneticEs:'Como "ai" en español',emoji:"🍦"},
 {value:"O",phonetic:"Ou",phoneticEs:'Como "ou" en español',emoji:"🍊"},
 {value:"U",phonetic:"Iu",phoneticEs:'Como "iu" en español',emoji:"☂️"}];


/* ===== SOUNDS v2.6 — EL SISTEMA COMPLETO DE VOCALES + LOS 3 Y (Cartilla Americana paso 1) ===== */
const SOUNDS=[
 {value:"see",phonetic:"SII",phoneticEs:'Vocal ii LARGA — se estira: "siiii" (como sheep 🐑)',emoji:"🐑"},
 {value:"ship",phonetic:"SIP",phoneticEs:'Vocal i CORTA — rápida, sin estirar (ship = barco, NO sheep)',emoji:"🚢"},
 {value:"bed",phonetic:"BED",phoneticEs:'e corta — igual que en español',emoji:"🛏️"},
 {value:"cat",phonetic:"KAT",phoneticEs:'Entre "e" y "a" — boca BIEN abierta, mandíbula abajo',emoji:"🐱"},
 {value:"cup",phonetic:"KAP",phoneticEs:'u rápida y relajada — "kap" (no "kiup")',emoji:"☕"},
 {value:"hot",phonetic:"JAT",phoneticEs:'a PROFUNDA de garganta — "jat"',emoji:"🌶️"},
 {value:"blue",phonetic:"BLUU",phoneticEs:'u LARGA con labios redondos — "bluuu"',emoji:"💙"},
 {value:"book",phonetic:"BUK",phoneticEs:'u corta relajada — "buk" (¡dos O, un solo sonido!)',emoji:"📚"},
 {value:"go",phonetic:"GOU",phoneticEs:'ou — empieza con o y desliza a u',emoji:"🚦"},
 {value:"rain",phonetic:"REIN",phoneticEs:'ei — rima con "rein" 👑',emoji:"🌧️"},
 {value:"boy",phonetic:"BOI",phoneticEs:'oi — como en español "boy"',emoji:"👦"},
 {value:"now",phonetic:"NAU",phoneticEs:'au — "nau" (empieza con a, cierra en u)',emoji:"⏰"},
 {value:"about",phonetic:"ABAUT",phoneticEs:'SCHWA "uh" — la vocal más común del inglés (Episodio 3 🛋️)',emoji:"🛋️"},
 {value:"bird",phonetic:"BERD",phoneticEs:'r COLORIDA — la vocal y la r se funden: "berrrd"',emoji:"🐦"},
 {value:"yes",phonetic:"YES",phoneticEs:'LA Y #1: al INICIO = consonante "ye"',emoji:"✅"},
 {value:"my",phonetic:"MAI",phoneticEs:'LA Y #2: al FINAL de palabra CORTA = "ai"',emoji:"😎"},
 {value:"happy",phonetic:"JAPI",phoneticEs:'LA Y #3: al FINAL de palabra LARGA = i corta "i"',emoji:"😊"}];

/* ===== DIGRAPHS v2.6 — DOS LETRAS, UN SONIDO + LA T POSICIONAL (Cartilla Americana paso 3) ===== */
const DIGRAPHS=[
 {value:"moon",phonetic:"MUN",phoneticEs:'OO = u LARGA — "mun" (dos O, un sonido)',emoji:"🌙"},
 {value:"food",phonetic:"FUD",phoneticEs:'OO = u larga — "fud" (igual que moon)',emoji:"🍕"},
 {value:"feet",phonetic:"FIIT",phoneticEs:'EE = ii larga — "fiit" (dos E, un sonido)',emoji:"🦶"},
 {value:"train",phonetic:"TREIN",phoneticEs:'AI = ei — "trein" (la I no suena i)',emoji:"🚂"},
 {value:"boat",phonetic:"BOUT",phoneticEs:'OA = ou — "bout" (la A se esconde)',emoji:"⛵"},
 {value:"teacher",phonetic:"TII-cher",phoneticEs:'EA = ii — "tii-cher" (¡la A es trampa del ojo, no suena!)',emoji:"👩‍🏫"},
 {value:"coin",phonetic:"KOIN",phoneticEs:'OI = oi — "koin"',emoji:"🪙"},
 {value:"house",phonetic:"JAUS",phoneticEs:'OU = au — "jaus" (¡no es "jo-se"!)',emoji:"🏠"},
 {value:"fish",phonetic:"FISH",phoneticEs:'SH = shhh — "fish" (la S y la H se unen)',emoji:"🐟"},
 {value:"chair",phonetic:"CHER",phoneticEs:'CH = che — como chi-che chi-cho',emoji:"🪑"},
 {value:"think",phonetic:"ZINK",phoneticEs:'TH = lengua ENTRE los dientes, aire sin voz — "think"',emoji:"🤔"},
 {value:"this",phonetic:"DIS",phoneticEs:'TH con VOZ — misma lengua, garganta suena — "dis"',emoji:"👉"},
 {value:"phone",phonetic:"FON",phoneticEs:'PH = f — "fon" (¡trampa del ojo: P y H suenan F!)',emoji:"📞"},
 {value:"top",phonetic:"TOP",phoneticEs:'LA T #1: al INICIO — limpia y clara con aire',emoji:"🎯"},
 {value:"water",phonetic:"WA-DER",phoneticEs:'LA T #2: en MEDIO — flap! golpe suave como la R de "pero" (Episodio 5)',emoji:"💧"},
 {value:"cat",phonetic:"KAT",phoneticEs:'LA T #3: al FINAL — el aire se CORTA, la T no explota',emoji:"🐈"}];

const ALPHABET=[
 {value:"A",phonetic:"Ey",phoneticEs:'Como "ey" en "rey" 👑',emoji:"🍎"},
 {value:"B",phonetic:"Bi",phoneticEs:'Como "bi"',emoji:"🐝"},
 {value:"C",phonetic:"Si",phoneticEs:'Como "si"',emoji:"🐱"},
 {value:"D",phonetic:"Di",phoneticEs:'Como "di"',emoji:"🐶"},
 {value:"E",phonetic:"Ii",phoneticEs:'Como "ii"',emoji:"🐘"},
 {value:"F",phonetic:"Ef",phoneticEs:'Como "ef"',emoji:"🐸"},
 {value:"G",phonetic:"Lli",phoneticEs:'Como "lli" (sonido suave "yi")',emoji:"🦒"},
 {value:"H",phonetic:"Eich",phoneticEs:'Como "eich"',emoji:"🏠"},
 {value:"I",phonetic:"Ai",phoneticEs:'Como "ai"',emoji:"🍦"},
 {value:"J",phonetic:"Yei",phoneticEs:'Como "yei"',emoji:"🃏"},
 {value:"K",phonetic:"Key",phoneticEs:'Como "key" (rima con rey 👑)',emoji:"🔑"},
 {value:"L",phonetic:"El",phoneticEs:'Como "el"',emoji:"🦁"},
 {value:"M",phonetic:"Em",phoneticEs:'Como "em"',emoji:"🐒"},
 {value:"N",phonetic:"En",phoneticEs:'Como "en"',emoji:"🌙"},
 {value:"O",phonetic:"Ou",phoneticEs:'Como "ou"',emoji:"🍊"},
 {value:"P",phonetic:"Pi",phoneticEs:'Como "pi"',emoji:"🐧"},
 {value:"Q",phonetic:"Kiu",phoneticEs:'Como "kiu"',emoji:"👸"},
 {value:"R",phonetic:"Ar",phoneticEs:'Como "ar" (relajada, nos vamos a entender 😊)',emoji:"🌹"},
 {value:"S",phonetic:"Es",phoneticEs:'Como "es"',emoji:"☀️"},
 {value:"T",phonetic:"Ti",phoneticEs:'Como "ti"',emoji:"🐯"},
 {value:"U",phonetic:"Iu",phoneticEs:'Como "iu"',emoji:"☂️"},
 {value:"V",phonetic:"Vi",phoneticEs:'Como "vi"',emoji:"🌋"},
 {value:"W",phonetic:"Dábliu",phoneticEs:'Como "dábliu"',emoji:"🐋"},

function speak(text,cb){
  if(!window.speechSynthesis){alert("Tu navegador no soporta voz 😢");if(cb)cb();return}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";u.rate=speed;
  const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.startsWith("en"));
  if(vs.length){const us=vs.find(v=>v.lang==="en-US")||vs[0];u.voice=us}
  u.onstart=()=>{speaking=true;renderWave(true)};
  u.onend=()=>{speaking=false;renderWave(false);if(cb)cb()};
  u.onerror=()=>{speaking=false;renderWave(false);if(cb)cb()};
  window.speechSynthesis.speak(u);
}

 o.connect(g);g.connect(ac.destination);
 if(mod){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=mod;lg.gain.value=(vol||.16)*.8;l.connect(lg);lg.connect(g.gain);l.start(ac.currentTime);l.stop(ac.currentTime+dur)}

function buildQuizOpts(){
  const pool=[...list()],opts=[card()];
  pool.splice(idx,1);
  while(opts.length<4&&pool.length){const r=Math.floor(Math.random()*pool.length);opts.push(pool[r]);pool.splice(r,1)}
  quizOpts=opts.sort(()=>Math.random()-.5);
}

function toast(msg){
  const tEl=$("toast");tEl.innerHTML=msg;tEl.classList.add("show");
  setTimeout(()=>tEl.classList.remove("show"),1800);
}

async function toggleRecord(){
  const btn=$("recBtn");
  if(recorder&&recorder.state==="recording"){recorder.stop();stopRecog();return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    recChunks=[];recorder=new MediaRecorder(stream);
    recorder.ondataavailable=e=>recChunks.push(e.data);
    recorder.onstop=()=>{
      stream.getTracks().forEach(x=>x.stop());
      if(recURL)URL.revokeObjectURL(recURL);
      recURL=URL.createObjectURL(new Blob(recChunks,{type:"audio/webm"}));
      const au=$("recAudio");au.src=recURL;au.style.display="block";
      $("recPlayBtn").style.display="block";
      $("recBtnTxt").textContent=t().rec;$("recBtn").classList.remove("stop");
      toast(lang==="es"?"🎧 ¡Escúchate! Compara con la maestra":"🎧 Listen to yourself!");
    };
    recorder.start();
    startRecog();
    $("recBtn").classList.add("stop");$("recBtnTxt").textContent=t().stop;
  }catch(e){alert(lang==="es"?"No pude acceder al micrófono 😢":"Couldn't access the microphone 😢")}
}

/* ================= 🎯 MOTOR DE EVALUACIÓN DE PRONUNCIACIÓN (v2.4) ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recog=null,heardAlts=[],recogDead=false,evalTimer=null;
const bestKey=()=>"eft_best_"+tab+"_"+idx;
const bestScore=()=>parseInt(lsGet(bestKey(),"0"),10)||0;
const NUMWORD={1:"one",2:"two",3:"three",4:"four",5:"five",6:"six",7:"seven",8:"eight",9:"nine",10:"ten",11:"eleven",12:"twelve",13:"thirteen",14:"fourteen",15:"fifteen",16:"sixteen",17:"seventeen",18:"eighteen",19:"nineteen",20:"twenty",30:"thirty",40:"forty",50:"fifty",60:"sixty",70:"seventy",80:"eighty",90:"ninety",100:"one hundred",110:"one hundred ten",120:"one hundred twenty",200:"two hundred",300:"three hundred",1000:"one thousand",2000:"two thousand",3000:"three thousand",A:"a",B:"bee",C:"see",D:"dee",E:"e",F:"eff",G:"gee"};
function normTxt(s){return String(s||"").toLowerCase().replace(/[.,!?;:'"()]/g," ").replace(/\s+/g," ").trim()}
function normTokens(txt){
  return normTxt(txt).split(" ").filter(Boolean).flatMap(w=>{
    const rep=NUMWORD[w.toUpperCase()]||NUMWORD[w]||w;
    return String(rep).split(" ")});
}
function lev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let prev=Array.from({length:n+1},(_,j)=>j),cur=new Array(n+1);
  for(let i=1;i<=m;i++){cur[0]=i;
    for(let j=1;j<=n;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1))}
    [prev,cur]=[cur,prev]}
  return prev[n];
}
function pronScore(){
  const c=card();
  const target=(tab==="melody")?(c.example||""):(c.value||"");
  const tgt=normTokens(target);
  if(!tgt.length)return null;
  let best=0,heard="";
  for(const alt of heardAlts){
    const ht=normTokens(alt);
    if(!ht.length)continue;
    let sum=0;const used=new Array(ht.length).fill(false);
    for(const tw of tgt){
      let sw=0,bi=-1;
      ht.forEach((hw,hi)=>{
        if(used[hi])return;
        const d=lev(tw,hw);
        const tol=(Math.max(tw.length,hw.length)>=6)?2:1;
        const s=(d===0)?1:(d<=tol?(d===1?0.6:0.3):0);
        if(s>sw){sw=s;bi=hi}
      });
      if(bi>=0)used[bi]=true;
      sum+=sw;
    }
    const sc=Math.round(100*sum/tgt.length);
    if(sc>best||(sc>=best&&!heard)){best=Math.max(best,sc);heard=alt}
  }
  return{score:Math.min(100,best),heard,target};
}
function scoreTier(s){
  if(s>=90)return{c:"#10b981",e:"🔥",m:"¡NIVEL NATIVO! Suenas como la muestra"};
  if(s>=75)return{c:"#22c55e",e:"😎",m:"¡Muy bien hecho! Cada vez más americano"};
  if(s>=60)return{c:"#eab308",e:"💪",m:"¡Vas bien! Una vez más y sube el score"};
  if(s>=40)return{c:"#f97316",e:"🎧",m:"Tu boca encontró su gimnasio — escucha la muestra y repite"};
  return{c:"#ef4444",e:"🌱",m:"Tranquilo — nadie nació hablando. Escucha y reintenta"};
}
function updatePointsUI(){$("pPts").textContent=points();$("pFill").style.width=Math.min(100,points()%100)+"%"}
function showScore(res){
  const z=$("scoreZone");if(!z)return;
  const tier=scoreTier(res.score);
  const nStars=Math.max(1,Math.round(res.score/20));
  const b=bestScore();
  let gain=0;
  if(res.score>b){gain=res.score-b;lsSet(bestKey(),String(res.score))}
  if(gain>0){setPoints(points()+gain);updatePointsUI();toast("🎉 +"+gain+" puntos")}
  let html='<div class="score-num" style="color:'+tier.c+'">'+res.score+'<span style="font-size:16px">/100</span></div>';
  html+='<div class="score-stars">'+"⭐".repeat(nStars)+'</div>';
  html+='<div class="score-msg" style="color:'+tier.c+'">'+tier.e+" "+tier.m+'</div>';
  if(res.heard)html+='<div class="score-heard">👂 Te escuché: “'+res.heard+'”</div>';
  html+='<div class="score-best">🏆 Tu récord en esta tarjeta: '+Math.max(b,res.score)+'</div>';
  z.innerHTML=html;z.style.display="block";
  if(gain>0&&points()>=100)showCert();
}
function startRecog(){
  heardAlts=[];recogDead=false;
  if(!SR){recogDead=true;return}
  try{
    recog=new SR();recog.lang="en-US";recog.interimResults=false;recog.maxAlternatives=3;recog.continuous=true;
    recog.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal){const alts=e.results[i];for(let j=0;j<alts.length;j++){if(alts[j].transcript&&heardAlts.length<6)heardAlts.push(alts[j].transcript)}}}};
    recog.onerror=()=>{recogDead=true};
    recog.start();
  }catch(e){recogDead=true}
}
function stopRecog(){
  try{if(recog)recog.stop()}catch(e){}
  if(evalTimer)clearTimeout(evalTimer);
  evalTimer=setTimeout(()=>{
    if(heardAlts.length>0){const r=pronScore();if(r)showScore(r)}
    else{
      const z=$("scoreZone");
      if(z&&recogDead&&SR){z.innerHTML='<div class="score-msg" style="color:#ef4444">🔇 No pude escucharte bien. Acércate al mic y reintenta</div><div class="score-best">Tip: habla fuerte y claro 🗣️</div>';z.style.display="block"}
      else if(z){z.innerHTML='<div class="score-msg" style="color:#f97316">📱 Tu navegador no puede calificar la voz — usa Chrome para el score del 1 al 100</div>';z.style.display="block"}
    }
  },1300);
}
