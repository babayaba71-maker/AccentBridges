<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Ensamblando — Pronombres + To be</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,#0d1b2a,#1b263b 60%,#2a9d8f 140%);min-height:100vh;color:#fff;display:flex;flex-direction:column;align-items:center;padding:14px;max-width:520px;margin:0 auto}
h1{font-size:1.25rem;text-align:center;margin:6px 0 2px}
.sub{font-size:.8rem;color:#a8dadc;text-align:center;margin-bottom:10px}
.card{background:#fff;color:#1b263b;border-radius:22px;width:100%;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);text-align:center}
button{border:0;border-radius:14px;font-size:1rem;font-weight:700;padding:13px 18px;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.96)}
.big{background:#2a9d8f;color:#fff;width:100%;font-size:1.05rem}
.listen{background:#e9c46a;color:#1b263b}
.hidden{display:none}
.paso{font-size:.72rem;color:#6c757d;margin:10px 0 6px;letter-spacing:.5px;text-transform:uppercase;font-weight:700}
.slots{display:flex;gap:10px;justify-content:center;margin:10px 0 4px}
.slot{width:110px;height:56px;border:3px dashed #2a9d8f;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:900;color:#1b263b;background:#f1faee}
.slot.full{border-style:solid;background:#2a9d8f;color:#fff}
.opt{background:#f1faee;color:#1b263b;border:3px solid #2a9d8f;border-radius:14px;font-size:1.35rem;padding:16px;position:relative}
.opt .n{position:absolute;top:6px;left:10px;font-size:.75rem;color:#e9c46a}
.opt.ok{background:#2a9d8f;color:#fff}
.opt.no{background:#e76f51;color:#fff;border-color:#e76f51}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fb{margin-top:12px;font-size:1rem;font-weight:800;min-height:1.4em}
.fb.ok{color:#2a9d8f}.fb.no{color:#e76f51}.fb.trampa{color:#e76f51}
.veri{font-size:.85rem;color:#6c757d;margin-top:8px;font-style:italic}
.next{background:#1b263b;color:#fff;margin-top:12px;width:100%}
input{width:100%;border:3px solid #2a9d8f;border-radius:14px;padding:13px;font-size:1rem;margin:8px 0}
.end{font-size:1.6rem;font-weight:900;color:#2a9d8f;margin:14px 0 4px}
.meta{font-size:.8rem;color:#6c757d;line-height:1.5;margin-top:10px}
.bq{margin-top:10px;font-size:.8rem;color:#264653}
.score{position:absolute;top:10px;right:12px;background:rgba(255,255,255,.15);border-radius:10px;padding:4px 10px;font-size:.75rem;font-weight:700}
.wrap{position:relative;width:100%}
.instru{font-size:.85rem;color:#457b9d;margin:2px 0 8px;font-weight:600}
</style>
</head>
<body>
<div class="wrap"><span class="score" id="score"></span></div>
<h1>🧩 Ensamblando</h1>
<div style="font-size:.6rem;color:rgba(255,255,255,.35);text-align:center" id="ver">v1.1</div>
<div class="sub">Pronombres + To be — Fase 2: arma el chunk de oído</div>

<!-- PANTALLA 0: nombre -->
<div class="card" id="p0">
  <div class="paso">antes de empezar</div>
  <h2 style="margin:8px 0">¿Cómo te llamas?</h2>
  <input id="name" placeholder="Tu nombre" autocomplete="off">
  <button class="big" onclick="start()">¡Ensamblar! 🧩</button>
  <div class="meta">Vas a escuchar un chunk.<br>Tapa las DOS palabras correctas, EN ORDEN.<br>Primero se escucha, después se ve. 😉</div>
</div>

<!-- PANTALLA 1: tarjeta -->
<div class="card hidden" id="p1">
  <div class="paso" id="mazoTag"></div>
  <div class="instru">🔊 Escucha y arma el chunk:</div>
  <button class="listen" style="width:100%" onclick="say(cur.audio,0.8)">🔊 Escuchar otra vez</button>
  <div class="slots">
    <div class="slot" id="s0">1</div>
    <div class="slot" id="s1">2</div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="fb" id="fb"></div>
  <div class="veri hidden" id="veri"></div>
  <button class="next hidden" id="next" onclick="nx()">Siguiente →</button>
</div>

<!-- PANTALLA 2: final -->
<div class="card hidden" id="p2">
  <div class="end" id="endTitle"></div>
  <div id="endMsg" style="font-size:.95rem;line-height:1.5"></div>
  <div class="bq" id="bq"></div>
  <button class="big" style="margin-top:14px" onclick="location.reload()">Jugar otra vez 🔁</button>
</div>

<script>
// ====== ENSAMBLANDO — Mazo 1 Fase 2 (v1, 11-oct-2026, idea original de Seeley) ======
// Doctrina: el chunk se escucha, se arma EN ORDEN, y las trampas cruzadas (I are, he are…)
// enseñan que el PATRÓN existe o no existe. Oído primero, ojo después.
// "I" siempre mayúscula (hecho real del inglés); demás pronombres en minúscula para no regalar el atajo visual.
const DECK=[
 {id:"e2_01",parts:["I","am"],audio:"I am.",rev:"I am",veri:"yo soy / yo estoy",decoys:["are","you"],trampa:{key:"I are",msg:"🚫 I are NO existe — con I siempre va AM"}},
 {id:"e2_02",parts:["you","are"],audio:"You are.",rev:"You are",veri:"tú eres / tú estás",decoys:["is","he"],trampa:{key:"you is",msg:"🚫 You is NO existe — con YOU siempre va ARE"}},
 {id:"e2_03",parts:["he","is"],audio:"He is.",rev:"He is",veri:"él es / él está",decoys:["are","she"],trampa:{key:"he are",msg:"🚫 He are NO existe — con HE va IS"}},
 {id:"e2_04",parts:["she","is"],audio:"She is.",rev:"She is",veri:"ella es / ella está",decoys:["am","he"],trampa:{key:"she am",msg:"🚫 She am NO existe — con SHE va IS"}},
 {id:"e2_05",parts:["it","is"],audio:"It is.",rev:"It is",veri:"eso es / está",decoys:["are","they"],trampa:{key:"it are",msg:"🚫 It are NO existe — con IT va IS"}},
 {id:"e2_06",parts:["we","are"],audio:"We are.",rev:"We are",veri:"nosotros somos",decoys:["is","I"],trampa:{key:"we is",msg:"🚫 We is NO existe — con WE va ARE"}},
 {id:"e2_07",parts:["they","are"],audio:"They are.",rev:"They are",veri:"ellos son / ellos están",decoys:["am","we"],trampa:{key:"they am",msg:"🚫 They am NO existe — con THEY va ARE"}}
];
const BQ_TAP="https://valerie.base44.app/functions/logFlashcardTap";
const BQ_SES="https://valerie.base44.app/functions/logMorfofonoSession";
const KEY="ABVC-PILOTO-2026";
let BASE=0,NAME="",cur=null,idx=0,ok=0,tot=0,queue=[],repeats=[],tries=0,sel=[],logS=[],locked=false;

function say(txt,rate){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang="en-US";u.rate=rate||0.9;const v=speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
document.addEventListener("click",()=>{try{speechSynthesis.getVoices()}catch(e){}},{once:true});

function start(){
  NAME=(document.getElementById("name").value||"Estudiante").trim().slice(0,40);
  queue=DECK.map(c=>Object.assign({},c));BASE=DECK.length;idx=0;ok=0;tot=0;sel=[];logS=[];repeats=[];
  document.getElementById("p0").classList.add("hidden");
  showCard();
}
function showCard(){
  cur=queue[idx];tries=0;sel=[];locked=false;
  document.getElementById("mazoTag").textContent="🧩 Ensamblando · "+(idx+1)+" de "+queue.length+(cur.requeued?" (repaso)":"");
  document.getElementById("p1").classList.remove("hidden");
  document.getElementById("fb").textContent="";document.getElementById("fb").className="fb";
  document.getElementById("veri").classList.add("hidden");
  document.getElementById("next").classList.add("hidden");
  document.getElementById("score").textContent="⭐ "+ok+"/"+tot;
  paintSlots();paintOpts();
  setTimeout(()=>say(cur.audio,0.8),400);
}
function mezclar(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function paintSlots(){
  [0,1].forEach(i=>{
    const s=document.getElementById("s"+i);
    if(sel[i]){s.textContent=sel[i];s.classList.add("full")}
    else{s.textContent=i+1;s.classList.remove("full")}
  });
}
function paintOpts(){
  const o=document.getElementById("opts");o.innerHTML="";
  mezclar(cur.parts.concat(cur.decoys)).forEach(w=>{
    const b=document.createElement("button");b.className="opt";b.dataset.w=w;
    b.onclick=()=>tap(w,b);o.appendChild(b);
    const n=sel.indexOf(w);
    b.textContent=w;
    if(n>=0){const sp=document.createElement("span");sp.className="n";sp.textContent=n+1;b.appendChild(sp);b.classList.add("ok")}
    if(locked){b.disabled=true}
  });
}
function tap(w){
  if(locked)return;
  const i=sel.indexOf(w);
  if(i>=0){sel.splice(i,1)}           // des-tapar quita la palabra
  else{if(sel.length>=2)return;sel.push(w)}
  paintSlots();paintOpts();
  if(sel.length===2)check();
}
function check(){
  tries++;tot++;locked=true;
  const good=(sel[0]===cur.parts[0]&&sel[1]===cur.parts[1]);
  const combo=sel.join(" ");
  logS.push(cur.id.replace("e2_","")+":"+(good?"✓":"✗"+(cur.trampa&&combo===cur.trampa.key?"🚫":""))+"("+tries+")");
  try{fetch(BQ_TAP,{method:"POST",headers:{"Content-Type":"application/json","api_key":KEY},
    body:JSON.stringify({studentName:NAME,quizType:"flashcard",questionId:cur.id+"|"+tries,choice:combo,correct:good,word:cur.audio,channel:"oido"})}).catch(()=>{})}catch(e){}
  const fb=document.getElementById("fb");
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;
    if(!good&&b.dataset.w===sel[0]||!good&&b.dataset.w===sel[1]){}
  });
  if(good){
    if(tries===1&&!cur.requeued)ok++;
    document.querySelectorAll(".opt").forEach(b=>{b.classList.remove("ok");if(cur.parts.includes(b.dataset.w))b.classList.add("ok")});
    say(cur.audio,0.9);fb.textContent="✅ ¡Sí! "+cur.rev;fb.className="fb ok";
    document.getElementById("veri").textContent="("+cur.veri+")";
    document.getElementById("veri").classList.remove("hidden");
    document.getElementById("next").classList.remove("hidden");
  }else{
    const isTrap=(cur.trampa&&combo===cur.trampa.key);
    document.querySelectorAll(".opt").forEach(b=>{if(sel.includes(b.dataset.w))b.classList.add("no")});
    say(cur.audio,0.7);
    if(tries<2){
      fb.textContent=isTrap?cur.trampa.msg:"✗ Escucha otra vez… el ORDEN importa";
      fb.className="fb no";
      setTimeout(()=>{ // reintento: se re-arma todo
        locked=false;sel=[];paintSlots();paintOpts();
        fb.textContent="";say(cur.audio,0.7);
      },1800);
      return;
    }
    // 2 fallos → revelación honesta + re-encolar al final (repaso)
    if(!repeats.includes(cur.id)){queue.push(Object.assign({},cur,{requeued:true}));repeats.push(cur.id)}
    fb.textContent=(isTrap?cur.trampa.msg+" · ":"")+"✗ Era: "+cur.rev;
    fb.className="fb no";
    document.querySelectorAll(".opt").forEach(b=>{b.classList.remove("no");if(cur.parts.includes(b.dataset.w))b.classList.add("ok")});
    paintSlots();
    document.getElementById("veri").textContent="("+cur.veri+")";
    document.getElementById("veri").classList.remove("hidden");
    document.getElementById("next").classList.remove("hidden");
  }
  document.getElementById("score").textContent="⭐ "+ok+"/"+tot;
}
function nx(){
  idx++;
  if(idx<queue.length){showCard()}
  else finish();
}
function finish(){
  document.getElementById("p1").classList.add("hidden");
  document.getElementById("p2").classList.remove("hidden");
  const base=BASE;
  const acc=base?Math.min(100,Math.round(100*ok/base)):0;
  document.getElementById("endTitle").textContent="⭐ "+ok+" de "+base+" ("+acc+"%)";
  document.getElementById("endMsg").innerHTML=acc>=80?"¡El patrón I am / You are ya es de casa! 🎉<br>Escúchalo en tu cabeza: ya suena.":"¡Bien! Vuelve a armarlo para que el patrón se vuelva de casa 💪";
  const sid="ens-"+Date.now();
  const rec={topic:"Flashcards Ensamblando — Pronombres+To be Fase 2 ("+base+" chunks)",location:"Culiacán",accuracy:acc,passed:acc>=70,
    spokenText:"ensamblando · "+ok+"/"+base+" · señales: "+logS.join(", ")+((repeats.length)?" · repite:"+repeats.join(","):" · sin repetidos"),
    challengeSentence:repeats.join(",")||"—",userId:NAME,sessionId:sid};
  let intento=0;
  const enviar=()=>{intento++;
    fetch(BQ_SES,{method:"POST",headers:{"Content-Type":"application/json","api_key":KEY},body:JSON.stringify(rec)})
    .then(r=>r.json()).then(j=>{document.getElementById("bq").innerHTML=(j&&j.ok)?"<b>Expediente:</b> ✅ enviado. La Maestra ya lo puede leer.":"<b>Expediente:</b> ⚠️ "+((j&&j.error)||"sin confirmación")})
    .catch(()=>{if(intento<4){document.getElementById("bq").innerHTML="<b>Expediente:</b> ⏳ reintentando ("+intento+"/3)...";setTimeout(enviar,2500*intento)}else{document.getElementById("bq").innerHTML="<b>Expediente:</b> ❌ sin conexión. Tu avance quedó en pantalla."}})};
  enviar();
}
</script>
</body>
</html>
