<!DOCTYPE html>
<html lang="es">
<head>

<title>Morfofono — alfabetización A0</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<style>
:root {
  --bg:#f3efe6; --surface:#faf7f0; --surface-2:#ebe4d6; --ink:#1c1915;
  --muted:#6b6458; --faint:#8c8376; --accent:#3d5a73; --accent-fg:#faf7f0;
  --accent-soft:#dfe6ec; --border:#ddd4c4; --good:#3d5c45; --warn:#8a5a32;
  --shadow: 0 0 0 1px rgba(28,25,21,.06), 0 1px 2px -1px rgba(28,25,21,.06), 0 2px 4px 0 rgba(28,25,21,.04);
  --shadow-h: 0 0 0 1px rgba(28,25,21,.1), 0 1px 2px -1px rgba(28,25,21,.08), 0 6px 16px -8px rgba(28,25,21,.12);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Newsreader",Palatino,serif;letter-spacing:-.03em;line-height:1.15;text-wrap:balance;font-weight:500;margin:0}
p{margin:0;text-wrap:pretty}
button,a.btn{font:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.wrap{max-width:72rem;margin:0 auto;min-height:100dvh;display:flex}
aside{width:14rem;flex-shrink:0;border-right:1px solid var(--border);padding:1.5rem 1rem;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column}
.brand{padding:0 .5rem 2rem}
.brand b{font-family:"Newsreader",serif;font-size:1.5rem;font-weight:500;display:block}
.brand span{font-size:.75rem;color:var(--muted)}
nav.side{display:flex;flex-direction:column;gap:.25rem;flex:1}
nav.side button, nav.bottom a, nav.side a{
  display:flex;align-items:center;gap:.7rem;height:2.75rem;padding:0 .75rem;border:0;border-radius:.5rem;
  background:transparent;color:var(--muted);text-decoration:none;font-weight:500;font-size:.9rem;text-align:left
}
nav.side button.on, nav.bottom a.on{background:var(--accent-soft);color:var(--accent)}
nav.side button:hover, nav.bottom a:hover{background:var(--surface-2);color:var(--ink)}
.prog{background:var(--surface);padding:.75rem;border-radius:.7rem;box-shadow:var(--shadow)}
.prog .bar{height:.4rem;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:.5rem 0}
.prog .bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.main{flex:1;min-width:0;padding:1.25rem 1rem 7rem}
@media(min-width:800px){.main{padding:2rem 2rem 2.5rem}}
.top{display:none}
@media(max-width:799px){
  aside{display:none}
  .top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding:.75rem 1rem}
  .top b{font-family:"Newsreader",serif;font-size:1.15rem}
  nav.bottom{position:fixed;inset:auto 0 0 0;display:flex;justify-content:space-around;border-top:1px solid var(--border);background:rgba(250,247,240,.95);backdrop-filter:blur(8px);padding:.35rem .4rem calc(.35rem + env(safe-area-inset-bottom));z-index:20}
  nav.bottom a{flex-direction:column;gap:.15rem;height:auto;font-size:.65rem;padding:.35rem .2rem;align-items:center}
}
@media(min-width:800px){nav.bottom{display:none}}
.page{max-width:42rem;margin:0 auto}
.kicker{font-size:.75rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)} .faint{color:var(--faint);font-size:.75rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
.chip,.speak, .card{
  background:var(--surface);box-shadow:var(--shadow);border-radius:.6rem
}
.chip{padding:.4rem .7rem;font-size:.9rem}
.chip b{color:var(--accent);font-weight:600}
.speak{border:0;padding:.45rem .8rem;font-size:.9rem;color:var(--ink)}
.speak:hover{box-shadow:var(--shadow-h)}
.badge{display:inline-flex;align-items:center;padding:.15rem .5rem;border-radius:.4rem;background:var(--surface-2);font-size:.75rem;color:var(--muted)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.step{width:100%;display:flex;gap:.75rem;text-align:left;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:.7rem;padding:.85rem 1rem;margin:.45rem 0}
.step.on{background:rgba(223,230,236,.7)}
.dot{width:1.5rem;height:1.5rem;border-radius:99px;flex-shrink:0;display:grid;place-items:center;margin-top:.1rem;color:var(--faint);border:1px solid var(--border)}
.step.on .dot{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;height:2.75rem;padding:0 1rem;border-radius:.5rem;border:0;font-weight:500;font-size:.9rem;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.sec{background:var(--surface);box-shadow:var(--shadow)}
.btn.ghost{background:transparent}
.btn.sm{height:2.25rem;padding:0 .75rem;font-size:.85rem}
.grid{display:grid;gap:.6rem}
.lesson-link,.ph,.mh{display:block;padding:.85rem 1rem;background:var(--surface);box-shadow:var(--shadow);border-radius:.7rem;text-decoration:none;color:inherit;border:0;width:100%;text-align:left}
.lesson-link:hover,.ph:hover,.mh:hover{box-shadow:var(--shadow-h)}
.lesson-link.on{outline:2px solid var(--accent)}
textarea{width:100%;min-height:5.5rem;border:0;border-radius:.6rem;background:var(--surface);box-shadow:var(--shadow);padding:.75rem;font:inherit;resize:vertical;color:var(--ink)}
label.lab{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:1rem 0 .35rem}
.drill-score{font-variant-numeric:tabular-nums;color:var(--faint);font-size:.85rem}
.flash-good{outline:2px solid var(--good)}
.flash-bad{outline:2px solid var(--warn)}
.ipa{font-family:"Newsreader",serif;font-size:1.6rem;color:var(--accent)}
.week-h{margin:1.4rem 0 .5rem;font-size:1.15rem}
hr.sep{border:0;border-top:1px solid var(--border);margin:1.5rem 0}
.note{background:var(--surface);padding:1rem 1.15rem;border-radius:.8rem;box-shadow:var(--shadow);margin-top:1rem}
svg.i{width:1rem;height:1rem;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>

<script>
const DATA = {"LESSONS":[{"day":1,"week":1,"phase":"oido","title":"El sonido no es la letra","hook":"Antes de alfabetizar, se despega el oído del ojo.","why":"En A0-bajo el error más caro es empezar por el abecedario. El inglés no es un código transparente: a se lee de cinco maneras. El método empieza por lo que el niño o el adulto ya tiene: la boca y el oído. Hoy no se muestra ninguna letra inglesa.","minutes":40,"phonemeIds":["schwa"],"morphemeIds":[],"steps":[{"id":"s1","name":"Contrato del método","minutes":6,"how":"Explica: primero oímos, luego partimos palabras, al final vemos letras. El aprendiz no pide «cómo se escribe» todavía. Si lo pide, se anota y se aplaza."},{"id":"s2","name":"Mapa sonoro L1","minutes":8,"how":"El aprendiz nombra los sonidos del español que conoce (5 vocales, las consonantes de su variedad). Se deja escrito: esto es lo que YA posee."},{"id":"s3","name":"Tres palabras a ciegas","minutes":10,"how":"Tú dices cat, what, yacht. El aprendiz solo escucha. No se escribe. Se pregunta: ¿cuántos sonidos distintos oíste al final? El punto es la extrañeza, no la respuesta correcta."},{"id":"s4","name":"Regla de oro","minutes":8,"how":"Acordar: cada día hay un sonido o una parte. Poca cantidad, mucha repetición. Cerrar con un gesto: mano en la oreja = modo oído."},{"id":"s5","name":"Nota del método","minutes":8,"how":"Escribe qué resistencia apareció (ansiedad por las letras, traducción, prisa). Eso es dato, no fallo."}],"listen":["cat","what","yacht","one","two"],"methodPrompt":"¿El aprendiz pidió letras? ¿Cómo se pospuso sin frustrar?"},{"day":2,"week":1,"phase":"oido","title":"Voz y sordera","hook":"La garganta es el primer instrumento de alfabetización.","why":"El inglés distingue pares por la voz (pat/bat, fan/van). El español también, pero el aprendiz no lo siente. Hoy se instala la categoría voiced/voiceless SIN símbolos IPA todavía: solo la mano en la garganta.","minutes":40,"phonemeIds":["p","b","f","v"],"morphemeIds":[],"steps":[{"id":"s1","name":"Mano en la garganta","minutes":8,"how":"Aaa (vibra) vs sss (no vibra). Luego bbb vs ppp, vvv vs fff. El aprendiz clasifica: motor encendido / apagado."},{"id":"s2","name":"Pares al oído","minutes":10,"how":"Tú dices pat / bat, fan / van, cap / cab. El aprendiz levanta un dedo si cambió el motor. No se pide repetir aún."},{"id":"s3","name":"Eco con voz","minutes":10,"how":"Ahora sí: eco. Se corrige solo el rasgo de voz, no la vocal ni el acento."},{"id":"s4","name":"Puente al español","minutes":6,"how":"Comparar p/b españoles. Nombrar que en inglés ese contraste es más nítido y, al inicio, la p lleva soplo."},{"id":"s5","name":"Nota del método","minutes":6,"how":"¿Sintió la vibración? Si no, usar un globo contra los labios o una hoja de papel para el soplo."}],"listen":["pat","bat","fan","van","cap","cab"],"methodPrompt":"¿La categoría voz/sordera se sostuvo sin IPA? ¿Hizo falta un apoyo táctil?"},{"day":3,"week":1,"phase":"oido","title":"Cinco contra quince","hook":"El español cabe en una palma; el inglés, en un mapa.","why":"El choque vocálico es la raíz de la ininteligibilidad. Hoy no se enseñan las quince: se instala el hecho. El aprendiz debe salir sabiendo que su i, e, a, o, u no alcanzan.","minutes":40,"phonemeIds":["i","ɪ","æ"],"morphemeIds":[],"steps":[{"id":"s1","name":"Las cinco del español","minutes":6,"how":"Decir i e a o u con claridad. Celebrarlas: son un sistema perfecto… para el español."},{"id":"s2","name":"Tres ovejas","minutes":12,"how":"sheep / ship / shape. Solo escuchar dos veces cada una. Preguntar: ¿cuántas palabras distintas? Si dice dos, repetir. El oído se entrena, no se explica."},{"id":"s3","name":"Boca de gato","minutes":10,"how":"Mostrar /æ/ de cat con mandíbula baja. El aprendiz imita el gesto aunque el sonido salga mal. El gesto precede al fonema limpio."},{"id":"s4","name":"Promesa de la semana 2","minutes":6,"how":"«La semana que viene entramos a cada vocal. Hoy solo aceptamos que hay más de cinco.»"},{"id":"s5","name":"Nota del método","minutes":6,"how":"¿Cuántas repeticiones hizo falta para oír tres palabras y no dos?"}],"listen":["sheep","ship","shape","cat","cut","cot"],"methodPrompt":"¿El aprendiz aceptó que su sistema vocálico no basta, o defendió las cinco?"},{"day":4,"week":1,"phase":"oido","title":"El inglés aplasta","hook":"El español cuenta sílabas; el inglés cuenta golpes de sentido.","why":"La prosodia no es adorno. Un A0 que silabea te-le-pho-ne no sonará inglés aunque acierte cada vocal. Hoy: estrés vs sílaba, palmas, y la idea de reducción. Todavía sin schwa nombrado como IPA.","minutes":40,"phonemeIds":["schwa"],"morphemeIds":[],"steps":[{"id":"s1","name":"Palmas en español","minutes":6,"how":"ca-sa, te-lé-fo-no, com-pu-ta-do-ra. Cada sílaba pesa parecido."},{"id":"s2","name":"Palmas en inglés","minutes":10,"how":"TELephone, comPUter, PHOtograph vs phoTOgraphy. Una sílaba fuerte, las otras se encogen."},{"id":"s3","name":"La palabra que se come","minutes":10,"how":"Frase: I want to go to the store. Marcar want, go, store. El resto se aplasta. El aprendiz solo señala las fuertes."},{"id":"s4","name":"Eco rítmico","minutes":8,"how":"Repetir la frase a medio tempo, exagerando el contraste fuerte/débil. No se corrigen vocales."},{"id":"s5","name":"Nota del método","minutes":6,"how":"¿El ritmo se entendió como música o se volvió a silabear?"}],"listen":["telephone","computer","photograph","photography","I want to go to the store"],"methodPrompt":"¿Funcionó marcar solo las sílabas fuertes, o hizo falta un dibujo de ondas?"},{"day":5,"week":1,"phase":"oido","title":"Schwa, el sonido invisible","hook":"El sonido más común del inglés casi no existe en español.","why":"Sin schwa no hay inglés hablado ni morfología débil (-ful, a, the, -er). Hoy se nombra, se siente y se busca en palabras conocidas de oído. Símbolo: ə. Primera y última vez que un símbolo se introduce por necesidad, no por alfabeto.","minutes":40,"phonemeIds":["schwa"],"morphemeIds":[],"steps":[{"id":"s1","name":"Boca muerta","minutes":6,"how":"Relajar mandíbula, lengua al centro, un gruñido mínimo: ə. Contraste con a, e, o españolas bien formadas."},{"id":"s2","name":"Buscar schwa","minutes":12,"how":"about, sofa, support, the, banana. El aprendiz toca la mesa cada vez que oye la sílaba débil."},{"id":"s3","name":"the débil","minutes":10,"how":"the book, the apple. En the book, the es /ðə/. Se oye, no se escribe."},{"id":"s4","name":"Símbolo ə","minutes":6,"how":"Mostrar ə como dibujo de una e girada. «Este dibujo es un sonido, no una letra del abecedario.»"},{"id":"s5","name":"Nota del método","minutes":6,"how":"¿El símbolo ayudó o distrajo? Anótalo: decide si el IPA entra ya o se aplaza."}],"listen":["about","sofa","support","the book","banana","problem"],"methodPrompt":"¿El schwa se sintió como sonido propio o como «vocal mal pronunciada»?"},{"day":6,"week":1,"phase":"oido","title":"Igual o distinto","hook":"El oído se entrena con juicios, no con repetición ciega.","why":"La discriminación same/different es el ejercicio más poderoso del A0. No exige hablar. Hoy se instala el protocolo que se usará el resto del método: oír A, oír B, decidir.","minutes":40,"phonemeIds":["i","ɪ","æ","ʌ"],"morphemeIds":[],"steps":[{"id":"s1","name":"Protocolo","minutes":5,"how":"Tú dices dos palabras. El aprendiz dice igual o distinto. Luego se revela. Sin ver labios si es posible (mano delante de la boca o audio)."},{"id":"s2","name":"Bloque fácil","minutes":8,"how":"Pares groseros: cat/dog, sun/moon, vs cat/cat. Calibrar el juego."},{"id":"s3","name":"Bloque vocálico","minutes":12,"how":"sheep/ship, cat/cut, fool/full, bed/bad. Diez ítems. Anotar aciertos."},{"id":"s4","name":"Un par difícil","minutes":8,"how":"Repetir solo el par que falló, con gesto de boca, y volver a juzgar."},{"id":"s5","name":"Nota del método","minutes":7,"how":"Guarda el porcentaje. Es la línea base del oído. Se compara en el día 14 y 28."}],"listen":["sheep","ship","cat","cut","fool","full","bed","bad"],"methodPrompt":"¿Cuál fue el par más opaco? Ese par abre la semana 2."},{"day":7,"week":1,"phase":"oido","title":"Diario de sonidos","hook":"Cerrar la semana sin letras, con un oído más fino.","why":"La síntesis no es examen: es inventario. El aprendiz nombra lo que ahora puede oír. El método se ajusta con esos datos.","minutes":40,"phonemeIds":["schwa","i","ɪ","æ"],"morphemeIds":[],"steps":[{"id":"s1","name":"Inventario oral","minutes":10,"how":"Preguntar: ¿qué sonidos nuevos existen en inglés que no tienes en español? Anotar con sus palabras, no con IPA si no ayuda."},{"id":"s2","name":"Reescucha","minutes":10,"how":"Repetir los pares del día 6. Comparar el porcentaje. Celebrar el delta, no el absoluto."},{"id":"s3","name":"Gesto ancla","minutes":8,"how":"Crear un gesto por rasgo: soplo, motor, mandíbula de gato, boca muerta de schwa. Los gestos viajan a la semana 2."},{"id":"s4","name":"Carta a la semana 2","minutes":6,"how":"Juntos, una frase: «La semana que viene entramos a cada vocal con boca y pares»."},{"id":"s5","name":"Nota del método","minutes":6,"how":"¿Se sostuvo la prohibición de letras siete días? Si se rompió, ¿por qué y con qué efecto?"}],"listen":["sheep","ship","cat","about","the"],"methodPrompt":"¿El oído mejoró medible? ¿Qué gesto ancla se queda?"},{"day":8,"week":2,"phase":"vocales","title":"/i/ y /ɪ/: sheep y ship","hook":"La i española es una. El inglés parte esa i en dos.","why":"Este par predice acento hispano más que cualquier consonante. Se enseña tensa/laxa, no larga/corta (la duración es secundaria y engaña).","minutes":40,"phonemeIds":["i","ɪ"],"morphemeIds":[],"steps":[{"id":"s1","name":"Gesto tenso / laxo","minutes":6,"how":"Sonrisa tensa + lengua alta = /i/. Boca relajada, lengua un poco más baja = /ɪ/. El aprendiz hace los dos gestos en silencio."},{"id":"s2","name":"Pares","minutes":12,"how":"sheep/ship, leave/live, reach/rich, beat/bit. Primero igual/distinto, luego eco de la palabra tensa, luego la laxa."},{"id":"s3","name":"Frase mínima","minutes":10,"how":"I see the ship. I want to live. El rasgo se corrige; el resto se deja."},{"id":"s4","name":"Trampas","minutes":6,"how":"Advertir: en español live y leave colapsan. Nombrar la trampa en voz alta."},{"id":"s5","name":"Nota del método","minutes":6,"how":"¿Se entendió tensa/laxa mejor que larga/corta?"}],"listen":["sheep","ship","leave","live","beat","bit","reach","rich"],"methodPrompt":"¿Qué metáfora funcionó: cuerda tensa, sonrisa, o duración?"},{"day":9,"week":2,"phase":"vocales","title":"/æ/: el gato que no existe","hook":"Ni a ni e. Hay que abrir un cuarto nuevo en la boca.","why":"/æ/ no está en el español. Si no se instala ahora, cat, man, bad, apple se oirán como e o a y el vocabulario colapsará.","minutes":40,"phonemeIds":["æ","ɛ","ɑ"],"morphemeIds":[],"steps":[{"id":"s1","name":"Mandíbula","minutes":6,"how":"Bajar la mandíbula más que para a española, comisuras hacia los lados. Espejo o cámara."},{"id":"s2","name":"Ancla cat","minutes":8,"how":"Una sola palabra ancla: cat. Diez ecos lentos. Si sale e, bajar más la mandíbula. Si sale a de padre, adelantar la lengua."},{"id":"s3","name":"Familia","minutes":12,"how":"man, bad, apple, hat, bag. Igual/distinto con bed/bad, men/man, hot/hat."},{"id":"s4","name":"Frase","minutes":8,"how":"The cat is bad. A slow, ugly, clear /æ/ es mejor que una e bonita."},{"id":"s5","name":"Nota del método","minutes":6,"how":"¿El espejo ayudó más que el oído? Anótalo para próximos sonidos nuevos."}],"listen":["cat","man","bad","apple","hat","bag","bed","men"],"methodPrompt":"¿Mandíbula, espejo o par mínimo fue el ancla que destrabó /æ/?"},{"day":10,"week":2,"phase":"vocales","title":"/ɑ/ /ʌ/ /ə/: tres vocales, una niebla","hook":"Cot, cut y about no son la misma a.","why":"Hispanohablantes colapsan este triángulo. Se enseña como mapa espacial: atrás-abierta, centro-corta, centro-débil.","minutes":40,"phonemeIds":["ɑ","ʌ","schwa"],"morphemeIds":[],"steps":[{"id":"s1","name":"Mapa en la mesa","minutes":8,"how":"Tres puntos: atrás /ɑ/ (hot), centro /ʌ/ (cut), débil /ə/ (about). El aprendiz señala mientras oye."},{"id":"s2","name":"Pares","minutes":12,"how":"hot/hut, cot/cut, not/nut, dog/dug. Luego about vs a bout exagerado."},{"id":"s3","name":"Schwa en medio","minutes":8,"how":"support, problem, banana. Tocar la mesa en la sílaba débil."},{"id":"s4","name":"Una frase","minutes":6,"how":"The cup is hot. cup = /ʌ/, hot = /ɑ/, the = /ə/."},{"id":"s5","name":"Nota del método","minutes":6,"how":"¿El mapa espacial (adelante/atrás) sirvió más que las palabras ancla?"}],"listen":["hot","cut","about","cup","not","nut","support"],"methodPrompt":"¿Se sostuvieron tres categorías o colapsaron a dos?"},{"day":11,"week":2,"phase":"vocales","title":"/u/ y /ʊ/: fool y full","hook":"Otra i-tensa partida en dos, ahora atrás y redonda.","why":"El patrón tenso/laxo se reutiliza. El método gana si el aprendiz reconoce el patrón, no si memoriza otro par.","minutes":40,"phonemeIds":["u","ʊ"],"morphemeIds":[],"steps":[{"id":"s1","name":"Patrón conocido","minutes":6,"how":"«Es el mismo contraste de sheep/ship, ahora con labios redondos.» Nombrar la transferencia."},{"id":"s2","name":"Labios","minutes":8,"how":"fool: labios muy redondos y tensos. full: menos redondeo, más corto. Sin voz primero, solo gesto."},{"id":"s3","name":"Pares","minutes":12,"how":"fool/full, pool/pull, food/good (este último también cambia calidad; se usa con cuidado), Luke/look."},{"id":"s4","name":"Frase","minutes":8,"how":"The book is too full. Corregir solo /u/ y /ʊ/."},{"id":"s5","name":"Nota del método","minutes":6,"how":"¿La analogía tenso/laxo se transfirió sola?"}],"listen":["fool","full","pool","pull","food","look","book"],"methodPrompt":"¿Reutilizar el patrón tenso/laxo aceleró o confundió?"},{"day":12,"week":2,"phase":"vocales","title":"/ɛ/ y /eɪ/: bed y day","hook":"La e española quiere ser las dos y no es ninguna.","why":"bed es más abierta y no desliza. day desliza. El error clásico es decir de para day y bei para bed.","minutes":40,"phonemeIds":["ɛ","eɪ"],"morphemeIds":[],"steps":[{"id":"s1","name":"Fija vs desliza","minutes":8,"how":"Mano plana = vocal fija /ɛ/. Mano que viaja = diptongo /eɪ/. El aprendiz gesticula al oír."},{"id":"s2","name":"Pares","minutes":12,"how":"bed/bade, wet/wait, pepper/paper, sell/sale, men/main."},{"id":"s3","name":"Anclas","minutes":8,"how":"bed para /ɛ/, day para /eɪ/. Recitar cinco de cada familia."},{"id":"s4","name":"Frase","minutes":6,"how":"Wait in bed. Dos sonidos, una frase."},{"id":"s5","name":"Nota del método","minutes":6,"how":"¿El gesto de viaje explicó el diptongo mejor que «es ei»?"}],"listen":["bed","day","wait","wet","paper","pepper","sale","sell"],"methodPrompt":"¿Se instó a escribir ei? Resiste. El deslizamiento es de boca, no de letras."},{"day":13,"week":2,"phase":"vocales","title":"Diptongos que viajan","hook":"El movimiento es el sonido: my, now, boy, go.","why":"Los diptongos ingleses se enseñan como trayectos, no como dos letras. El español tiene ai, au, oi, pero go no es o.","minutes":40,"phonemeIds":["aɪ","aʊ","ɔɪ","oʊ"],"morphemeIds":[],"steps":[{"id":"s1","name":"Cuatro viajes","minutes":8,"how":"my, now, boy, go. El aprendiz dibuja en el aire la dirección de cada uno."},{"id":"s2","name":"go no es o","minutes":10,"how":"Contraste go vs una o española sostenida. El cierre hacia u es obligatorio."},{"id":"s3","name":"Familias","minutes":10,"how":"time like I; house now out; boy coin; home boat no."},{"id":"s4","name":"Frase","minutes":6,"how":"My boy goes out now. Exagerar los cuatro viajes."},{"id":"s5","name":"Nota del método","minutes":6,"how":"¿Cuál diptongo se aplanó más? Suele ser /oʊ/."}],"listen":["my","time","now","house","boy","coin","go","home"],"methodPrompt":"¿El dibujo en el aire estabilizó /oʊ/?"},{"day":14,"week":2,"phase":"vocales","title":"Mapa vocálico","hook":"Recitar el mapa con la boca, no con la vista.","why":"Cierre de la semana 2: un recorrido por el espacio vocálico y una nueva medición same/different contra el día 6.","minutes":40,"phonemeIds":["i","ɪ","æ","ɑ","ʌ","schwa","u","ʊ","ɛ","eɪ","oʊ"],"morphemeIds":[],"steps":[{"id":"s1","name":"Recorrido","minutes":12,"how":"De adelante a atrás, de tensa a laxa: i ɪ eɪ ɛ æ ʌ ə ɑ oʊ u ʊ. Cada una con su palabra ancla."},{"id":"s2","name":"Medición","minutes":12,"how":"Mismos pares del día 6 más cat/cut, fool/full. Comparar aciertos."},{"id":"s3","name":"Anclas fijas","minutes":8,"how":"Elegir UNA palabra ancla por vocal y no cambiarla el resto del método."},{"id":"s4","name":"Nota del método","minutes":8,"how":"Actualiza la línea base. Si un par sigue bajo 70%, se reabre en semana 3 como calentamiento, no como tema nuevo."}],"listen":["sheep","ship","cat","cut","cot","fool","full","bed","day","go","about"],"methodPrompt":"Lista de anclas definitivas y pares que siguen opacos."},{"day":15,"week":3,"phase":"consonantes","title":"El soplo: /p t k/","hook":"Sin soplo, la p inglesa suena b para un oído nativo.","why":"La aspiración es el rasgo que el español no entrena. Una hoja de papel delante de la boca convierte lo abstracto en visible.","minutes":40,"phonemeIds":["p","t","k"],"morphemeIds":[],"steps":[{"id":"s1","name":"Hoja de papel","minutes":8,"how":"pen, tea, key. La hoja debe moverse. Luego cap, hat, back (posición final: poco soplo). El contraste enseña la regla: soplo fuerte al inicio de sílaba tónica."},{"id":"s2","name":"Español vs inglés","minutes":8,"how":"papa vs paper, taza vs tea, casa vs key. Nombrar: mismo cierre, distinto aire."},{"id":"s3","name":"Pares sorda/sonora","minutes":12,"how":"pat/bat, ten/den, coat/goat. El soplo Y la voz. Un rasgo a la vez si se satura: hoy prioriza soplo."},{"id":"s4","name":"Frase","minutes":6,"how":"Take a cup of tea. Tres soplos."},{"id":"s5","name":"Nota del método","minutes":6,"how":"¿La hoja fue suficiente o hizo falta una vela / un globo?"}],"listen":["pen","paper","tea","key","pat","bat","coat","goat"],"methodPrompt":"¿El aprendiz sintió el soplo o solo lo vio en la hoja?"},{"day":16,"week":3,"phase":"consonantes","title":"Cierres de verdad: /b d g/","hook":"Entre vocales, el español abre; el inglés golpea.","why":"Cada, nada, lago se pronuncian con aproximantes. bed, did, go necesitan oclusión. Si no, very y berry se vuelven aún más difíciles mañana.","minutes":40,"phonemeIds":["b","d","t"],"morphemeIds":[],"steps":[{"id":"s1","name":"Toque completo","minutes":8,"how":"bbb, ddd, ggg con un golpecito que se puede palpar. Contraste con la β de haba."},{"id":"s2","name":"Entre vocales","minutes":10,"how":"a baby, a dog, a bag. Exigir el cierre. Grabar un eco y reescuchar."},{"id":"s3","name":"Finales","minutes":10,"how":"cab, bad, bag. El español pierde finales: hoy se sostienen. Un palito en el aire por cada consonante final oída."},{"id":"s4","name":"Frase","minutes":6,"how":"A big dog. Tres cierres."},{"id":"s5","name":"Nota del método","minutes":6,"how":"¿El problema fue el cierre o la voz? No los corrijas a la vez."}],"listen":["baby","dog","bag","cab","bad","big"],"methodPrompt":"¿Dónde se suavizó más: entre vocales o al final?"},{"day":17,"week":3,"phase":"consonantes","title":"/v/ no es /b/","hook":"Diente sobre labio. El contraste que el español no tiene.","why":"Es la consonante que más delata al hispanohablante después de las vocales. Se enseña táctil: el diente tiene que tocar.","minutes":40,"phonemeIds":["v","b","f"],"morphemeIds":[],"steps":[{"id":"s1","name":"Tacto","minutes":6,"how":"Dientes superiores sobre el labio inferior. Aire con voz: vvvvv. Luego fffff sin voz."},{"id":"s2","name":"Pares","minutes":12,"how":"bat/vat, berry/very, ban/van, boat/vote. Igual/distinto y luego eco solo de /v/."},{"id":"s3","name":"En medio y final","minutes":10,"how":"seven, love, have, leave. El /v/ final no se convierte en /b/ ni se cae."},{"id":"s4","name":"Frase","minutes":6,"how":"Very big love. Exagerar el diente."},{"id":"s5","name":"Nota del método","minutes":6,"how":"¿Un espejo en el diente funcionó más que el par mínimo?"}],"listen":["very","berry","van","ban","love","have","vote","boat"],"methodPrompt":"¿Cuántos ítems hizo falta para un /v/ estable en inicial?"},{"day":18,"week":3,"phase":"consonantes","title":"/θ/ y /ð/: la lengua se ve","hook":"Think no es tink ni sink. This no es dis.","why":"Sonido más icónico y más evitado. Se enseña con lengua visible, sin vergüenza. /θ/ sorda, /ð/ sonora: el rasgo de voz del día 2 vuelve.","minutes":40,"phonemeIds":["θ","ð","s","t"],"morphemeIds":[],"steps":[{"id":"s1","name":"Lengua fuera","minutes":6,"how":"Un poco, no teatral. Aire: think. Aire + voz: this."},{"id":"s2","name":"Pares sordos","minutes":10,"how":"think/sink, three/tree, bath/bass, thick/tick."},{"id":"s3","name":"Pares sonoros","minutes":10,"how":"this/dis, they/day, mother (el medio). the book, the apple."},{"id":"s4","name":"Frase","minutes":8,"how":"I think this is the thing. Cuatro th. Calidad antes que velocidad."},{"id":"s5","name":"Nota del método","minutes":6,"how":"¿Resistencia estética a sacar la lengua? Nómbrala: es cultural, no articulatoria."}],"listen":["think","sink","three","tree","this","the","mother","thing"],"methodPrompt":"¿Cuál sustitución dominó: /t/, /s/, /d/ o /f/?"},{"day":19,"week":3,"phase":"consonantes","title":"/s z ʃ ʒ/: el aire cambia de forma","hook":"Una s española no cubre cuatro fonemas ingleses.","why":"El plural y la 3ª persona dependen de /s/ vs /z/. ship vs sip depende de /ʃ/. Hoy se instalan las cuatro fricativas; la morfología de la semana 5 ya tiene oído.","minutes":40,"phonemeIds":["s","z","ʃ","ʒ"],"morphemeIds":[],"steps":[{"id":"s1","name":"Cuatro aires","minutes":8,"how":"s fina, z con voz, sh ancha y labios salientes, zh igual con voz (measure)."},{"id":"s2","name":"s vs z","minutes":10,"how":"sip/zip, price/prize, bus/buzz, ice/eyes. Mano en garganta."},{"id":"s3","name":"s vs sh","minutes":10,"how":"sip/ship, see/she, mess/mesh. Labios."},{"id":"s4","name":"measure","minutes":6,"how":"Una ancla para /ʒ/: measure, vision, usual. No se busca productividad, solo el oído."},{"id":"s5","name":"Nota del método","minutes":6,"how":"¿/z/ o /ʃ/ costó más? Eso predice el día 30 (plural)."}],"listen":["sip","zip","ship","she","prize","price","measure","vision"],"methodPrompt":"¿El rasgo de voz en /z/ ya estaba del día 2, o hubo que reinstalarlo?"},{"day":20,"week":3,"phase":"consonantes","title":"/tʃ/ /dʒ/ y /h/","hook":"chair no es share. job no es hob. house no es ouse.","why":"Tres trampas distintas: africada vs fricativa, j española vs /dʒ/, h muda vs soplo suave.","minutes":40,"phonemeIds":["tʃ","dʒ","h","ʃ","j"],"morphemeIds":[],"steps":[{"id":"s1","name":"Golpe + roce","minutes":8,"how":"chair = t + sh fusionados. share = solo sh. El aprendiz siente el golpe en chair."},{"id":"s2","name":"j no es jota","minutes":10,"how":"job, jump, age, judge. Contraste con la /x/ de jamón. Y con yes (/j/), que no tiene golpe."},{"id":"s3","name":"h soplo","minutes":10,"how":"house, hello, hat. Ni silencio ni jota. Empañar un vidrio."},{"id":"s4","name":"Frase","minutes":6,"how":"He has a cheap job. h, tʃ, dʒ."},{"id":"s5","name":"Nota del método","minutes":6,"how":"¿yes vs job se confundieron? Es yeísmo africado: se nombra si aparece."}],"listen":["chair","share","job","yes","house","hello","jump","age"],"methodPrompt":"¿La h se calló, se hizo jota, o salió el soplo suave?"},{"day":21,"week":3,"phase":"consonantes","title":"/ɹ/ /ŋ/ /w/ /j/","hook":"Cuatro sonidos que el español toca de otra manera.","why":"Cierre de consonantes: r sin toque, ng sin g, w redonda, y sin golpe.","minutes":40,"phonemeIds":["ɹ","ŋ","w","j"],"morphemeIds":[],"steps":[{"id":"s1","name":"r sin toque","minutes":8,"how":"Lengua retraída, sin vibrar ni golpear. red, right, very, car (si el acento modelo suena la r final)."},{"id":"s2","name":"sing sin g","minutes":8,"how":"sing, thing, going. Parar en el velo. Contraste con sin y con finger (aquí sí hay g)."},{"id":"s3","name":"w y y","minutes":10,"how":"we, win, queen; yes, you, yellow. Labios vs lengua. Contraste very/wary si el grupo aguanta."},{"id":"s4","name":"Recorrido","minutes":8,"how":"Una palabra ancla por consonante nueva de la semana. Eco lento."},{"id":"s5","name":"Nota del método","minutes":6,"how":"Inventario: qué consonantes ya son estables y cuáles se reabren en calentamientos."}],"listen":["red","right","sing","thing","we","yes","going","you"],"methodPrompt":"¿La r se hizo toque, vibrante, o aproximante?"},{"day":22,"week":4,"phase":"ritmo","title":"No dejes caer el final","hook":"El español ama las sílabas abiertas. El inglés cierra.","why":"cat, stop, felt, world: el significado vive en esa consonante final. A0 que la come se vuelve ininteligible.","minutes":40,"phonemeIds":["p","t","k","n","m","l"],"morphemeIds":[],"steps":[{"id":"s1","name":"Contar cierres","minutes":8,"how":"Tú dices cat, stop, felt. El aprendiz levanta tantos dedos como sonidos oye. Se revela el recuento."},{"id":"s2","name":"Eco final","minutes":12,"how":"Lista CVC: cat cap cab can cam. Solo se acepta si el final se oye. Grabar."},{"id":"s3","name":"Grupos finales","minutes":10,"how":"stop, felt, world, asked (preview). No se exige perfección de asked; sí de stop y felt."},{"id":"s4","name":"Frase","minutes":4,"how":"Stop the cat. Dos finales."},{"id":"s5","name":"Nota del método","minutes":6,"how":"¿El recuento de sonidos (conciencia fonémica) fue más potente que el eco?"}],"listen":["cat","cap","cab","stop","felt","can","cam"],"methodPrompt":"¿Qué coda se cayó más: oclusiva, nasal o l?"},{"day":23,"week":4,"phase":"ritmo","title":"School no es escola","hook":"El español añade e- delante de s+consonante. Hoy se corta.","why":"Prosthesis: e-school, e-spain, e-stop. Es un hábito silábico, no un error de letra. Se reentrena el ataque.","minutes":40,"phonemeIds":["s"],"morphemeIds":[],"steps":[{"id":"s1","name":"Diagnóstico","minutes":6,"how":"El aprendiz dice school, Spain, stop, street. Anotar si aparece e-."},{"id":"s2","name":"Ataque s-","minutes":12,"how":"Sostener sss y luego soltar cool: sss-kool → school. Igual con stop, Spain, speak, small."},{"id":"s3","name":"Pares trampa","minutes":10,"how":"school vs a school (el artículo no es la e prostética). El aprendiz distingue the school / a school / school."},{"id":"s4","name":"Frase","minutes":6,"how":"Stop at school. Cero e- prostética."},{"id":"s5","name":"Nota del método","minutes":6,"how":"¿El sostener sss funcionó, o hizo falta tapar la boca al inicio de la e?"}],"listen":["school","Spain","stop","speak","small","street"],"methodPrompt":"¿La e prostética bajó en eco lento? ¿Y en frase rápida?"},{"day":24,"week":4,"phase":"ritmo","title":"Grupos: str, spl, thr","hook":"Tres consonantes seguidas sin vocal de apoyo.","why":"Después de school, se sube la carga: street, split, three. Se construye por acrecentamiento, no por la palabra entera.","minutes":40,"phonemeIds":["s","θ","ɹ","l"],"morphemeIds":[],"steps":[{"id":"s1","name":"Acrecentar","minutes":10,"how":"t → tr → str → street. p → pl → spl → split. t → th → thr → three."},{"id":"s2","name":"Lista corta","minutes":12,"how":"street, strong, spring, split, splash, three, throw. Calidad > cantidad."},{"id":"s3","name":"Finales duros","minutes":8,"how":"asks, wants (preview de morfología). Se oye la s final aunque la palabra sea difícil."},{"id":"s4","name":"Nota del método","minutes":10,"how":"El acrecentamiento es un procedimiento del método: anótalo como receta reutilizable."}],"listen":["street","strong","split","splash","three","throw","spring"],"methodPrompt":"¿El acrecentamiento evitó la vocal de apoyo mejor que el modelo completo?"},{"day":25,"week":4,"phase":"ritmo","title":"Palabras que se encogen","hook":"to, for, and, of, the: schwa en el habla real.","why":"La morfología gramatical se oye débil. Si el A0 las pronuncia plenas, el ritmo se rompe. Hoy: forma fuerte vs forma débil, de oído.","minutes":40,"phonemeIds":["schwa","ð"],"morphemeIds":[],"steps":[{"id":"s1","name":"Fuert -mos). Se transfiere esa inteligencia al inglés, que parece «sin gramática» y no lo es. Hoy: pieza libre vs pieza atada. Todavía se OYE más de lo que se ve.","minutes":40,"phonemeIds":[],"morphemeIds":["plural-s","un"],"steps":[{"id":"s1","name":"Puente L1","minutes":8,"how":"cantar / cant- / -aba / -mos. El aprendiz ya sabe partir. «Vamos a hacer lo mismo en inglés.»"},{"id":"s2","name":"Libre y atada","minutes":10,"how":"cat es libre. -s de cats está atada: no se dice sola con significado de plural (en este nivel). un- de unhappy está atada."},{"id":"s3","name":"Partir de oído","minutes":12,"how":"cats, dogs, unhappy, replay, teacher. El aprendiz dice cuántas piezas y qué significa cada una. Tú confirmas."},{"id":"s4","name":"Promesa","minutes":4,"how":"Esta semana: -s, -ed, -ing. Tres letras. Siete sonidos. El oído ya los tiene."},{"id":"s5","name":"Nota del método","minutes":6,"how":"¿La analogía con la conjugación española iluminó o empujó a traducir desinencias?"}],"listen":["cats","dogs","unhappy","replay","teacher"],"methodPrompt":"¿Partir de oído funcionó antes de ver la palabra escrita?"},{"day":30,"week":5,"phase":"flexion","title":"Plural -s: una letra, tres sonidos","hook":"/s/ cats, /z/ dogs, /ɪz/ boxes.","why":"Aquí el método se justifica: sin fonología, el aprendiz lee -s y dice /s/ siempre. Con fonología, el plural se oye. Se enseña la regla por el oído, luego se nombra.","minutes":40,"phonemeIds":["s","z"],"morphemeIds":["plural-s"],"steps":[{"id":"s1","name":"Oír tres finales","minutes":8,"how":"cats, dogs, boxes. ¿Cuántos sonidos distintos al final? Descubrir tres."},{"id":"s2","name":"Regla","minutes":10,"how":"Tras sorda: /s/ (cat-s). Tras sonora: /z/ (dog-s). Tras sibilante: /ɪz/ (box-es). La voz del día 2 decide."},{"id":"s3","name":"Clasificar","minutes":12,"how":"maps, pens, hats, days, buses, watches, apples, books. El aprendiz asigna el sonido, luego oye el modelo."},{"id":"s4","name":"Frase","minutes":4,"how":"The cats and the dogs. /s/ e trabó, qué cambiar mañana. El método se desarrolla con evidencia, no con fe."}],"TOTAL_DAYS":42,"PHONEMES":[{"id":"schwa","ipa":"ə","kind":"vowel","name":"Schwa","examples":["about","sofa","the","support"],"spanish":"No existe. El español mantiene vocales claras en todas las sílabas.","trap":"Pronunciar a-baut en vez de ə-bout.","tip":"Boca relajada, lengua muerta, sonido mínimo. Es el sonido más frecuente del inglés.","voiced":true,"week":1},{"id":"i","ipa":"i","kind":"vowel","name":"i larga","examples":["sheep","see","eat","me"],"spanish":"Cercana a la i española, pero más tensa y a menudo un poco más larga.","trap":"Igualarla con /ɪ/ (ship).","tip":"Sonrisa tensa, lengua alta y adelantada. Sostén un instante.","voiced":true,"week":2},{"id":"ɪ","ipa":"ɪ","kind":"vowel","name":"i breve","examples":["ship","sit","live","big"],"spanish":"No existe. La i española es siempre tensa.","trap":"Decir sheep cuando se quiere ship.","tip":"Boca más relajada, lengua un poco más baja. Es corta y laxa.","voiced":true,"week":2},{"id":"æ","ipa":"æ","kind":"vowel","name":"a de cat","examples":["cat","man","bad","apple"],"spanish":"No existe. Ni a ni e cubren este espacio.","trap":"Sustituir por /ɑ/ (hot) o por /e/ española.","tip":"Baja la mandíbula, estira las comisuras. La lengua queda baja y adelante.","voiced":true,"week":2},{"id":"ɑ","ipa":"ɑ","kind":"vowel","name":"a abierta","examples":["hot","father","stop","not"],"spanish":"Más posterior y abierta que la a española típica.","trap":"Confundirla con /ʌ/ (cut) o /æ/ (cat).","tip":"Boca redonda y abierta, lengua atrás y baja.","voiced":true,"week":2},{"id":"ʌ","ipa":"ʌ","kind":"vowel","name":"u de cut","examples":["cut","sun","love","bus"],"spanish":"No existe. A menudo se oye como a o o.","trap":"Decir cot o cat en vez de cut.","tip":"Mandíbula a media altura, lengua central, sonido corto y opaco.","voiced":true,"week":2},{"id":"u","ipa":"u","kind":"vowel","name":"u larga","examples":["food","blue","two","school"],"spanish":"Cercana a u, pero más tensa y redondeada.","trap":"Igualarla con /ʊ/ (full).","tip":"Labios muy redondos, lengua alta y atrás. Sostén.","voiced":true,"week":2},{"id":"ʊ","ipa":"ʊ","kind":"vowel","name":"u breve","examples":["full","book","put","good"],"spanish":"No existe como fonema. La u española es tensa.","trap":"Decir fool cuando se quiere full.","tip":"Labios menos redondos, sonido corto y laxo.","voiced":true,"week":2},{"id":"ɛ","ipa":"ɛ","kind":"vowel","name":"e de bed","examples":["bed","red","head","said"],"spanish":"Más abierta que la e española.","trap":"Cerrarla hacia /eɪ/ (bay) o abrirla hacia /æ/ (bad).","tip":"Mandíbula un poco más baja que la e española. Sin deslizamiento.","voiced":true,"week":2},{"id":"eɪ","ipa":"eɪ","kind":"diphthong","name":"ei de day","examples":["day","name","make","eight"],"spanish":"Parecida a ei de rey, pero el deslizamiento es más marcado.","trap":"Dejarla como e pura española (de).","tip":"Empieza en e y desliza hacia /ɪ/. Dos tiempos en un golpe.","voiced":true,"week":2},{"id":"aɪ","ipa":"aɪ","kind":"diphthong","name":"ai de my","examples":["my","time","like","I"],"spanish":"Cercana a ai de baile.","trap":"Aplanar el deslizamiento.","tip":"Abre en a y sube a i. El movimiento es el sonido.","voiced":true,"week":2},{"id":"aʊ","ipa":"aʊ","kind":"diphthong","name":"au de now","examples":["now","house","out","down"],"spanish":"Cercana a au de causa.","trap":"Dejarla en a.","tip":"Abre y redondea hacia u.","voiced":true,"week":2},{"id":"oʊ","ipa":"oʊ","kind":"diphthong","name":"ou de go","examples":["go","home","no","boat"],"spanish":"No es la o española pura: desliza hacia u.","trap":"Decir o corta y fija, como no en español.","tip":"Empieza en o y cierra hacia /ʊ/.","voiced":true,"week":2},{"id":"ɔɪ","ipa":"ɔɪ","kind":"diphthong","name":"oi de boy","examples":["boy","coin","voice","oil"],"spanish":"Cercana a oy de hoy.","trap":"Separar en dos sílabas: bo-i.","tip":"Un solo golpe: o abierta que sube a i.","voiced":true,"week":2},{"id":"p","ipa":"p","kind":"consonant","name":"p aspirada","examples":["pen","paper","stop","happy"],"spanish":"La p española no lleva soplo. En inglés inicial, sí.","trap":"Sonar a b para un oído inglés (sin aspiración).","tip":"Suelta un soplo de aire al abrir los labios. Una hoja frente a la boca debe moverse.","voiced":false,"week":3},{"id":"t","ipa":"t","kind":"consonant","name":"t aspirada","examples":["tea","time","water","cat"],"spanish":"La t española es dental; la inglesa es alveolar y aspirada al inicio.","trap":"Poner la lengua en los dientes, como en español.","tip":"Lengua en el reborde detrás de los dientes superiores. Soplo al inicio de palabra.","voiced":false,"week":3},{"id":"k","ipa":"k","kind":"consonant","name":"k aspirada","examples":["cat","school","back","key"],"spanish":"Sin soplo en español.","trap":"Sonar a g para un oído inglés.","tip":"Soplo al inicio. La parte de atrás de la lengua contra el paladar blando.","voiced":false,"week":3},{"id":"b","ipa":"b","kind":"consonant","name":"b oclusiva","examples":["bed","big","rob","baby"],"spanish":"En español a menudo es aproximante [β] entre vocales.","trap":"Suavizarla entre vocales: aβout.","tip":"Cierra los labios de verdad. Hay un golpe, no un roce.","voiced":true,"week":3},{"id":"v","ipa":"v","kind":"consonant","name":"v labiodental","examples":["very","voice","love","have"],"spanish":"No hay contraste b/v. Muchos hispanohablantes dicen bery.","trap":"Usar los dos labios (b) en vez de diente sobre labio.","tip":"Dientes superiores sobre el labio inferior. El aire roza. La garganta vibra.","voiced":true,"week":3},{"id":"θ","ipa":"θ","kind":"consonant","name":"th sorda","examples":["think","three","bath","mouth"],"spanish":"Existe en España (caza); no en la mayoría de América.","trap":"Sustituir por /t/ o /s/: tink, sink.","tip":"Lengua visible entre los dientes. Aire sin voz.","voiced":false,"week":3},{"id":"ð","ipa":"ð","kind":"consonant","name":"th sonora","examples":["this","the","mother","breathe"],"spanish":"La d española entre vocales se parece, pero no es igual.","trap":"Decir dis, de, muzzer.","tip":"Misma boca que /θ/, pero con voz. Pon la mano en la garganta.","voiced":true,"week":3},{"id":"s","ipa":"s","kind":"consonant","name":"s sorda","examples":["see","bus","cats","miss"],"spanish":"Cercana, aunque a veces más dental.","trap":"Sonorizarla siempre entre vocales, o añadir e- delante de s+cons.","tip":"Lengua alveolar, aire fino. Sin voz.","voiced":false,"week":3},{"id":"z","ipa":"z","kind":"consonant","name":"z sonora","examples":["zoo","dogs","is","easy"],"spanish":"No es fonema. La s española no se sonoriza de forma contrastiva.","trap":"Decir soo, docs, iss.","tip":"Misma boca que /s/, con voz. Es el plural de dog, no de dock.","voiced":true,"week":3},{"id":"ʃ","ipa":"ʃ","kind":"consonant","name":"sh","examples":["she","ship","fish","nation"],"spanish":"No existe (salvo préstamos). Se sustituye por ch o s.","trap":"Decir chi o si.","tip":"Labios ligeramente salientes, lengua más retrasada que /s/. Aire ancho.","voiced":false,"week":3},{"id":"ʒ","ipa":"ʒ","kind":"consonant","name":"zh","examples":["measure","vision","beige","usual"],"spanish":"No existe.","trap":"Decir /ʃ/ o /dʒ/.","tip":"Igual que /ʃ/ con voz. Es el sonido de measure.","voiced":true,"week":3},{"id":"tʃ","ipa":"tʃ","kind":"consonant","name":"ch","examples":["chair","church","watch","cheap"],"spanish":"Cercana a ch, un poco más palatal en inglés.","trap":"Suavizarla a /ʃ/ (share).","tip":"Un golpe + roce: t + sh fusionados.","voiced":false,"week":3},{"id":"dʒ","ipa":"dʒ","kind":"consonant","name":"j de judge","examples":["judge","job","age","jump"],"spanish":"No es la j española /x/. Tampoco la y de yo en todos los dialectos.","trap":"Decir yob o hob.","tip":"Versión sonora de ch. Un golpe + roce con voz.","voiced":true,"week":3},{"id":"h","ipa":"h","kind":"consonant","name":"h aspirada","examples":["house","hello","hat","behind"],"spanish":"La h española es muda. La j es demasiado rasposa (/x/).","trap":"Callarla (ouse) o hacerla j española (jouse).","tip":"Un soplo suave de aire, sin roce fuerte. Como empañar un vidrio.","voiced":false,"week":3},{"id":"ŋ","ipa":"ŋ","kind":"consonant","name":"ng","examples":["sing","thing","bank","going"],"spanish":"Aparece alofónicamente antes de /k g/ (banco), no al final.","trap":"Añadir /g/ al final: sing-guh. O decir sin.","tip":"Parte de atrás de la lengua contra el velo. La boca no se abre a una g.","voiced":true,"week":3},{"id":"ɹ","ipa":"ɹ","kind":"consonant","name":"r inglesa","examples":["red","right","car","very"],"spanish":"No es la r simple ni la rr. Es aproximante, sin toque.","trap":"Tocar el alvéolo (pero) o vibrar (perro).","tip":"Lengua retraída, sin tocar el paladar. Los labios se redondean un poco.","voiced":true,"week":3},{"id":"w","ipa":"w","kind":"consonant","name":"w","examples":["we","win","away","queen"],"spanish":"Cercana a u semivocal, pero con más redondeo.","trap":"Decir güi o vi.","tip":"Labios muy redondos, luego se abren hacia la vocal.","voiced":true,"week":3},{"id":"j","ipa":"j","kind":"consonant","name":"y de yes","examples":["yes","you","young","yellow"],"spanish":"Cercana a i semivocal. Cuidado con el yeísmo africado.","trap":"Decir dʒes (jes como judge).","tip":"Lengua alta y adelante, sin golpe. Un deslizamiento, no una africada.","voiced":true,"week":3},{"id":"f","ipa":"f","kind":"consonant","name":"f","examples":["fish","coffee","leaf","fun"],"spanish":"Casi igual.","trap":"Poca. Contrástala con /v/.","tip":"Dientes sobre labio, sin voz. La pareja sorda de /v/.","voiced":false,"week":3},{"id":"l","ipa":"l","kind":"consonant","name":"l clara y oscura","examples":["light","feel","call","leaf"],"spanish":"La l inglesa final (feel) es velarizada, más oscura.","trap":"Vocalizar la l final como u: feeu.","tip":"Punta de la lengua en el reborde. Al final de sílaba, la parte de atrás también se eleva.","voiced":true,"week":4},{"id":"n","ipa":"n","kind":"consonant","name":"n","examples":["no","sun","night","and"],"spanish":"Cercana. En inglés no se pierde al final.","trap":"Tragar la n final.","tip":"Cierre alveolar completo. La vocal no se nasaliza en su lugar.","voiced":true,"week":4},{"id":"m","ipa":"m","kind":"consonant","name":"m","examples":["me","time","home","mom"],"spanish":"Cercana. No se debilita al final.","trap":"Abrir a vocal nasal sin cierre labial.","tip":"Labios cerrados de verdad, voz por la nariz.","voiced":true,"week":4}],"MINIMAL_PAIRS":[{"a":"sheep","b":"ship","contrast":["i","ɪ"],"hint":"tensa / laxa"},{"a":"leave","b":"live","contrast":["i","ɪ"],"hint":"tensa / laxa"},{"a":"cat","b":"cut","contrast":["æ","ʌ"],"hint":"abierta adelante / central"},{"a":"cat","b":"cot","contrast":["æ","ɑ"],"hint":"adelante / atrás"},{"a":"cut","b":"cot","contrast":["ʌ","ɑ"],"hint":"central / atrás"},{"a":"fool","b":"full","contrast":["u","ʊ"],"hint":"tensa / laxa"},{"a":"pool","b":"pull","contrast":["u","ʊ"],"hint":"tensa / laxa"},{"a":"bed","b":"bad","contrast":["ɛ","æ"],"hint":"e / a de cat"},{"a":"men","b":"man","contrast":["ɛ","æ"],"hint":"e / a de cat"},{"a":"coat","b":"caught","contrast":["oʊ","ɑ"],"hint":"diptongo / vocal fija"},{"a":"bat","b":"vat","contrast":["b","v"],"hint":"labios / diente-labio"},{"a":"berry","b":"very","contrast":["b","v"],"hint":"labios / diente-labio"},{"a":"fan","b":"van","contrast":["f","v"],"hint":"sorda / sonora"},{"a":"think","b":"sink","contrast":["θ","s"],"hint":"lengua entre dientes / s"},{"a":"three","b":"tree","contrast":["θ","t"],"hint":"lengua entre dientes / t"},{"a":"this","b":"dis","contrast":["ð","d"],"hint":"th sonora / d"},{"a":"see","b":"zee","contrast":["s","z"],"hint":"sorda / sonora"},{"a":"price","b":"prize","contrast":["s","z"],"hint":"sorda / sonora"},{"a":"shoe","b":"chew","contrast":["ʃ","tʃ"],"hint":"roce / golpe+roce"},{"a":"share","b":"chair","contrast":["ʃ","tʃ"],"hint":"roce / golpe+roce"},{"a":"year","b":"jeer","contrast":["j","dʒ"],"hint":"desliz / africada"},{"a":"hat","b":"at","contrast":["h","ə"],"hint":"soplo / silencio"},{"a":"light","b":"right","contrast":["l","ɹ"],"hint":"contacto / sin contacto"},{"a":"cap","b":"cab","contrast":["p","b"],"hint":"sorda / sonora"},{"a":"back","b":"bag","contrast":["k","g"],"hint":"sorda / sonora"}],"MORPHEMES":[{"id":"plural-s","form":"-s / -es","kind":"inflection","meaning":"más de uno","sounds":["/s/","/z/","/ɪz/"],"examples":[{"word":"cats","parts":["cat","s"]},{"word":"dogs","parts":["dog","s"]},{"word":"boxes","parts":["box","es"]}],"note":"La letra es una. Los sonidos son tres, según el final de la raíz: sorda → /s/, sonora → /z/, sibilante → /ɪz/. La morfología no se enseña sin la fonología.","week":5},{"id":"3sg-s","form":"-s (3ª persona)","kind":"inflection","meaning":"él / ella / it en presente","sounds":["/s/","/z/","/ɪz/"],"examples":[{"word":"walks","parts":["walk","s"]},{"word":"runs","parts":["run","s"]},{"word":"watches","parts":["watch","es"]}],"note":"Misma regla fonológica que el plural. El aprendiz ya posee el oído; ahora el significado se engancha al sonido.","week":5},{"id":"past-ed","form":"-ed","kind":"inflection","meaning":"pasado / participio regular","sounds":["/t/","/d/","/ɪd/"],"examples":[{"word":"jumped","parts":["jump","ed"]},{"word":"played","parts":["play","ed"]},{"word":"wanted","parts":["want","ed"]}],"note":"Otra letra, tres sonidos. Tras sorda /t/, tras sonora /d/, tras t/d /ɪd/. No se lee e-d letra a letra.","week":5},{"id":"ing","form":"-ing","kind":"inflection","meaning":"acción en curso / gerundio","sounds":["/ɪŋ/"],"examples":[{"word":"playing","parts":["play","ing"]},{"word":"going","parts":["go","ing"]},{"word":"running","parts":["run","n","ing"]}],"note":"El final es /ŋ/, no /n/ + /g/. Conecta con el fonema ng de la semana 3.","week":5},{"id":"er-comp","form":"-er","kind":"inflection","meaning":"más (comparativo)","sounds":["/ɚ/","/ə/"],"examples":[{"word":"bigger","parts":["big","g","er"]},{"word":"faster","parts":["fast","er"]},{"word":"happier","parts":["happi","er"]}],"note":"Mismo grafema -er que el agente (teacher). El significado se decide por la base: adjetivo → comparativo.","week":5},{"id":"est","form":"-est","kind":"inflection","meaning":"el más (superlativo)","sounds":["/ɪst/","/əst/"],"examples":[{"word":"biggest","parts":["big","g","est"]},{"word":"fastest","parts":["fast","est"]}],"note":"Pareja del comparativo. Se enseña como par de morfemas, no como palabras sueltas.","week":5},{"id":"poss","form":"'s","kind":"inflection","meaning":"posesión","sounds":["/s/","/z/","/ɪz/"],"examples":[{"word":"cat's","parts":["cat","'s"]},{"word":"dog's","parts":["dog","'s"]},{"word":"boss's","parts":["boss","'s"]}],"note":"Otra vez las tres sibilantes. El apóstrofo es marca morfológica, no un sonido.","week":5},{"id":"un","form":"un-","kind":"prefix","meaning":"no / lo contrario","sounds":["/ʌn/"],"examples":[{"word":"unhappy","parts":["un","happy"]},{"word":"unlock","parts":["un","lock"]},{"word":"unfair","parts":["un","fair"]}],"note":"El español ya tiene in-/des-. Se transfiere la idea: el significado vive en la parte.","week":6},{"id":"re","form":"re-","kind":"prefix","meaning":"otra vez / atrás","sounds":["/ri/","/rɪ/"],"examples":[{"word":"replay","parts":["re","play"]},{"word":"rewrite","parts":["re","write"]},{"word":"reread","parts":["re","read"]}],"note":"Productivo y transparente. Ideal para A0: dos piezas, un significado nuevo.","week":6},{"id":"dis","form":"dis-","kind":"prefix","meaning":"negación / inversión","sounds":["/dɪs/"],"examples":[{"word":"dislike","parts":["dis","like"]},{"word":"disconnect","parts":["dis","connect"]}],"note":"Primo de des- español. Se nombra el parentesco para acelerar.","week":6},{"id":"er-agent","form":"-er (agente)","kind":"suffix","meaning":"quien hace","sounds":["/ɚ/","/ə/"],"examples":[{"word":"teacher","parts":["teach","er"]},{"word":"player","parts":["play","er"]},{"word":"reader","parts":["read","er"]}],"note":"Distinto del comparativo a const KEY = "morfofono-html-v1";
const NAV = [
  ["hoy","Hoy"],
  ["ruta","Ruta"],
  ["atlas","Atlas"],
  ["practica","Práctica"],
  ["diario","Diario"],
];
function load(){
  try { return JSON.parse(localStorage.getItem(KEY)||"{}"); } catch { return {}; }
}
function save(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
const state = Object.assign({
  view:"hoy", day:1, checked:{}, completed:[], notes:{},
  atlas:"sonidos", drill:"pares"
}, load());

function speak(text){
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.78;
    const vs = speechSynthesis.getVoices();
    const v = vs.find(x => /en[-_]US/i.test(x.lang) && /natural|google|samantha|aria/i.test(x.name))
      || vs.find(x => /en[-_]US/i.test(x.lang)) || vs.find(x => /^en/i.test(x.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch {}
}
function lesson(){ return DATA.LESSONS[Math.min(Math.max(state.day,1), DATA.TOTAL_DAYS)-1]; }
function phase(id){ return DATA.PHASES.find(p=>p.id===id); }
function ph(id){ return DATA.PHONEMES.find(p=>p.id===id); }
function mo(id){ return DATA.MORPHEMES.find(m=>m.id===id); }
function note(day){
  return state.notes[day] || {worked:"", stuck:"", change:""};
}
function esc(s){
  return String(s??"").replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":"&#39;"}[c]));
}
function shuffle(a){
  const n=[...a];
  for(let i=n.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [n[i],n[j]]=[n[j],n[i]]; }
  return n;
}

function persist(){
  save({day:state.day, checked:state.checked, completed:state.completed, notes:state.notes});
}

function setView(v){ state.view=v; render(); }
function setDay(d){ state.day=d; state.view="hoy"; persist(); render(); }

function navHtml(id){
  return NAV.map(([k,l]) => `<button type="button" class="${state.view===k?'on':''}" data-go="${k}">${l}</button>`).join("");
}

function progress(){
  const n = state.completed.length;
  const pct = Math.round(n / DATA.TOTAL_DAYS * 100);
  document.getElementById("prog-label").textContent = "Día "+state.day+" de "+DATA.TOTAL_DAYS;
  document.getElementById("prog-bar").style.width = pct+"%";
  document.getElementById("prog-num").textContent = n+" cerrados · "+pct+"%";
  const ts = document.getElementById("top-sub");
  if (ts) ts.textContent = "Día "+state.day+" · "+pct+"%";
}

function viewHoy(){
  const L = lesson();
  const P = phase(L.phase);
  const checked = state.checked[L.day] || [];
  const done = state.completed.includes(L.day);
  const all = L.steps.every(s => checked.includes(s.id));
  const phon = L.phonemeIds.map(ph).filter(Boolean);
  const morph = L.morphemeIds.map(mo).filter(Boolean);
  return `
    <header>
      <div class="row">
        <span class="badge acc">Semana ${L.week}</span>
        <span class="badge">${esc(P.name)}</span>
        <span class="faint">${L.minutes} min</span>
      </div>
      <p class="kicker" style="margin-top:1rem">Día ${L.day} de ${DATA.TOTAL_DAYS}</p>
      <h1 style="font-size:clamp(1.8rem,4vw,2.8rem);margin-top:.4rem">${esc(L.title)}</h1>
      <p class="muted" style="margin-top:.7rem;font-size:1.05rem">${esc(L.hook)}</p>
    </header>
    <section class="note">
      <p class="kicker" style="color:var(--faint)">Por qué hoy, en este orden</p>
      <p style="margin-top:.4rem">${esc(L.why)}</p>
    </section>
    ${(phon.length||morph.length)?`
    <section style="margin-top:1.4rem">
      <p class="kicker" style="color:var(--faint)">Foco</p>
      <div class="chips">
        ${phon.map(p=>`<span class="chip"><b>/${esc(p.ipa)}/</b> ${esc(p.name)}</span>`).join("")}
        ${morph.map(m=>`<span class="chip"><b>${esc(m.form)}</b> <span class="muted">${esc(m.meaning)}</span></span>`).join("")}
      </div>
    </section>`:""}
    ${L.listen.length?`
    <section style="margin-top:1.4rem">
      <p class="kicker" style="color:var(--faint)">Banco de oído</p>
      <div class="chips">
        ${L.listen.map(w=>`<button type="button" class="speak" data-say="${esc(w)}">${esc(w)}</button>`).join("")}
      </div>
    </section>`:""}
    <section style="margin-top:2rem">
      <div class="row" style="justify-content:space-between">
        <h2>Ritual del día</h2>
        <p class="faint">${checked.length}/${L.steps.length}</p>
      </div>
      ${L.steps.map(s=>{
        const on = checked.includes(s.id);
        return `<button type="button" class="step ${on?'on':''}" data-toggle="${s.id}">
          <span class="dot">${on?"✓":""}</span>
          <span><b>${esc(s.name)}</b> <span class="faint">· ${s.minutes} min</span>
          <span style="display:block;margin-top:.25rem;color:var(--muted);font-size:.92rem">${esc(s.how)}</span></span>
        </button>`;
      }).join("")}
      <div class="row" style="margin-top:1rem">
        <button class="btn pri" data-complete ${all&&!done?"":"disabled"}>${done?"Día cerrado":"Cerrar el día"}</button>
        <button class="btn sec" data-prev ${L.day===1?"disabled":""}>Anterior</button>
        <button class="btn sec" data-next ${L.day===DATA.TOTAL_DAYS?"disabled":""}>Siguiente</button>
      </div>
    </section>
    <section style="margin-top:1.6rem">
      <p class="kicker" style="color:var(--faint)">Pregunta al método</p>
      <p class="muted" style="margin:.4rem 0 1rem">${esc(L.methodPrompt)}</p>
      ${notesFields(L.day)}
    </section>
  `;
}

function notesFields(day){
  const n = note(day);
  return `
    <label class="lab">Qué funcionó</label>
    <textarea data-note="worked" placeholder="Un gesto, un par, una analogía…">${esc(n.worked)}</textarea>
    <label class="lab">Dónde se trabó</label>
    <textarea data-note="stuck" placeholder="El error que se repitió">${esc(n.stuck)}</textarea>
    <label class="lab">Qué cambiar mañana</label>
    <textarea data-note="change" placeholder="Mismo sonido, otras palabras, cero morfema nuevo…">${esc(n.change)}</textarea>
  `;
}

function viewRuta(){
  let lastW = 0;
  const items = DATA.LESSONS.map(L => {
    const P = phase(L.phase);
    const head = L.week !== lastW ? (lastW=L.week, `<h2 class="week-h">Semana ${L.week} · ${esc(P.name)}</h2><p class="muted" style="margin-bottom:.6rem">${esc(P.promise)}</p>`) : "";
    const done = state.completed.includes(L.day);
    return head + `<button type="button" class="lesson-link ${L.day===state.day?'on':''}" data-openday="${L.day}">
      <span class="faint">Día ${L.day}${done?" · cerrado":""}</span>
      <span style="display:block;font-weight:600;margin-top:.15rem">${esc(L.title)}</span>
      <span class="muted" style="font-size:.9rem">${esc(L.hook)}</span>
    </button>`;
  }).join("");
  return `<p class="kicker">42 días</p><h1 style="margin:.4rem 0 1rem;font-size:2.2rem">Ruta</h1>
    <p class="muted" style="margin-bottom:1.2rem">Semanas 1–4 solo oído. 5–6, morfemas sobre bases ya oídas. Las letras llegan el día 40.</p>
    <div class="grid">${items}</div>`;
}

function viewAtlas(){
  const tab = state.atlas;
  const tabs = `<div class="row">
    <button class="btn sm ${tab==='sonidos'?'pri':'sec'}" data-atlas="sonidos">Sonidos</button>
    <button class="btn sm ${tab==='morfemas'?'pri':'sec'}" data-atlas="morfemas">Morfemas</button>
  </div>`;
  if (tab==="morfemas") {
    return tabs + `<h1 style="margin:1rem 0">Morfemas</h1>` + DATA.MORPHEMES.map(m => `
      <article class="note">
        <p class="faint">Semana ${m.week} · ${esc(m.kind)}</p>
        <p class="ipa" style="font-size:1.3rem">${esc(m.form)}</p>
        <p>${esc(m.meaning)}</p>
        <p class="muted" style="margin-top:.4rem">${m.sounds.map(esc).join(" · ")}</p>
        <div class="chips">${m.examples.map(e=>`<button class="speak" data-say="${esc(e.word)}">${esc(e.parts.join(" + "))}</button>`).join("")}</div>
        <p class="muted" style="margin-top:.6rem;font-size:.92rem">${esc(m.note)}</p>
      </article>`).join("");
  }
  const kinds = ["vowel","diphthong","consonant"];
  const labels = {vowel:"Vocales", diphthong:"Diptongos", consonant:"Consonantes"};
  let html = tabs + `<h1 style="margin:1rem 0">Sonidos</h1>`;
  for (const k of kinds) {
    html += `<h2 class="week-h">${labels[k]}</h2>`;
    html += DATA.PHONEMES.filter(p=>p.kind===k).map(p => `
      <article class="note">
        <div class="row" style="justify-content:space-between">
          <p class="ipa">/${esc(p.ipa)}/</p>
          <button class="speak" data-say="${esc(p.examples[0])}">oír ${esc(p.examples[0])}</button>
        </div>
        <p><b>${esc(p.name)}</b> · semana ${p.week} · ${p.voiced?"sonoro":"sordo"}</p>
        <p class="muted" style="margin-top:.35rem"><b>Español.</b> ${esc(p.spanish)}</p>
        <p class="muted"><b>Trampa.</b> ${esc(p.trap)}</p>
        <p>${esc(p.tip)}</p>
        <div class="chips">${p.examples.map(w=>`<button class="speak" data-say="${esc(w)}">${esc(w)}</button>`).join("")}</div>
      </article>`).join("");
  }
  return html;
}

const drills = {
  pares: {score:0,total:0, round:null},
  plural:{score:0,total:0, i:0, order:null},
  pasado:{score:0,total:0, i:0, order:null},
  partir:{score:0,total:0, i:0, order:null, pick:null},
};

function nextPares(){
  const same = Math.random() < 0.4;
  const pair = DATA.MINIMAL_PAIRS[Math.floor(Math.random()*DATA.MINIMAL_PAIRS.length)];
  const first = Math.random() < 0.5 ? pair.a : pair.b;
  const second = same ? first : (first===pair.a ? pair.b : pair.a);
  drills.pares.round = {pair, first, second, same};
}
nextPares();

function viewPractica(){
  const k = state.drill;
  const tabs = [["pares","Igual o distinto"],["plural","Cómo suena -s"],["pasado","Cómo suena -ed"],["partir","Partir la palabra"]];
  let body = "";
  if (k==="pares") {
    const r = drills.pares.round;
    body = `<p class="muted">Oye dos palabras. ¿Son la misma o distintas?</p>
      <p class="faint" style="margin:.4rem 0">${esc(r.pair.hint)}</p>
      <div class="row" style="margin:1rem 0">
        <button class="btn sec" data-play="first">Primera</button>
        <button class="btn sec" data-play="second">Segunda</button>
        <button class="btn pri" data-play="both">Las dos</button>
      </div>
      <div class="row">
        <button class="btn sec" data-pair="same">Igual</button>
        <button class="btn sec" data-pair="diff">Distinto</button>
      </div>
      <p class="drill-score" style="margin-top:1rem">${drills.pares.score}/${drills.pares.total}</p>
      <button class="btn ghost sm" data-reset="pares">Reiniciar</button>`;
  } else if (k==="plural" || k==="pasado") {
    const src = k==="plural" ? DATA.S_CLASSIFY : DATA.ED_CLASSIFY;
    const d = drills[k];
    if (!d.order) d.order = shuffle(src.map((_,i)=>i));
    const item = src[d.order[d.i % src.length]];
    const opts = k==="plural" ? ["/s/","/z/","/ɪz/"] : ["/t/","/d/","/ɪd/"];
    body = `<p class="muted">¿Cómo se oye el final de <b>${esc(item.word)}</b>?</p>
      <div class="row" style="margin:1rem 0">
        <button class="btn sec" data-say="${esc(item.word)}">Oír</button>
      </div>
      <div class="row">${opts.map(o=>`<button class="btn sec" data-class="${esc(o)}">${esc(o)}</button>`).join("")}</div>
      <p class="drill-score" style="margin-top:1rem">${d.score}/${d.total}</p>
      <button class="btn ghost sm" data-reset="${k}">Reiniciar</button>`;
  } else {
    const d = drills.partir;
    if (!d.order) d.order = shuffle(DATA.SPLIT_ITEMS.map((_,i)=>i));
    const item = DATA.SPLIT_ITEMS[d.order[d.i % DATA.SPLIT_ITEMS.length]];
    const pool = shuffle([...item.parts, ...["un","re","s","ed","ly","er"].filter(x=>!item.parts.includes(x)).slice(0,2)]);
    if (!d.pick) d.pick = [];
    body = `<p class="muted">Parte <b>${esc(item.word)}</b></p>
      <p class="faint">${esc(item.gloss)}</p>
      <div class="chips" style="margin:1rem 0">${d.pick.map(p=>`<span class="chip">${esc(p)}</span>`).join(" → ")||"<span class='faint'>elige en orden</span>"}</div>
      <div class="row">${pool.map(p=>`<button class="btn sec sm" data-part="${esc(p)}">${esc(p)}</button>`).join("")}</div>
      <div class="row" style="margin-top:.8rem">
        <button class="btn pri sm" data-split-ok>Comprobar</button>
        <button class="btn ghost sm" data-split-clear>Borrar</button>
      </div>
      <p class="drill-score" style="margin-top:1rem">${d.score}/${d.total}</p>`;
  }
  return `<p class="kicker">Entrenar el oído</p><h1 style="margin:.4rem 0 1rem">Práctica</h1>
    <div class="row">${tabs.map(([id,l])=>`<button class="btn sm ${k===id?'pri':'sec'}" data-drill="${id}">${l}</button>`).join("")}</div>
    <div class="note" id="drill-card">${body}</div>`;
}

function viewDiario(){
  const filled = DATA.LESSONS.filter(L => {
    const n = note(L.day);
    return n.worked.trim()||n.stuck.trim()||n.change.trim();
  });
  return `
    <p class="kicker">Desarrollo del método</p>
    <h1 style="margin:.4rem 0 1rem;font-size:2.2rem">Diario</h1>
    <p class="muted">Aquí se construye el método: evidencia de cada día, no intuición.</p>
    <div class="row" style="margin:1rem 0 1.6rem">
      <button class="btn sec" data-copy>Copiar notas</button>
      <button class="btn ghost" data-reset-all>Reiniciar estudio</button>
      <a class="btn sec" href="" download="morfofono.html" id="self-dl">Guardar este HTML</a>
    </div>
    <h2>Principios</h2>
    <ol style="padding:0;list-style:none;margin:.8rem 0 0" class="grid">
      ${DATA.PRINCIPLES.map((p,i)=>`<li class="note"><p class="faint">${i+1}</p><p style="font-weight:600">${esc(p.title)}</p><p class="muted">${esc(p.body)}</p></li>`).join("")}
    </ol>
    <h2 class="week-h">Notas (${filled.length})</h2>
    ${filled.length? filled.map(L => {
      const n = note(L.day);
      return `<article class="note">
        <button class="btn ghost sm" data-openday="${L.day}" style="padding:0;height:auto;color:var(--accent)">Día ${L.day} — ${esc(L.title)}</button>
        ${n.worked?`<p><b>Funcionó.</b> ${esc(n.worked)}</p>`:""}
        ${n.stuck?`<p><b>Se trabó.</b> ${esc(n.stuck)}</p>`:""}
        ${n.change?`<p><b>Cambiar.</b> ${esc(n.change)}</p>`:""}
      </article>`;
    }).join("") : `<p class="muted">Todavía no hay notas. Se escriben al pie de cada día.</p>`}
  `;
}

function render(){
  document.getElementById("side-nav").innerHTML = navHtml();
  document.getElementById("bot-nav").innerHTML = NAV.map(([k,l]) => `<a href="#" class="${state.view===k?'on':''}" data-go="${k}">${l}</a>`).join("");
  progress();
  const app = document.getElementById("app");
  app.innerHTML = state.view==="hoy" ? viewHoy()
    : state.view==="ruta" ? viewRuta()
    : state.view==="atlas" ? viewAtlas()
    : state.view==="practica" ? viewPractica()
    : viewDiario();
  bind(app);
  document.querySelectorAll("[data-go]").forEach(el => {
    el.onclick = (e) => { e.preventDefault(); setView(el.getAttribute("data-go")); };
  });
  const self = document.getElementById("self-dl");
  if (self) {
    const blob = new Blob([document.documentElement.outerHTML], {type:"text/html;charset=utf-8"});
    self.href = URL.createObjectURL(blob);
  }
}

function bind(root){
  root.querySelectorAll("[data-say]").forEach(el => el.onclick = () => speak(el.getAttribute("data-say")));
  root.querySelectorAll("[data-toggle]").forEach(el => el.onclick = () => {
    const id = el.getAttribute("data-toggle");
    const L = lesson();
    const cur = new Set(state.checked[L.day]||[]);
    if (cur.has(id)) cur.delete(id); else cur.add(id);
    state.checked[L.day] = [...cur];
    persist(); render();
  });
  const complete = root.querySelector("[data-complete]");
  if (complete) complete.onclick = () => {
    const d = lesson().day;
    if (!state.completed.includes(d)) state.completed.push(d);
    persist(); render();
  };
  const prev = root.querySelector("[data-prev]");
  if (prev) prev.onclick = () => setDay(Math.max(1, state.day-1));
  const next = root.querySelector("[data-next]");
  if (next) next.onclick = () => setDay(Math.min(DATA.TOTAL_DAYS, state.day+1));
  root.querySelectorAll("[data-openday]").forEach(el => el.onclick = () => setDay(+el.getAttribute("data-openday")));
  root.querySelectorAll("[data-atlas]").forEach(el => el.onclick = () => { state.atlas = el.getAttribute("data-atlas"); render(); });
  root.querySelectorAll("[data-drill]").forEach(el => el.onclick = () => { state.drill = el.getAttribute("data-drill"); render(); });
  root.querySelectorAll("textarea[data-note]").forEach(el => {
    el.oninput = () => {
      const d = lesson().day;
      state.notes[d] = Object.assign(note(d), { [el.getAttribute("data-note")]: el.value });
      persist();
    };
  });
  root.querySelectorAll("[data-play]").forEach(el => el.onclick = () => {
    const r = drills.pares.round;
    const w = el.getAttribute("data-play");
    if (w==="first") speak(r.first);
    else if (w==="second") speak(r.second);
    else { speak(r.first); setTimeout(()=>speak(r.second), 1100); }
  });
  root.querySelectorAll("[data-pair]").forEach(el => el.onclick = () => {
    const same = el.getAttribute("data-pair")==="same";
    const ok = same === drills.pares.round.same;
    drills.pares.total++; if (ok) drills.pares.score++;
    nextPares(); render();
  });
  root.querySelectorAll("[data-reset]").forEach(el => el.onclick = () => {
    const k = el.getAttribute("data-reset");
    drills[k].score=0; drills[k].total=0; drills[k].i=0; drills[k].order=null; drills[k].pick=null;
    if (k==="pares") nextPares();
    render();
  });
  root.querySelectorAll("[data-class]").forEach(el => el.onclick = () => {
    const k = state.drill;
    const src = k==="plural" ? DATA.S_CLASSIFY : DATA.ED_CLASSIFY;
    const d = drills[k];
    const item = src[d.order[d.i % src.length]];
    const ok = el.getAttribute("data-class") === item.sound;
    d.total++; if (ok) d.score++; d.i++;
    render();
  });
  root.querySelectorAll("[data-part]").forEach(el => el.onclick = () => {
    drills.partir.pick = drills.partir.pick || [];
    drills.partir.pick.push(el.getAttribute("data-part"));
    render();
  });
  const clear = root.querySelector("[data-split-clear]");
  if (clear) clear.onclick = () => { drills.partir.pick=[]; render(); };
  const okb = root.querySelector("[data-split-ok]");
  if (okb) okb.onclick = () => {
    const d = drills.partir;
    const item = DATA.SPLIT_ITEMS[d.order[d.i % DATA.SPLIT_ITEMS.length]];
    const ok = (d.pick||[]).join("|") === item.parts.join("|");
    d.total++; if (ok) d.score++; d.i++; d.pick=[];
    render();
  };
  const copy = root.querySelector("[data-copy]");
  if (copy) copy.onclick = async () => {
    const lines = ["# Morfofono — notas del método", "", "Días cerrados: "+state.completed.length+" / "+DATA.TOTAL_DAYS, ""];
    for (const L of DATA.LESSONS) {
      const n = note(L.day);
      if (!(n.worked||n.stuck||n.change).trim()) continue;
      lines.push("## Día "+L.day+" — "+L.title, "");
      if (n.worked.trim()) lines.push("**Qué funcionó**", n.worked.trim(), "");
      if (n.stuck.trim()) lines.push("**Dónde se trabó**", n.stuck.trim(), "");
      if (n.change.trim()) lines.push("**Qué cambiar**", n.change.trim(), "");
    }
    try { await navigator.clipboard.writeText(lines.join("\n")); copy.textContent="Copiado"; }
    catch { copy.textContent="No se pudo copiar"; }
  };
  const ra = root.querySelector("[data-reset-all]");
  if (ra) ra.onclick = () => {
    if (!confirm("¿Borrar progreso local y notas?")) return;
    state.checked={}; state.completed=[]; state.notes={}; state.day=1;
    persist(); render();
  };
}

if (typeof speechSynthesis !== "undefined") speechSynthesis.getVoices();
render();
</script>
</body>
</html>
