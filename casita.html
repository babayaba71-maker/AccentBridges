<script>
/* ===== LA CASITA DE ALMA v1.8 "HOLO" — mismo cerebro, nueva piel =====
   Todo lo que ya funcionaba sigue igual: relé sin llaves, micrófono que graba y
   el servidor transcribe (casitaVoz), screenshots y archivos (casitaOjo).
   Nuevo: holograma reactivo al estado + puerta al ecosistema. */
const RELAY="https://base44.app/api/apps/6adecb1874687a1b299764fa/functions/";
const GUARD="casita-abvc-clande-2026";
const H={"Content-Type":"application/json","X-Casita-Key":GUARD};
let CID=localStorage.getItem("casita_conv")||"";
let voiceOn=(localStorage.getItem("casita_voice")||"1")==="1";
let base=new Set(), sending=false, pollTimer=null, pollCount=0;
const $=id=>document.getElementById(id);
const vib=ms=>{if("vibrate" in navigator)navigator.vibrate(ms)};

/* ---------- estado del holograma (idle / listening / thinking / speaking) ---------- */
const ESTADO={modo:"idle",nivel:0};
function setModo(m){ESTADO.modo=m}
window.ALMA=ESTADO;   // visible para diagnóstico
/* pantalla siempre encendida: para que el orb se quede vivo como wallpaper */
let sentinela=null;
async function mantenerPantalla(){
  try{ if("wakeLock" in navigator && !sentinela){ sentinela=await navigator.wakeLock.request("screen");
    sentinela.addEventListener("release",()=>{sentinela=null}); } }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") mantenerPantalla(); });
document.addEventListener("pointerdown",()=>{ mantenerPantalla() },{once:false,passive:true});

/* ---------- holograma v2.0 AZUL: bloom real con sprite (barato para el teléfono) ---------- */
(function holo(){
  const cv=$("holo"), ctx=cv.getContext("2d");
  let W=0,Hh=0,DPR=Math.min(window.devicePixelRatio||1,2), t=0, vivo=true, nivel=0;
  const menosMovimiento=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // sprite de luz: se dibuja una vez y se reusa (sin shadowBlur por partícula = sin calentar el phone)
  const SPR=(()=>{
    const c=document.createElement("canvas");c.width=c.height=72;
    const x=c.getContext("2d"), g=x.createRadialGradient(36,36,0,36,36,36);
    g.addColorStop(0,"rgba(255,255,255,1)");
    g.addColorStop(.18,"rgba(190,235,255,.92)");
    g.addColorStop(.40,"rgba(0,242,254,.55)");
    g.addColorStop(.68,"rgba(43,123,255,.32)");
    g.addColorStop(1,"rgba(43,123,255,0)");
    x.fillStyle=g;x.beginPath();x.arc(36,36,36,0,7);x.fill();return c;
  })();

  const N=window.innerWidth<520?70:90;
  const pts=Array.from({length:N},()=>({a:Math.random()*Math.PI*2,r:.32+Math.random()*.78,
    v:.0005+Math.random()*.0015,s:1.5+Math.random()*2.6,ph:Math.random()*6.28}));

  function resize(){
    W=window.innerWidth;Hh=window.innerHeight;
    cv.width=W*DPR;cv.height=Hh*DPR;cv.style.width=W+"px";cv.style.height=Hh+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  resize();addEventListener("resize",resize);
  document.addEventListener("visibilitychange",()=>{vivo=!document.hidden;if(vivo)loop()});

  function loop(){
    if(!vivo)return;
    t+=1;
    ctx.clearRect(0,0,W,Hh);
    const grande=ESTADO.grande===true;
    const cx=W/2, cy=grande?Hh*.47:Hh*.42, R=Math.min(W,Hh)*(grande?.42:.30);
    const modo=ESTADO.modo;
    // nivel de voz suavizado (0..1): las partículas respiran con JJ, no con el reloj
    nivel += ((ESTADO.nivel||0) - nivel) * .28;
    const pulso=modo==="listening"?.5+.5*Math.sin(t*.16):modo==="thinking"?.35+.35*Math.sin(t*.09):modo==="speaking"?.45+.55*Math.sin(t*.22):.30+.18*Math.sin(t*.03);

    // 1. halo azul grande (contraste contra el fondo marino)
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*(2.1+nivel*.22));
    g.addColorStop(0,`rgba(120,200,255,${.10+pulso*.16})`);
    g.addColorStop(.32,`rgba(43,123,255,${.09+pulso*.13})`);
    g.addColorStop(.66,`rgba(0,242,254,${.03+pulso*.05})`);
    g.addColorStop(1,"rgba(43,123,255,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*2.1,0,7);ctx.fill();

    // 2. anillos definidos (azul + cian)
    for(let i=0;i<3;i++){
      const rr=R*(.55+i*.22), rot=t*(.0022+i*.0011)*(i%2?-1:1);
      ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
      ctx.strokeStyle=`rgba(90,180,255,${.22+pulso*.30})`;ctx.lineWidth=1.4;
      ctx.beginPath();ctx.arc(0,0,rr,0,Math.PI*1.55);ctx.stroke();
      ctx.strokeStyle=`rgba(0,242,254,${.20+pulso*.35})`;ctx.lineWidth=2.4;
      ctx.beginPath();ctx.arc(0,0,rr*1.02,Math.PI*.15,Math.PI*.44);ctx.stroke();
      ctx.strokeStyle=`rgba(0,230,118,${.10+pulso*.18})`;ctx.lineWidth=1.6;
      ctx.beginPath();ctx.arc(0,0,rr*.99,Math.PI*1.05,Math.PI*1.18);ctx.stroke();
      ctx.restore();
    }

    // 3. núcleo con bloom
    const coreR=R*.24*(1+pulso*.26+nivel*.42);
    const bloom=coreR*4.6;
    ctx.globalAlpha=.95;
    ctx.drawImage(SPR,cx-bloom,cy-bloom,bloom*2,bloom*2);
    ctx.globalAlpha=1;
    const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,coreR);
    cg.addColorStop(0,`rgba(255,255,255,${.92+pulso*.08})`);
    cg.addColorStop(.42,`rgba(180,240,255,${.75+pulso*.2})`);
    cg.addColorStop(.80,`rgba(43,123,255,${.45+pulso*.25})`);
    cg.addColorStop(1,"rgba(0,242,254,0)");
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,coreR,0,7);ctx.fill();

    // 4. partículas: 70+ con su propio brillo, se cuentan a simple vista
    pts.forEach(p=>{
      p.a+=menosMovimiento?0:p.v*(modo==="thinking"?3:1);
      const rr=R*(.44+p.r*1.42)*(1+nivel*.30);          // se ALEJAN cuando hablas
      const x=cx+Math.cos(p.a)*rr, y=cy+Math.sin(p.a)*rr*.62;
      const tw=.6+.4*Math.sin(t*.05+p.ph);            // parpadeo propio
      const al=(.35+pulso*.55+nivel*.45)*tw;
      const rad=p.s*2.2*(1+pulso*.55+nivel*1.05)*(grande?1.25:1);   // y CRECEN
      ctx.globalAlpha=Math.min(.95,al);
      ctx.drawImage(SPR,x-rad,y-rad,rad*2,rad*2);
      ctx.globalAlpha=Math.min(1,al*1.6);
      ctx.fillStyle="rgba(235,252,255,.95)";
      ctx.beginPath();ctx.arc(x,y,Math.max(.9,rad*.13),0,7);ctx.fill();
    });
    ctx.globalAlpha=1;

    // 5. onda de voz + destello del anillo externo
    if(nivel>.04){
      ctx.strokeStyle=`rgba(0,242,254,${.10+nivel*.55})`;
      ctx.lineWidth=1.6+nivel*3.4;
      ctx.beginPath();ctx.arc(cx,cy,R*(1.16+nivel*.30),0,7);ctx.stroke();
      ctx.strokeStyle=`rgba(43,123,255,${nivel*.35})`;
      ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(cx,cy,R*(1.24+nivel*.44),0,7);ctx.stroke();
    }
    if(modo==="listening"||modo==="speaking"){
      ctx.strokeStyle=`rgba(43,123,255,${.18+pulso*.28})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(cx,cy,R*(1.30+pulso*.06),0,7);ctx.stroke();
    }
    requestAnimationFrame(loop);
  }
  loop();
})();

/* ---------- voz de Alma ---------- */
function bubble(txt,who){
  const d=document.createElement("div");d.className="b "+who;
  if(who==="a"){
    let h=txt.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    h=h.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<b>$1</b>").replace(/_(.+?)_/g,"<i>$1</i>");
    d.innerHTML=h;
  } else { d.textContent=txt; }
  $("chat").appendChild(d);
  $("chat").scrollTop=$("chat").scrollHeight;
  return d;
}
// ---------- LA VOZ (servidor primero, telefono como respaldo) ----------
// El S22 de JJ no trae voz en espanol instalada, asi que speechSynthesis daba
// silencio puro. Ahora el MP3 lo genera el servidor (casitaHabla, voz Cindy) y
// aqui solo se reproduce. La voz del navegador queda como plan B.
const TTS="https://base44.app/api/apps/6adecb1874687a1b299764fa/functions/casitaHabla";
const LLAVE="casita-abvc-clande-2026";
let audioAlma=null, cacheVoz=new Map();

function limpiarVoz(t){
  return String(t||"").replace(/https?:\/\/\S+/g,"enlace").replace(/[*_~`>#|]/g,"")
    .replace(/[\u{1F300}-\u{1FAFF}\u2700-\u27BF\u2600-\u26FF]/gu,"").replace(/\s+/g," ")
    .trim().slice(0,700);
}

async function speak(t){
  if(!voiceOn)return;
  const clean=limpiarVoz(t);
  if(!clean)return;
  const ok=await vozServidor(clean);
  if(!ok)vozNavegador(clean);
}

async function vozServidor(txt){
  try{
    setModo("speaking");
    let b64=cacheVoz.get(txt);
    if(!b64){
      const ctl=new AbortController();
      const to=setTimeout(()=>ctl.abort(),9000);
      const r=await fetch(TTS,{method:"POST",signal:ctl.signal,
        headers:{"Content-Type":"application/json","X-Casita-Key":LLAVE},
        body:JSON.stringify({text:txt})});
      clearTimeout(to);
      if(!r.ok)throw new Error("HTTP "+r.status);
      const d=await r.json();
      if(!d.audio)throw new Error(d.error||"sin audio");
      b64=d.audio;
      if(cacheVoz.size<20)cacheVoz.set(txt,b64);
    }
    if(audioAlma){try{audioAlma.pause()}catch(e){}}
    audioAlma=new Audio("data:audio/mpeg;base64,"+b64);
    audioAlma.onended=()=>setModo("idle");
    audioAlma.onerror=()=>setModo("idle");
    await audioAlma.play();
    return true;
  }catch(e){
    setModo("idle");
    $("status").textContent="No llego la voz del servidor ("+((e&&e.message)||e)+"): uso la del telefono";
    return false;
  }
}

function vozNavegador(clean){

  try{speechSynthesis.cancel();speechSynthesis.resume();}catch(e){}
  const u=new SpeechSynthesisUtterance(clean);
  u.lang="es-MX";u.rate=1.02;u.volume=1;
  const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith("es"));
  if(vs.length)u.voice=vs[0];
  u.onstart=()=>setModo("speaking");
  u.onend=()=>setModo("idle");
  u.onerror=(e)=>{
    setModo("idle");

    if(err!=="interrupted"&&err!=="canceled")
      $("status").textContent="Sin voz en el telefono ("+err+"). Revisa el volumen del aparato.";

  setTimeout(function(){try{speechSynthesis.speak(u);}catch(e){}},90);
}

/* ---------- hablar con Alma (relé, sin llaves) ---------- */
async function sendMsg(text,oculto){
  if(!text.trim()||sending)return;
  sending=true;vib(20);
  if(!oculto)bubble(text,"u");
  $("txt").value="";
  setModo("thinking");
  $("status").textContent="ALMA ESTÁ PENSANDO… (20 s a 2 min)";
  if(gpsOn){ try{ if(!pos||Date.now()-pos.ts>300000){ await gpsFijar(); await gpsLugar(); } }catch(e){} }
  try{
    const r=await fetch(RELAY+"sendAlmaMessage",{method:"POST",headers:H,body:JSON.stringify({message:conTexto(text).slice(0,4000)})});
    const d=await r.json();
    if(d.conversationId&&d.conversationId!==CID){CID=d.conversationId;localStorage.setItem("casita_conv",CID)}
  }catch(e){
    bubble("No pude mandar el mensaje — revisa tu internet y reprueba","a");
    sending=false;setModo("idle");return;
  }
  pollCount=0;clearInterval(pollTimer);
  pollTimer=setInterval(poll,3000);
}
async function poll(){
  pollCount++;
  if(!CID){setModo("idle");return}
  try{
    const r=await fetch(RELAY+"getAlmaReply",{method:"POST",headers:H,body:JSON.stringify({conversationId:CID})});
    const d=await r.json();
    const fresh=(d.messages||[]).filter(m=>m.content&&!base.has(m.role+"|"+m.content));
    const replies=fresh.filter(m=>m.role==="assistant");
    if(replies.length){
      replies.forEach(m=>{base.add(m.role+"|"+m.content);bubble(m.content,"a")});
      speak(replies.map(m=>m.content).join(" "));
      fresh.forEach(m=>base.add(m.role+"|"+m.content));
      clearInterval(pollTimer);$("status").textContent="";sending=false;vib([20,40,20]);
    } else if(fresh.length){fresh.forEach(m=>base.add(m.role+"|"+m.content))}
  }catch(e){}
  if(pollCount>40){clearInterval(pollTimer);$("status").textContent="SIGUE PENSÁNDOLA… si no aparece, refresca.";sending=false;setModo("idle")}
}
function sendTxt(){sendMsg($("txt").value)}
$("txt").addEventListener("keydown",e=>{if(e.key==="Enter")sendTxt()});

/* ---------- micrófono: el teléfono SOLO GRABA, el servidor transcribe ---------- */
let mediaRec=null,chunks=[],recOn=false,recT0=0,recTimer=null,recStream=null;
/* oído del orb: mide el volumen real del micrófono con Web Audio (no finge) */
let audioCtx=null,analyser=null,nivelLoop=null,dataBuf=null;
function empezarNivel(stream){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!audioCtx)audioCtx=new AC();
    if(audioCtx.state==="suspended")audioCtx.resume();
    const src=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=512;analyser.smoothingTimeConstant=.72;
    src.connect(analyser);
    dataBuf=new Uint8Array(analyser.fftSize);
    picoVoz=.05;
    medir();
  }catch(e){}
}
let picoVoz=.05;
function medir(){
  if(!analyser){ESTADO.nivel=0;return}
  analyser.getByteTimeDomainData(dataBuf);
  let suma=0;
  for(let i=0;i<dataBuf.length;i++){const v=(dataBuf[i]-128)/128;suma+=v*v}
  const rms=Math.sqrt(suma/dataBuf.length);
  // GANANCIA AUTOMÁTICA: se calibra sola al micrófono de cada teléfono
  if(rms>picoVoz)picoVoz=picoVoz*.7+rms*.3;else picoVoz*=.9993;
  const ref=Math.max(.03,picoVoz*1.15);          // deja aire arriba: la voz normal NO satura
  const n=rms<.012?0:Math.min(1,Math.pow(rms/ref,.85));   // compuerta de ruido + curva suave
  ESTADO.nivel=ESTADO.nivel*.40+n*.60;
  nivelLoop=requestAnimationFrame(medir);
}
function pararNivel(){
  cancelAnimationFrame(nivelLoop);nivelLoop=null;analyser=null;ESTADO.nivel=0;
  try{if(audioCtx)audioCtx.suspend()}catch(e){}
}
function micReset(msg){
  recOn=false;clearInterval(recTimer);setModo("idle");pararNivel();
  $("mic").textContent="🎙️ HÁBLAME";$("mic").classList.remove("rec");
  if(msg){$("status").textContent=msg;vib(80)}
}
async function micToggle(){
  if(recOn){pararGrabacion();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){micReset("Este navegador no deja grabar. Ábreme en CHROME directo.");return}
  try{
    recStream=await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false,      // la cancelación de eco recorta la voz bajita
      noiseSuppression:false,      // el filtro de ruido se come el habla suave
      autoGainControl:true,        // sube sola la voz cuando hablas lejos
      channelCount:1
    }});
  }catch(e1){
    if(e1&&(e1.name==="NotAllowedError"||e1.name==="SecurityError"||e1.name==="PermissionDeniedError")){
      micReset("MICRÓFONO BLOQUEADO — ábreme en Chrome y presiona PERMITIR");return
    }
    // el teléfono no aceptó los ajustes finos: pedimos el micrófono a secas
    try{ recStream=await navigator.mediaDevices.getUserMedia({audio:true}) }
    catch(e2){ micReset("MICRÓFONO BLOQUEADO — ábreme en Chrome y presiona PERMITIR");return }
  }
  try{
    chunks=[];mediaRec=new MediaRecorder(recStream,{audioBitsPerSecond:128000});
    mediaRec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    mediaRec.onstop=mandarGrabacion;
    mediaRec.start();
    empezarNivel(recStream);
    mantenerPantalla();
  }catch(e){micReset("No pude grabar: "+e.message);return}
  recOn=true;recT0=Date.now();vib(30);setModo("listening");
  $("mic").textContent="🔴 GRABANDO…";$("mic").classList.add("rec");
  clearInterval(recTimer);
  recTimer=setInterval(()=>{
    const s=Math.floor((Date.now()-recT0)/1000);
    $("mic").textContent="🔴 GRABANDO "+s+"s · TOCA";
    if(s>=120)pararGrabacion();
  },400);
}
function pararGrabacion(){
  clearInterval(recTimer);$("mic").textContent="🎙️ MANDANDO…";setModo("thinking");
  try{mediaRec.stop()}catch(e){}
}
async function picoDeNota(blob){
  try{
    const ab=await blob.arrayBuffer();
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    const ac=new AC();
    const aud=await ac.decodeAudioData(ab);
    let pico=0;
    for(let c=0;c<aud.numberOfChannels;c++){
      const d=aud.getChannelData(c);
      for(let i=0;i<d.length;i+=4){ const v=Math.abs(d[i]); if(v>pico)pico=v }
    }
    try{await ac.close()}catch(e){}
    return 20*Math.log10(Math.max(pico,1e-6));
  }catch(e){ return null }
}


/* ---------- NORMALIZADOR: la nota se va con el volumen al tope, no como salga ---------- */
function wavDe16k(x){
  const n=x.length, ab=new ArrayBuffer(44+n*2), v=new DataView(ab);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);
  v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,16000,true);
  v.setUint32(28,32000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,"data");v.setUint32(40,n*2,true);
  let o=44;
  for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,x[i]));v.setInt16(o,s<0?s*0x8000:s*0x7FFF,true);o+=2}
  return new Blob([ab],{type:"audio/wav"});
}
async function notaLimpia(blob){
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return null;
  let ctx=null;
  try{
    ctx=new AC();
    const audio=await ctx.decodeAudioData(await blob.arrayBuffer());
    const d0=audio.getChannelData(0);
    let pico=0; for(let i=0;i<d0.length;i+=4){const a=Math.abs(d0[i]); if(a>pico)pico=a}
    if(!pico){try{ctx.close()}catch(e){}return null}
    const Off=window.OfflineAudioContext||window.webkitOfflineAudioContext;
    const off=new Off(1,Math.max(1600,Math.ceil(audio.duration*16000)),16000);
    const src=off.createBufferSource();src.buffer=audio;src.connect(off.destination);src.start();
    const out=await off.startRendering();
    try{ctx.close()}catch(e){}
    const x=out.getChannelData(0);
    let p2=0; for(let i=0;i<x.length;i++){const a=Math.abs(x[i]); if(a>p2)p2=a}
    // subimos hasta dejar el pico en -3 dBFS, con techo de +30 dB para no inflar puro silencio
    const gan=Math.min(Math.pow(10,-3/20)/(p2||1),31.6);
    const y=new Float32Array(x.length);
    for(let i=0;i<x.length;i++){y[i]=Math.max(-1,Math.min(1,x[i]*gan))}
    return {blob:wavDe16k(y), picoDb:20*Math.log10(pico||1e-9), ganDb:20*Math.log10(gan)};
  }catch(e){ try{ctx&&ctx.close()}catch(_){} return null }
}
async function mandarGrabacion(){
  const dur=Math.round((Date.now()-recT0)/100)/10;
  pararNivel();
  try{recStream&&recStream.getTracks().forEach(t=>t.stop())}catch(e){}
  recOn=false;$("mic").classList.remove("rec");
  const blob=new Blob(chunks,{type:(mediaRec&&mediaRec.mimeType)||"audio/webm"});
  if(!blob.size||dur<0.4){micReset("Muy corto, otra vez");return}
  try{
    const limpia=await notaLimpia(blob);
    const envio=limpia&&limpia.blob?limpia.blob:blob;
    const pico=limpia?limpia.picoDb:(await picoDeNota(blob));
    if(limpia&&limpia.ganDb>=10) $("status").textContent="VOLUMEN SUBIDO "+Math.round(limpia.ganDb)+" dB · se va limpia";
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(envio)});
    const r=await fetch(RELAY+"casitaVoz",{method:"POST",headers:H,body:JSON.stringify({audio_b64:b64,mime:envio.type,dur,sid:"jj",gan:limpia?Math.round(limpia.ganDb):0})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||"no subió");
    bubble("🎤 Nota de voz ("+Math.round(d.dur)+"s)","u");vib([20,40,20]);
    sendMsg("🎤 Te mando una nota de voz de "+Math.round(d.dur)+" segundos"+(flojo?" (OJO: el teléfono marcó que se oyó muy bajito, pico "+Math.round(pico)+" dB)":"")+".\nTranscríbela desde aquí y contéstame: "+RELAY+"casitaVoz?id="+d.id,"1");
    $("mic").textContent="🎙️ HÁBLAME";
    return;
  }catch(e){micReset("No pude mandar la nota: "+e.message)}
  $("mic").textContent="🎙️ HÁBLAME";setModo("idle");
}

<script>
/* ---------- GPS: que Alma sepa dónde estás (v2.5) ----------
   Permiso del navegador, sin servidores de terceros mas que el nombre de la colonia.
   Redondeo a 3 decimales (~110 m): alcanza para el contexto, no para rastrearte. */
let gpsOn = localStorage.getItem("casita_gps")==="1";
let pos = null;

function gpsPinta(msg){
  const b=document.getElementById("gps");
  if(!b) return;
  b.classList.toggle("off",!gpsOn);
  b.style.color = gpsOn ? "var(--cyan)" : "";
  b.style.borderColor = gpsOn ? "rgba(0,242,254,.85)" : "";
  b.title = msg || (gpsOn ? (pos&&pos.lugar ? "Estás en "+pos.lugar : "Ubicación encendida") : "Ubicación apagada");
}

async function gpsFijar(){
  if(!navigator.geolocation) throw new Error("este navegador no da GPS");
  return new Promise((ok,mal)=>{
    navigator.geolocation.getCurrentPosition(
      p=>{
        pos={ lat:+p.coords.latitude.toFixed(3), lon:+p.coords.longitude.toFixed(3),
              prec:Math.round(p.coords.accuracy), lugar:(pos&&pos.lugar)||"", ts:Date.now() };
        ok(pos);
      },
      e=>mal(new Error(e.code===1 ? "permiso negado, dale PERMITIR a la ubicación" : (e.message||"sin señal") )),
      {enableHighAccuracy:false, timeout:12000, maximumAge:120000}
    );
  });
}

async function gpsLugar(){
  if(!pos) return;
  try{
    const r=await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=16&accept-language=es&lat="+pos.lat+"&lon="+pos.lon,{headers:{"Accept":"application/json"}});
    if(!r.ok) throw new Error("geo "+r.status);
    const d=await r.json();
    const a=d.address||{};
    const barrio=a.suburb||a.neighbourhood||a.quarter||a.residential||a.village||a.hamlet||"";
    const ciudad=a.city||a.town||a.municipality||a.county||"";
    const estado=a.state||"";
    pos.lugar=[barrio,ciudad,estado].filter(Boolean).join(", ");
  }catch(e){ pos.lugar = pos.lugar || ""; }
}

async function gpsToggle(){
  if(gpsOn){
    gpsOn=false; localStorage.setItem("casita_gps","0");
    gpsPinta("Ubicación apagada"); vib(15);
    return;
  }
  gpsPinta("Pidiendo permiso…");
  try{
    await gpsFijar();
    await gpsLugar();
    gpsOn=true; localStorage.setItem("casita_gps","1");
    gpsPinta(pos.lugar ? "Estás en "+pos.lugar : "Ubicación encendida");
    vib([15,30,15]);
    if(typeof bubble==="function") bubble("📍 Listo, ya sé dónde estás: "+(pos.lugar||(pos.lat+", "+pos.lon)),"a");
  }catch(e){
    gpsOn=false; localStorage.setItem("casita_gps","0");
    gpsPinta("No se pudo: "+e.message);
    if(typeof bubble==="function") bubble("📍 No pude leer tu ubicación: "+e.message,"a");
  }
}

function conTexto(t){
  if(!gpsOn || !pos) return t;
  const rato = (Date.now()-pos.ts) > 300000;
  const etiqueta = pos.lugar || "colonia sin nombre";
  return "[📍 "+etiqueta+" · "+pos.lat+", "+pos.lon+" · \u00b1"+pos.prec+" m"+(rato?" · dato de hace rato":"")+"]\n"+t;
}

gpsPinta();
if(gpsOn){ gpsFijar().then(gpsLugar).then(()=>gpsPinta()).catch(()=>{ gpsOn=false; localStorage.setItem("casita_gps","0"); gpsPinta(); }); }
</script>
