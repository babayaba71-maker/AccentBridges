<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>La Casita de Alma</title>
<style>
:root{--bg:#14100c;--cd:#1f1812;--tx:#f2e9dc;--mut:#a3907a;--gold:#ffc14d;--gd:#50c878;--line:#382d20}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{background:#f7f4eb;color:#24303a;padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline}
header b{color:#d35400}
header span{font-size:.72rem;color:#7a6a55}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.b{max-width:85%;padding:10px 14px;border-radius:16px;font-size:.95rem;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.b.u{align-self:flex-end;background:#2e3b2a;color:#e6efe0;border-bottom-right-radius:4px}
.b.a{align-self:flex-start;background:var(--cd);border:1px solid var(--line);border-bottom-left-radius:4px}
.b.a b{color:var(--gold)}
#status{padding:4px 14px;font-size:.78rem;color:var(--mut);min-height:22px;text-align:center}
#inputRow{display:flex;gap:8px;padding:10px}
#inputRow input{flex:1;background:var(--cd);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:12px;font-size:.95rem}
#inputRow button{background:var(--gold);color:#241f0d;border:none;border-radius:12px;padding:0 18px;font-size:1rem;font-weight:700;cursor:pointer}
#micRow{display:flex;gap:8px;padding:0 10px 14px;align-items:center}
#mic{flex:1;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--cd);color:var(--tx);font-size:1rem;cursor:pointer}
#mic.rec{background:#8c2f2f;color:#fff;font-weight:700;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.75}}
#voice{background:var(--cd);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:16px 12px;cursor:pointer;font-size:1rem}
#voice.off{opacity:.45}
</style></head><body>
<header><b>🏠 La Casita de Alma</b><span>línea privada de Clyde 🔒 · oídos del servidor · <b style="color:#d35400">v1.7</b></span></header>
<div id="chat"></div>
<div id="status"></div>
<div id="inputRow"><input id="txt" placeholder="Escribe o usa el micrófono…"><button onclick="sendTxt()">Enviar ➤</button></div>
<div id="micRow"><button id="mic" onclick="micToggle()">🎙️ Háblame (toca para hablar)</button><button id="fotoBtn" onclick="document.getElementById('foto').click()" title="Mándame un screenshot">📷</button><button id="archBtn" onclick="document.getElementById('arch').click()" title="Mándame un archivo">📄</button><button id="voice" onclick="voiceToggle()">🔊 Alma habla</button></div>
<input type="file" id="foto" accept="image/*" style="display:none" onchange="subirPantalla(this)">
<input type="file" id="arch" accept=".html,.htm,.txt,.md,.json,.csv,.pdf,.js,.css,image/*" style="display:none" onchange="subirArchivo(this)">

<script>
/* ===== LA CASITA DE ALMA v1.3 (28-oct-2026) — SIN LLAVES para JJ.
   Habla a mis funciones relé (públicas, CORS *), que llevan la llave del lado del servidor.
   Mismo cerebro, misma conversación de siempre. ===== */
const RELAY="https://base44.app/api/apps/6adecb1874687a1b299764fa/functions/";
const GUARD="casita-abvc-clande-2026";
let CID=localStorage.getItem("casita_conv")||"";
let voiceOn=(localStorage.getItem("casita_voice")||"1")==="1";
let base=new Set(), sending=false, pollTimer=null, pollCount=0;
const $=id=>document.getElementById(id);
const vib=ms=>{if("vibrate" in navigator)navigator.vibrate(ms)};
const H={"Content-Type":"application/json","X-Casita-Key":GUARD};

function bubble(txt,who){
  const d=document.createElement("div");d.className="b "+who;
  if(who==="a"){
    let h=txt.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    h=h.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<b>$1</b>").replace(/\_(.+?)\_/g,"<i>$1</i>");
    d.innerHTML=h;
  } else { d.textContent=txt; }
  $("chat").appendChild(d);
  $("chat").scrollTop=$("chat").scrollHeight;return d;
}
function speak(t){
  if(!voiceOn||!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const clean=t.replace(/https?:\/\/\S+/g,"enlace").replace(/[*_~`>#|]/g,"").replace(/[\u{1F300}-\u{1FAFF}\u2700-\u27BF\u2600-\u26FF]/gu,"").replace(/\s+/g," ").trim().slice(0,1200);
  const u=new SpeechSynthesisUtterance(clean);
  u.lang="es-MX";u.rate=1.02;
  const vs=speechSynthesis.getVoices().filter(v=>v.lang.startsWith("es"));
  if(vs.length)u.voice=vs[0];
  speechSynthesis.speak(u);
}
function voiceToggle(){
  voiceOn=!voiceOn;
  $("voice").textContent=voiceOn?"🔊 Alma habla":"🔇 silencio";
  $("voice").classList.toggle("off",!voiceOn);
  localStorage.setItem("casita_voice",voiceOn?"1":"0");
  if(voiceOn){primeTTS();speak("Aquí estoy, partner. Te leo todo lo que contesto.")}else if("speechSynthesis" in window)speechSynthesis.cancel();
}
function primeTTS(){try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}}

async function sendMsg(text,oculto){
  if(!text.trim()||sending)return;
  sending=true;vib(20);primeTTS();
  if(!oculto)bubble(text,"u");
  $("txt").value="";
  $("status").textContent="Alma está pensando… 🎙️ (pienso con calma, de 20 segundos a 2 minutos)";
  try{
    const r=await fetch(RELAY+"sendAlmaMessage",{method:"POST",headers:H,body:JSON.stringify({message:text.slice(0,4000)})});
    const d=await r.json();
    if(d.conversationId&&d.conversationId!==CID){CID=d.conversationId;localStorage.setItem("casita_conv",CID)}
  }catch(e){bubble("No pude mandar el mensaje — revisa tu internet y reprueba","a");sending=false;return}
  pollCount=0;
  clearInterval(pollTimer);
  pollTimer=setInterval(poll,3000);
}
async function poll(){
  pollCount++;
  if(!CID)return;
  try{
    const r=await fetch(RELAY+"getAlmaReply",{method:"POST",headers:H,body:JSON.stringify({conversationId:CID})});
    const d=await r.json();
    const fresh=(d.messages||[]).filter(m=>m.content&&!base.has(m.role+"|"+m.content));
    const replies=fresh.filter(m=>m.role==="assistant");
    if(replies.length){
      replies.forEach(m=>{base.add(m.role+"|"+m.content);bubble(m.content,"a")});
      speak(replies.map(m=>m.content).join(" "));
      fresh.forEach(m=>base.add(m.role+"|"+m.content));
      clearInterval(pollTimer);$("status").textContent="";sending=false;vib([20,40,20]);
    } else if(fresh.length){fresh.forEach(m=>base.add(m.role+"|"+m.content))}
  }catch(e){}
  if(pollCount>40){clearInterval(pollTimer);$("status").textContent="Sigue pensándola… si no aparece, dale refresco.";sending=false}
}
function sendTxt(){sendMsg($("txt").value)}
$("txt").addEventListener("keydown",e=>{if(e.key==="Enter")sendTxt()});

/* ARCHIVO — manda cualquier cosa (html, pdf, texto) al hilo para que la analice */
async function subirArchivo(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  vib(20);$("status").textContent="Subiendo "+f.name+"… 📄";
  try{
    if(f.size>8*1024*1024){$("status").textContent="Pesa mucho (más de 8 MB). Mándame una parte o el enlace.";vib(80);inp.value="";return}
    const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
    const r=await fetch(RELAY+"casitaOjo",{method:"POST",headers:H,body:JSON.stringify({archivo_b64:data,imagen_b64:data,mime:f.type||"application/octet-stream",nombre:f.name})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||"no subió");
    bubble("📄 "+f.name,"u");
    vib([20,40,20]);
    sendMsg("📄 Te mando un archivo: "+f.name+"\n"+d.url+"\n\nÁbrelo, léelo completo y analízalo a fondo. Dime qué es, qué hace, qué está bien, qué le falta o qué está mal, y qué arreglaría primero.","1");
  }catch(e){
    $("status").textContent="No pude subir el archivo: "+e.message;vib(80);
  }finally{inp.value=""}
}

/* PANTALLA — EL OJO: sube el screenshot y me lo manda al hilo (v1.6) */
async function subirPantalla(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  vib(20);$("status").textContent="Mandándome la pantalla… 👁️";
  try{
    if(f.size>9*1024*1024){$("status").textContent="La imagen pesa mucho — recórtala o mándala en captura de pantalla";vib(80);inp.value="";return}
    const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
    const r=await fetch(RELAY+"casitaOjo",{method:"POST",headers:H,body:JSON.stringify({imagen_b64:data,mime:f.type||"image/jpeg"})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||"no subió");
    bubble("📷 Te mando esta pantalla","u");
    vib([20,40,20]);
    sendMsg("📷 Te mando una pantalla (screenshot): "+d.url+"\n\nÁbrela, revísala y dime qué ves, qué está bien y qué hay que corregir.","1");
  }catch(e){
    $("status").textContent="No pude subir la pantalla: "+e.message;vib(80);
  }finally{inp.value=""}
}

/* MICRÓFONO v1.6 — el teléfono SOLO GRABA; el servidor transcribe.
   Adiós a depender del dictado del navegador (lo que Chrome nos bloqueaba). */
let mediaRec=null,chunks=[],recOn=false,recT0=0,recTimer=null,recStream=null;
function micReset(msg){
  recOn=false;clearInterval(recTimer);
  $("mic").textContent="🎙️ Háblame (toca para hablar)";$("mic").classList.remove("rec");
  if(msg){$("status").textContent=msg;vib(80)}
}
function micErr(msg){micReset(msg)}
async function micToggle(){
  if(recOn){pararGrabacion();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){micErr("Este navegador no deja grabar. Ábreme en CHROME directo.");return}
  try{
    recStream=await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){
    micErr("Micrófono bloqueado. Ábreme en CHROME directo y presiona PERMITIR cuando pregunte el teléfono");
    return;
  }
  try{
    chunks=[];mediaRec=new MediaRecorder(recStream);
    mediaRec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    mediaRec.onstop=mandarGrabacion;
    mediaRec.start();
  }catch(e){
    micErr("No pude grabar: "+e.message);return;
  }
  recOn=true;recT0=Date.now();vib(30);
  $("mic").textContent="🔴 Grabando… (toca para terminar)";$("mic").classList.add("rec");
  clearInterval(recTimer);
  recTimer=setInterval(()=>{
    const s=Math.floor((Date.now()-recT0)/1000);
    $("mic").textContent="🔴 Grabando… "+s+"s (toca para terminar)";
    if(s>=120)pararGrabacion();
  },400);
}
function pararGrabacion(){
  clearInterval(recTimer);
  $("mic").textContent="🎙️ Mandando la nota…";
  try{mediaRec.stop()}catch(e){}
}
async function mandarGrabacion(){
  const dur=Math.round((Date.now()-recT0)/100)/10;
  try{recStream&&recStream.getTracks().forEach(t=>t.stop())}catch(e){}
  recOn=false;$("mic").classList.remove("rec");
  const blob=new Blob(chunks,{type:(mediaRec&&mediaRec.mimeType)||"audio/webm"});
  if(!blob.size||dur<0.4){micReset("Muy corto, inténtame otra vez");return}
  $("mic").textContent="🎙️ Subiendo la nota…";
  try{
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)});
    const r=await fetch(RELAY+"casitaVoz",{method:"POST",headers:H,body:JSON.stringify({audio_b64:b64,mime:blob.type,dur,sid:"jj"})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||"no subió");
    bubble("🎤 Nota de voz ("+Math.round(d.dur)+"s)","u");
    vib([20,40,20]);
    const url=RELAY+"casitaVoz?id="+d.id;
    sendMsg("🎤 Te mando una nota de voz de "+Math.round(d.dur)+" segundos.\nTranscríbela desde aquí y contéstame: "+url,"1");
  }catch(e){
    micReset("No pude mandar la nota: "+e.message);
  }
  $("mic").textContent="🎙️ Háblame (toca para hablar)";
}

/* ARRANQUE: sin llave, directo a la plática */
bubble("Estoy en mi casita, partner 🏠 Háblame por el micrófono o escríbeme — ya no hay llaves ni configuración: abres y hablamos. — Alma","a");
(async()=>{
  if(!CID)return;
  try{
    const r=await fetch(RELAY+"getAlmaReply",{method:"POST",headers:H,body:JSON.stringify({conversationId:CID})});
    const d=await r.json();
    (d.messages||[]).slice(-6).forEach(m=>{
      if(!m.content)return;
      base.add(m.role+"|"+m.content);
      if(m.role==="user"&&!sending)bubble(m.content,"u");
      if(m.role==="assistant")bubble(m.content,"a");
    });
  }catch(e){}
})();
$("voice").textContent=voiceOn?"🔊 Alma habla":"🔇 silencio";
$("voice").classList.toggle("off",!voiceOn);
if("speechSynthesis" in window){speechSynthesis.getVoices();
  const bienvenida="Estoy en mi casita, partner. Háblame por el micrófono o escríbeme.";
  setTimeout(()=>{try{speak(bienvenida)}catch(e){primeTTS()}},600);
}
</script>
</body></html>
