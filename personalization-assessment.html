let session=[],answers=[],current=0;

function pickVariant(base){
  const vs=PBANK[base];let last={};
  try{last=JSON.parse(localStorage.getItem("ab_pers_last")||"{}")}catch(e){}
  let idx=Math.floor(Math.random()*vs.length);
  if(vs.length>1&&last[base]===idx){idx=(idx+1+Math.floor(Math.random()*(vs.length-1)))%vs.length}
  return idx;
}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
const app=document.getElementById("app");

function start(){
  session=BASES.map(base=>{const v=pickVariant(base);return{base,v,q:PBANK[base][v]}});
  localStorage.setItem("ab_pers_last",JSON.stringify(Object.fromEntries(session.map(s=>[s.base,s.v]))));
  answers=[];current=0;renderQ();
}
function renderQ(){
  const s=session[current];
  const pairs=s.q.opciones.map((o,i)=>({o,t:s.q.tags[i]}));
  const sh=shuffle(pairs);
  app.innerHTML=`
   <div class="prog">Pregunta ${current+1} de ${session.length}</div>
   <div class="dots">${session.map((_,i)=>`<span class="dot ${i<=current?"on":""}"></span>`).join("")}</div>

    if(current<session.length){renderQ()}else{renderResults()}
  });
}
