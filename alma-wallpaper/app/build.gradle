plugins {
    id 'com.android.application'
}

android {
    namespace 'com.myl.alma'
    compileSdk 34

    defaultConfig {
        applicationId "com.myl.alma"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "0.1.3"
    }

    // Firma ESTABLE (vive en el repo) — asi los updates siempre instalan
    // sin el error de firma que causo el sandbox regenerado.
    signingConfigs {
        alma {
            storeFile file("alma.keystore")
            storePassword "alma2026cl"
            keyAlias "alma"
            keyPassword "alma2026cl"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.alma
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.alma
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
