<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a0a2e" />
  <title>AccentBridges Virtual City</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body, #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
      color: white;
      z-index: 9999;
      transition: opacity 0.5s;
    }
    
    #loading.fade {
      opacity: 0;
      pointer-events: none;
    }
    
    .loading-logo {
      font-size: 3rem;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }
    
    .loading-text {
      font-size: 1.2rem;
      opacity: 0.7;
      letter-spacing: 2px;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.95); }
    }
  </style>
  <script type="module" crossorigin src="/AccentBridges/virtual-city/assets/index-Dc4aAQqR.js"></script>
</head>
<body>
  <div id="loading">
    <div class="loading-logo">🌌</div>
    <div class="loading-text">Loading Virtual City...</div>
  </div>
  <div id="root"></div>
</body>
</html>
