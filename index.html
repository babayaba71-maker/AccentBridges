<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valerie 3 — Connecting...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px; text-align: center;
        }
        .logo { font-size: 3rem; margin-bottom: 20px; animation: bounce 1s infinite; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        h1 { font-size: 1.5rem; margin-bottom: 10px; }
        p { color: #a0a0d0; font-size: 1rem; }
        .spinner {
            margin-top: 30px; width: 50px; height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #ff6b6b;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn {
            display: none; margin-top: 30px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            color: white; text-decoration: none;
            padding: 18px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 700;
            box-shadow: 0 8px 24px rgba(238,90,111,0.4);
        }
    </style>
</head>
<body>
    <div class="logo">🎙️</div>
    <h1>Valerie 3</h1>
    <p>Connecting to your accent coach...</p>
    <div class="spinner" id="spinner"></div>
    <a href="https://valerie.base44.app/functions/valerieCall" class="btn" id="enterBtn">🚀 Entrar a la Sesión</a>

    <script>
        // Redirect to backend function which creates a fresh Vapi call
        // and returns a Daily.co room URL with proper mic permissions
        setTimeout(function() {
            window.location.href = 'https://valerie.base44.app/functions/valerieCall';
        }, 1500);
        
        // Fallback button if redirect doesn't fire
        setTimeout(function() {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('enterBtn').style.display = 'inline-block';
        }, 5000);
    </script>
</body>
</html>
