<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flashcards — Sentidos + Ser</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,#0d1b2a,#1b263b 60%,#2a9d8f 140%);min-height:100vh;color:#fff;display:flex;flex-direction:column;align-items:center;padding:14px;max-width:520px;margin:0 auto}
h1{font-size:1.25rem;text-align:center;margin:6px 0 2px}
.sub{font-size:.8rem;color:#a8dadc;text-align:center;margin-bottom:10px}
.card{background:#fff;color:#1b263b;border-radius:22px;width:100%;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);text-align:center}
img.flash{width:100%;max-height:44vh;object-fit:cover;border-radius:14px;pointer-events:none}
.paso{font-size:.72rem;color:#6c757d;margin:10px 0 6px;letter-spacing:.5px;text-transform:uppercase;font-weight:700}
button{border:0;border-radius:14px;font-size:1rem;font-weight:700;padding:13px 18px;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.96)}
.big{background:#2a9d8f;color:#fff;width:100%;font-size:1.05rem}
.listen{background:#e9c46a;color:#1b263b}
.hidden{display:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{background:#f1faee;color:#1b263b;border:3px solid #2a9d8f;font-size:1.15rem;padding:15px}
.opt.ok{background:#2a9d8f;color:#fff}
.opt.no{background:#e76f51;color:#fff;border-color:#e76f51}
.veri{font-size:.85rem;color:#6c757d;margin-top:8px;font-style:italic}
.fb{margin-top:12px;font-size:1.05rem;font-weight:800;min-height:1.4em}
.fb.ok{color:#2a9d8f}.fb.no{color:#e76f51}
.next{background:#1b263b;color:#fff;margin-top:12px;width:100%}
input{width:100%;border:3px solid #2a9d8f;border-radius:14px;padding:13px;font-size:1rem;margin:8px 0}
.end{font-size:1.6rem;font-weight:900;color:#2a9d8f;margin:14px 0 4px}
.meta{font-size:.8rem;color:#6c757d;line-height:1.5;margin-top:10px}
.bq{margin-top:10px;font-size:.8rem;color:#264653}
.score{position:absolute;top:10px;right:12px;background:rgba(255,255,255,.15);border-radius:10px;padding:4px 10px;font-size:.75rem;font-weight:700}
.wrap{position:relative;width:100%}
audio{display:none}
</style>
</head>
<body>
<div class="wrap"><span class="score" id="score"></span></div>
<h1>🎴 Sentidos + Ser</h1>
<div class="sub">Flashcards — muestra del módulo (6 tarjetas)</div>

<!-- PANTALLA 0: nombre -->
<div class="card" id="p0">
  <div class="paso">antes de empezar</div>
  <h2 style="margin:8px 0">¿Cómo te llamas?</h2>
  <input id="name" placeholder="Tu nombre" autocomplete="off">
  <button class="big" onclick="start()">¡Empezar! 🎴</button>
  <div class="meta">Mira la imagen, escucha el inglés y elige.<br>Piensa tu respuesta ANTES de ver las opciones 😉</div>
</div>

<!-- PANTALLA 1: tarjeta -->
<div class="card hidden" id="p1">
  <div class="paso" id="mazoTag"></div>
  <img class="flash" id="img" src="" alt="">
  <button class="listen" style="margin-top:10px;width:100%" onclick="say(cur.audio,0.85)">🔊 Escuchar</button>
  <button class="big hidden" id="rev" style="margin-top:10px" onclick="reveal()">Ya pensé mi respuesta 👇</button>
  <div class="opts hidden" id="opts"></div>
  <div class="fb" id="fb"></div>
  <div class="veri hidden" id="veri"></div>
  <button class="next hidden" id="next" onclick="nx()">Siguiente tarjeta →</button>
</div>

<!-- PANTALLA 2: final -->
<div class="card hidden" id="p2">
  <div class="end" id="endTitle"></div>
  <div id="endMsg" style="font-size:.95rem;line-height:1.5"></div>
  <div class="bq" id="bq"></div>
  <button class="big" style="margin-top:14px" onclick="location.reload()">Jugar otra vez 🔁</button>
</div>

<script>
// ====== MAZO DE MUESTRA (6 tarjetas aprobadas por Seeley, 10-oct-2026) ======
const DECK=[
 {id:"m1_01",senal:"pronombre",img:"https://media.base44.com/images/public/69c78b20df328cd2f8bbcc29/572955dbe_generated_image.png",audio:"I am strong.",opts:["I","he","you"],correcta:"I",veri:"yo soy fuerte"},
 {id:"m1_05",senal:"pronombre",img:"https://media.base44.com/images/public/69c78b20df328cd2f8bbcc29/468f86589_generated_image.png",audio:"He is tired.",opts:["he","she","it"],correcta:"he",veri:"él está cansado"},
 {id:"m2_04",senal:"morfema_s",img:"https://media.base44.com/images/public/69c78b20df328cd2f8bbcc29/6511daaf4_generated_image.png",audio:"She touches the dog.",opts:["touch","touches"],correcta:"touches",veri:"ella toca al perro"},
 {id:"m2_05",senal:"morfema_s",img:"https://media.base44.com/images/public/69c78b20df328cd2f8bbcc29/5d1e95301_generated_image.png",audio:"It touches the ball.",opts:["touch","touches"],correcta:"touches",veri:"(eso) toca la pelota"},
 {id:"s_v1",senal:"vocabulario",img:"https://media.base44.com/images/public/69c78b20df328cd2f8bbcc29/e6e3d5013_generated_image.png",audio:"see",opts:["see","hear","smell","taste"],correcta:"see",veri:"ver"},
 {id:"s_t1",senal:"vocabulario",img:"https://media.base44.com/images/public/69c78b20df328cd2f8bbcc29/60e52746c_generated_image.png",audio:"hot",opts:["hot","cold","warm","soft"],correcta:"hot",veri:"caliente"}
];
const MAZO_TAG={pronombre:"Mazo 1 · Pronombres",to_be:"Mazo 1 · To be",morfema_s:"Mazo 2 · El sombrero -s",vocabulario:"Mazo 3 · Sentidos"};
const BQ_TAP="https://valerie.base44.app/functions/logFlashcardTap";
const BQ_SES="https://valerie.base44.app/functions/logMorfofonoSession";
const KEY="ABVC-PILOTO-2026";
let NAME="",cur=null,idx=0,ok=0,tot=0,queue=[],repeats=[],tries=0,T0=0,logS=[];

function say(txt,rate){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang="en-US";u.rate=rate||0.9;const v=speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
document.addEventListener("click",()=>{try{speechSynthesis.getVoices()}catch(e){}},{once:true});

function start(){
  NAME=(document.getElementById("name").value||"Estudiante").trim().slice(0,40);
  queue=DECK.slice();idx=0;ok=0;tot=0;T0=Date.now();
  document.getElementById("p0").classList.add("hidden");
  showCard();
}
function showCard(){
  cur=queue[idx];tries=0;
  document.getElementById("p1").classList.remove("hidden");
  document.getElementById("mazoTag").textContent=MAZO_TAG[cur.senal]+" · "+(idx+1)+" de "+queue.length;
  document.getElementById("img").src=cur.img;
  document.getElementById("rev").classList.remove("hidden");
  document.getElementById("opts").classList.add("hidden");document.getElementById("opts").innerHTML="";
  document.getElementById("fb").textContent="";document.getElementById("fb").className="fb";
  document.getElementById("veri").classList.add("hidden");
  document.getElementById("next").classList.add("hidden");
  document.getElementById("score").textContent="⭐ "+ok+"/"+tot;
  setTimeout(()=>say(cur.audio,0.85),400);
}
function reveal(){
  document.getElementById("rev").classList.add("hidden");
  const o=document.getElementById("opts");o.classList.remove("hidden");o.innerHTML="";
  cur.opts.forEach(op=>{
    const b=document.createElement("button");b.className="opt";b.textContent=op;
    b.onclick=()=>tap(op,b);o.appendChild(b);
  });
}
function tap(op,btn){
  tries++;tot++;logS.push(cur.senal+":"+(op===cur.correcta?"✓":"✗")+"("+tries+")");
  const good=(op===cur.correcta);
  const id=cur.id+"|"+tries;
  // expediente: cada tap → QuizResponse (señal legible por el ruteador)
  try{fetch(BQ_TAP,{method:"POST",headers:{"Content-Type":"application/json","api_key":KEY},
    body:JSON.stringify({studentName:NAME,quizType:"flashcard",questionId:id,choice:op,correct:good,word:cur.audio,channel:"ojo"})}).catch(()=>{})}catch(e){}
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.textContent===cur.correcta)b.classList.add("ok")});
  const fb=document.getElementById("fb");
  if(good){
    if(tries===1)ok++;else ok++; // acierto cuenta 1 (el intento de la tarjeta, no por try)
    say(cur.audio,0.85);fb.textContent="✅ ¡Sí!";fb.className="fb ok";
  }else{
    btn.classList.add("no");say(cur.audio,0.75);fb.textContent="✗ Escucha otra vez…";fb.className="fb no";
    if(tries<2){
      setTimeout(()=>{ // reintento: la tarjeta se re-arma
        document.querySelectorAll(".opt").forEach(b=>{b.disabled=false;b.classList.remove("ok","no")});
        fb.textContent="";say(cur.audio,0.7);
      },1400);
      return;
    }
    // 2 fallos → revelación honesta, tarjeta vuelve al final (repetición espaciada)
    if(!repeats.includes(cur.id)){cur.requeued=true;queue.push(cur);repeats.push(cur.id)}
    fb.textContent="✗ Era: "+cur.correcta;fb.className="fb no";
  }
  document.getElementById("veri").textContent="("+cur.veri+")";
  document.getElementById("veri").classList.remove("hidden");
  document.getElementById("next").classList.remove("hidden");
  document.getElementById("score").textContent="⭐ "+ok+"/"+tot;
}
function nx(){
  idx++;
  if(idx<queue.length){showCard()}
  else finish();
}
function finish(){
  document.getElementById("p1").classList.add("hidden");
  const p2=document.getElementById("p2");p2.classList.remove("hidden");
  const acc=queue.length?Math.round(100*ok/queue.length):0;
  document.getElementById("endTitle").textContent="⭐ "+ok+" de "+queue.length+" ("+acc+"%)";
  document.getElementById("endMsg").innerHTML=acc>=80?"¡Los sentidos y el ser ya son de casa! 🎉":acc>=50?"¡Bien! Repite para que se vuelvan de casa 💪":"Mira y escucha otra vez — el ojo se afina con cada vuelta 👀";
  // sesión → PracticeSession (resumen para la Maestra)
  const sid="fc-"+Date.now();
  const rec={topic:"Flashcards Sentidos+Ser — Muestra (6 tarjetas)",location:"Culiacán",accuracy:acc,passed:acc>=70,
    spokenText:"flashcards · "+ok+"/"+queue.length+" · señales: "+logS.join(", ")+((repeats.length)?" · repite:"+repeats.join(","):" · sin repetidos"),
    challengeSentence:repeats.join(",")||"—",userId:NAME,sessionId:sid};
  try{fetch(BQ_SES,{method:"POST",headers:{"Content-Type":"application/json","api_key":KEY},body:JSON.stringify(rec)})
    .then(r=>r.json()).then(j=>{document.getElementById("bq").innerHTML=(j&&j.ok)?"<b>Expediente:</b> ✅ enviado. La Maestra ya lo puede leer.":"<b>Expediente:</b> ⚠️ el servidor no aceptó — repite más tarde."})
    .catch(()=>{document.getElementById("bq").innerHTML="<b>Expediente:</b> ⚠️ sin conexión."})}catch(e){}
}
</script>
</body>
</html>
