<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario — ¿Qué palabras conoces de verdad?</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% 0%,#0a2033,#040a12 70%);color:#fff;
 font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding:18px 14px 40px}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:19px;letter-spacing:.14em;color:#00f0ff;text-align:center;margin:6px 0 2px;font-weight:700}
.sub{text-align:center;color:#7d93a8;font-size:11px;letter-spacing:.12em;margin-bottom:16px}
.card{background:rgba(9,20,32,.9);border:1px solid #1c3a52;border-radius:16px;padding:18px;margin-bottom:14px}
.palabra{font-size:34px;font-weight:800;text-align:center;letter-spacing:.02em;margin:14px 0 4px}
.etq{text-align:center;color:#ffb700;font-size:10px;letter-spacing:.2em;margin-bottom:14px}
.preg{color:#9fb6c9;font-size:12px;letter-spacing:.06em;margin:16px 0 8px;text-transform:uppercase}
button.op{display:block;width:100%;text-align:left;background:#0b1a28;color:#dbe9f4;border:1px solid #24465f;
 border-radius:12px;padding:13px 14px;font-size:15px;margin-bottom:9px;cursor:pointer;font-family:inherit}
button.op:active{background:#0d2436}
button.op.ok{background:#08301f;border-color:#00c07a;color:#9ff5cd}
button.op.no{background:#301015;border-color:#c0392b;color:#ffb3ad}
button.op:disabled{opacity:.75}
.barra{height:5px;background:#12293c;border-radius:99px;overflow:hidden;margin-bottom:16px}
.barra i{display:block;height:100%;background:linear-gradient(90deg,#00f0ff,#007bff);width:0%;transition:width .25s}
.big{font-size:52px;text-align:center;font-weight:800;margin:8px 0}
.bloques{display:flex;gap:10px;margin:16px 0}
.bl{flex:1;background:#0a1b29;border:1px solid #1e3d55;border-radius:12px;padding:10px 6px;text-align:center}
.bl b{display:block;font-size:22px}
.bl span{font-size:9px;color:#7d93a8;letter-spacing:.08em}
.cta{display:block;width:100%;background:linear-gradient(90deg,#00f0ff,#007bff);color:#04121f;border:0;
 border-radius:14px;padding:16px;font-size:16px;font-weight:800;letter-spacing:.06em;cursor:pointer;font-family:inherit}
.hero{text-align:center;color:#c8dced;font-size:14px;line-height:1.55}
.hint{color:#7d93a8;font-size:12px;line-height:1.5;margin-top:8px}
.gano{color:#00e0a0}.pierde{color:#ff8b80}
</style>
</head>
<body>
<div class="wrap">
  <h1>INVENTARIO</h1>
  <div class="sub">¿QUÉ PALABRAS CONOCES DE VERDAD?</div>
  <div id="app"></div>
</div>
<script>
const ITEMS = [["cat", "contenido", "gato", "perro", "casa", "nombra"], ["water", "contenido", "agua", "fuego", "viento", "nombra"], ["house", "contenido", "casa", "carro", "calle", "nombra"], ["baby", "contenido", "bebé", "abuela", "vecino", "nombra"], ["mother", "contenido", "madre", "hermano", "doctor", "nombra"], ["school", "contenido", "escuela", "tienda", "iglesia", "nombra"], ["food", "contenido", "comida", "ropa", "dinero", "nombra"], ["car", "contenido", "carro", "bicicleta", "avión", "nombra"], ["night", "contenido", "noche", "mañana", "tarde", "nombra"], ["hand", "contenido", "mano", "pie", "cabeza", "nombra"], ["dignity", "contenido", "dignidad", "velocidad", "cantidad", "nombra"], ["wisdom", "contenido", "sabiduría", "juventud", "enfermedad", "nombra"], ["empathy", "contenido", "empatía", "energía", "economía", "nombra"], ["passport", "contenido", "pasaporte", "boleto", "recibo", "nombra"], ["opportunity", "contenido", "oportunidad", "obligación", "operación", "nombra"], ["evidence", "contenido", "evidencia", "experiencia", "elegancia", "nombra"], ["challenge", "contenido", "desafío", "chaleco", "cambio", "nombra"], ["community", "contenido", "comunidad", "compañía", "competencia", "nombra"], ["honesty", "contenido", "honestidad", "habilidad", "humildad", "nombra"], ["effort", "contenido", "esfuerzo", "efecto", "error", "nombra"], ["to", "funcion", "hacia / para (dirección)", "también", "todo", "relacion"], ["of", "funcion", "de (pertenencia)", "o (alternativa)", "fuera", "relacion"], ["and", "funcion", "y (suma)", "o (alternativa)", "pero", "conecta"], ["but", "funcion", "pero (contraste)", "y (suma)", "porque", "conecta"], ["because", "funcion", "porque (causa)", "aunque", "entonces", "conecta"], ["with", "funcion", "con (compañía)", "sin", "contra", "relacion"], ["for", "funcion", "para (destino)", "por (a través)", "desde", "relacion"], ["in", "funcion", "en / dentro de", "sobre / encima", "debajo", "relacion"], ["on", "funcion", "sobre / encima de", "dentro de", "entre", "relacion"], ["will", "funcion", "marca el futuro", "marca el pasado", "marca el plural", "tiempo"], ["have", "funcion", "tener / haber (posesión)", "hacer (acción)", "decir", "posesion"], ["my", "funcion", "mi (posesión)", "me (objeto)", "yo (sujeto)", "posesion"]];
const FUN = {
  nombra:"Nombra algo (persona, cosa o idea)",
  accion:"Es una acción",
  conecta:"Conecta dos ideas",
  tiempo:"Marca tiempo o futuro",
  posesion:"Indica posesión",
  relacion:"Indica relación, lugar o dirección"
};
const EXP_URL="https://valerie.base44.app/functions/logMorfofonoSession";
const EXP_KEY="ABVC-PILOTO-2026";
let i=0, fase=0, ok=0, total=0, res={b1:[0,0],b2:[0,0],b3:[0,0]}, nombre="";

const app=document.getElementById('app');
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

function inicio(){
  app.innerHTML=`<div class="card"><div class="hero">
    Te voy a mostrar 32 palabras <b>escritas</b>. Nada de audio.<br>
    Por cada una hay dos preguntas: <b>qué significa</b> y <b>qué papel hace</b> en la frase.<br><br>
    No es un examen para castigarte: es un mapa para saber qué te falta y qué ya tienes.
    </div>
    <div class="preg">¿Cómo te llamas?</div>
    <input id="nom" placeholder="Tu nombre" style="width:100%;background:#0b1a28;border:1px solid #24465f;color:#fff;
      border-radius:12px;padding:14px;font-size:16px;font-family:inherit;margin-bottom:14px">
    <button class="cta" onclick="empezar()">▶ EMPEZAR</button>
    <div class="hint">Toma 5 o 6 minutos. Puedes parar cuando quieras y volver después.</div>
    </div>`;
}
function empezar(){
  nombre=(document.getElementById('nom').value||"Estudiante").trim().slice(0,30);
  i=0;ok=0;total=0;fase=0;res={b1:[0,0],b2:[0,0],b3:[0,0]};draw();
}
function bloque(){ return i<10?"b1":(i<20?"b2":"b3"); }
function draw(){
  if(i>=ITEMS.length) return fin();
  const it=ITEMS[i];
  const [w,tipo,sig1,sig2,sig3,fun]=it;
  const pct=Math.round((i*2)/(ITEMS.length*2)*100);
  const etiqueta = tipo==="contenido" ? (i<10?"PALABRA BÁSICA":"PALABRA AVANZADA") : "PALABRA DE FUNCIÓN";
  app.innerHTML=`
   <div class="barra"><i style="width:${pct}%"></i></div>
   <div class="card">
     <div class="palabra">${w}</div>
     <div class="etq">${etiqueta}</div>
     ${fase===0? `<div class="preg">1 · ¿Qué significa?</div><div id="ops"></div>`
                : `<div class="preg">2 · ¿Qué papel hace en la frase?</div><div id="ops"></div>`}
   </div>`;
  const ops=document.getElementById('ops');
  if(fase===0){
    shuffle([[sig1,1],[sig2,0],[sig3,0]]).forEach(([txt,bien],k)=>{
      const b=document.createElement('button');b.className='op';b.textContent=txt;
      b.onclick=()=>{res[bloque()][1]++;total++;if(bien){ok++;res[bloque()][0]++;b.classList.add('ok');}
        else{b.classList.add('no');[...ops.children].forEach(c=>{if(c.textContent===sig1)c.classList.add('ok')});}
        [...ops.children].forEach(c=>c.disabled=true);setTimeout(()=>{fase=1;draw()},420)};
      ops.appendChild(b);
    });
  } else {
    const claves=shuffle(Object.keys(FUN));
    claves.forEach(k=>{
      const b=document.createElement('button');b.className='op';b.textContent=FUN[k];
      b.onclick=()=>{res[bloque()][1]++;total++;const bien=(k===fun);
        if(bien){ok++;res[bloque()][0]++;b.classList.add('ok');}
        else{b.classList.add('no');[...ops.children].forEach(c=>{if(c.textContent===FUN[fun])c.classList.add('ok')});}
        [...ops.children].forEach(c=>c.disabled=true);setTimeout(()=>{i++;fase=0;draw()},420)};
      ops.appendChild(b);
    });
  }
}
function fin(){
  const pct=Math.round(ok/total*100);
  const p1=res.b1[1]?Math.round(res.b1[0]/res.b1[1]*100):0;
  const p2=res.b2[1]?Math.round(res.b2[0]/res.b2[1]*100):0;
  const p3=res.b3[1]?Math.round(res.b3[0]/res.b3[1]*100):0;
  let diag, cura;
  if(p3<p1-15 && p3<70){
    diag="Conoces el SIGNIFICADO de las palabras, pero las PALABRAS DE FUNCIÓN (to, of, and, will…) se te escapan. Ese es exactamente el hueco: no es vocabulario, es la bisagra del inglés.";
    cura="Tu siguiente paso NO son más palabras nuevas: son las 40 palabras de función en frases cortas, hasta que salgan solas.";
  } else if(p2<p1-15){
    diag="Lo básico está firme, pero el vocabulario abstracto todavía no aterriza. Eso es normal: son palabras que casi nunca oyes en conversación diaria.";
    cura="Tu siguiente paso es vocabulario de contenido en contexto real (frases, no listas).";
  } else if(pct>=80){
    diag="Tienes el inventario sólido: significado y función. Lo que falta no es vocabulario, es usarlo hablando.";
    cura="Tu siguiente paso es producción: frases completas con estas palabras, en voz alta.";
  } else {
    diag="Hay huecos repartidos entre significado y función. La buena noticia: los dos se entrenan igual, con contexto.";
    cura="Tu siguiente paso es leer y escuchar frases cortas con estas palabras, no listas sueltas.";
  }
  app.innerHTML=`
   <div class="card">
     <div class="sub" style="margin-bottom:4px">TU INVENTARIO</div>
     <div class="big">${pct}%</div>
     <div class="bloques">
       <div class="bl"><b class="${p1>=70?'gano':'pierde'}">${p1}%</b><span>BÁSICAS</span></div>
       <div class="bl"><b class="${p2>=70?'gano':'pierde'}">${p2}%</b><span>AVANZADAS</span></div>
       <div class="bl"><b class="${p3>=70?'gano':'pierde'}">${p3}%</b><span>DE FUNCIÓN</span></div>
     </div>
     <div class="hero" style="text-align:left">${diag}</div>
     <div class="hint"><b>Qué sigue:</b> ${cura}</div>
   </div>
   <div class="card hero">Tu resultado ya quedó guardado con tu nombre.<br>
     <span class="hint">Si vuelves a hacerlo en dos semanas, comparamos.</span></div>
   <button class="cta" onclick="inicio()">HACERLO OTRA VEZ</button>`;
  try{
    localStorage.setItem("inventario_"+nombre, JSON.stringify({nombre,pct,p1,p2,p3,cuando:Date.now()}));
  }catch(e){}
  try{
    fetch(EXP_URL,{method:"POST",headers:{"Content-Type":"application/json",api_key:EXP_KEY},
      body:JSON.stringify({
        topic:"Inventario — vocabulario receptivo y función",
        userId:nombre,
        passed:pct>=70, accuracy:pct,
        challengeSentence:"32 palabras: significado + función",
        spokenText:"inventario · basico:"+p1+"% avanzado:"+p2+"% funcion:"+p3+"% · total:"+pct+"%",
        location:"Inventario",
        sessionId:"inv-"+Date.now()
      })}).catch(()=>{});
  }catch(e){}
}
inicio();
</script>
</body>
</html>
