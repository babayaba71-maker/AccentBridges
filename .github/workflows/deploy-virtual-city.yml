name: Deploy Virtual City to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'virtual-city/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: virtual-city/package.json

      - name: Install dependencies
        working-directory: virtual-city
        run: npm install

      - name: Build
        working-directory: virtual-city
        run: npm run build
        env:
          VITE_BASE_PATH: /AccentBridges/virtual-city/

      - name: Add .nojekyll
        run: touch virtual-city/dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: virtual-city/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
